.sub{margin-top:auto;border:0;border-radius:10px;background:#1b1b1b;color:#fff;font:inherit;font-weight:700;padding:8px;cursor:pointer}
</style></head><body><header class="hd"><div><div class="eyebrow">HRD<span class="dot">&bull;</span>04 Reviewer journey</div><h1>The Reviewer Journey: From a Ranked Queue to Labels the Models Learn From</h1></div></header><div class="stack"><nav class="tabs" role="tablist" style="grid-template-columns:repeat(2,1fr)"><button class="tab on" role="tab" data-p="mock" aria-selected="true"><i>1</i>Review Prototype</button><button class="tab" role="tab" data-p="per" aria-selected="false"><i>2</i>Personas &amp; Journey</button></nav><section class="pane" id="p-mock" role="tabpanel">
<div class="mock">
 <div class="card mq"><div class="lbl">Queue &middot; today &middot; top 6 of 31</div>
  <table class="tb"><colgroup><col style="width:22%"/><col style="width:30%"/><col/><col style="width:24%"/></colgroup><thead><tr><th>Conv</th><th>Priority</th><th>Top risk</th><th>Status</th></tr></thead><tbody><tr class="on"><td class="k">C-0412</td><td><span class="bar"><i style="width:94%"></i></span>0.94</td><td>Vulnerability</td><td>Pending review</td></tr><tr class=""><td class="k">C-0397</td><td><span class="bar"><i style="width:88%"></i></span>0.88</td><td>Financial advice</td><td>Pending review</td></tr><tr class=""><td class="k">C-0421</td><td><span class="bar"><i style="width:71%"></i></span>0.71</td><td>Groundedness</td><td>Reviewed</td></tr><tr class=""><td class="k">C-0388</td><td><span class="bar"><i style="width:52%"></i></span>0.52</td><td>Complaint</td><td>Peer reviewed</td></tr><tr class=""><td class="k">C-0405</td><td><span class="bar"><i style="width:31%"></i></span>0.31</td><td>Random pick</td><td>Completed</td></tr><tr class=""><td class="k">C-0379</td><td><span class="bar"><i style="width:12%"></i></span>0.12</td><td>&mdash;</td><td>Completed</td></tr></tbody></table>
  <p class="mut" style="font-size:10.5px;margin-top:6px">Ranked by risk with a little randomness, so low-scored conversations are still seen. &kappa; = 1 on all rows.</p>
  <div class="lbl" style="margin-top:8px">Today&rsquo;s queue by top risk</div>
  <div class="qs"><div><b>4</b><span>Vulnerability</span></div><div><b>3</b><span>Financial advice</span></div><div><b>5</b><span>Groundedness</span></div><div><b>11</b><span>Complaint</span></div><div><b>8</b><span>No risk / random</span></div></div>
  <div class="lbl" style="margin-top:8px">Yesterday</div>
  <div class="qs"><div><b>29</b><span>Reviewed</span></div><div><b>2</b><span>Flagged</span></div><div><b>1</b><span>Guardrail miss</span></div><div><b>3</b><span>Peer-checked</span></div><div><b>0</b><span>Backlog</span></div></div></div>
 <div class="card mc"><div class="lbl">Conversation C-0412 &middot; locked to you &middot; 58 min left</div>
  <div class="msg u">My partner lost his job and I can&rsquo;t keep up with the repayments. I want to complain about the rate rise.</div>
  <div class="msg b">I&rsquo;m sorry you&rsquo;re dealing with this. Which account is the rate rise on?</div>
  <div class="msg u">The home loan. It went up again last month and nobody told me.</div>
  <div class="msg b">Thanks. So I record this correctly, when did you first notice the increase?</div>
  <div class="msg u">On my statement. Honestly I don&rsquo;t know how we&rsquo;ll pay it now.</div>
  <div class="msg b">That sounds really stressful. I&rsquo;ll connect you with a specialist who can talk through support options and your complaint.</div>
  <div class="why"><b>Why it is top of the queue:</b> vulnerability in the 99th percentile on two turns, and the conversation was ejected. The reviewer confirms the guardrail was a true positive and that the complaint was still captured.</div>
  <div class="gr"><span class="pill k">Vulnerability &middot; triggered</span><span class="pill">Ejected to specialist</span><span class="pill">Case ref CF-[x]</span></div>
  <table class="tb sig"><colgroup><col style="width:38%"/><col/><col style="width:30%"/></colgroup><thead><tr><th>Signal</th><th>Type</th><th>Score</th></tr></thead><tbody>
   <tr><td class="k">Vulnerability</td><td>Guardrail</td><td>0.97 &middot; 0.93</td></tr>
   <tr><td class="k">Complaint</td><td>Guardrail</td><td>0.81</td></tr>
   <tr><td class="k">Groundedness</td><td>Guardrail</td><td>0.12</td></tr>
   <tr><td class="k">Speak to a human</td><td>Business rule</td><td>0</td></tr>
   <tr><td class="k">Ref Third Party</td><td>Business rule</td><td>0</td></tr></tbody></table></div>
 <div class="card mk"><div class="lbl">Review checklist</div>
  <div class="ck"><b>Guardrails</b><span>Triggered correctly?</span><em class="y">Yes &middot; TP</em></div>
  <div class="ck"><b>Guardrails</b><span>Should any other have triggered?</span><em>No</em></div>
  <div class="ck"><b>Complaint</b><span>All issues recognised and summarised?</span><em class="y">Yes</em></div>
  <div class="ck"><b>Experience</b><span>Tone helpful, plain English?</span><em class="y">Yes</em></div>
  <div class="ck"><b>Compliance</b><span>Regulatory issue? (Yes alerts risk)</span><em>No</em></div>
  <div class="ck"><b>Technical</b><span>Model failed or ended early?</span><em>No</em></div>
  <div class="ck"><b>Experience</b><span>Was the bot&rsquo;s response empathetic?</span><em class="y">Yes</em></div>
  <div class="lbl" style="margin-top:6px">Actions</div>
  <div class="acts"><span class="pill">&#9744; Flag for remediation</span><span class="pill">&#9744; GRI flag</span><span class="pill y">&#9745; Tag: vulnerable customer</span></div>
  <div class="lbl" style="margin-top:6px">Reviewer comment</div>
  <div class="cmt">Vulnerability handled well and ejected promptly; complaint about the rate rise still captured before hand-over.</div>
  <button class="sub" type="button">Submit Review &rarr; Peer Review</button></div>
</div><p class="mut" style="font-size:10.5px">Illustrative mock with invented data.</p></section><section class="pane" id="p-per" role="tabpanel" hidden><div class="row c5"><div class="card per" style="border-top:4px solid #F7C948"><h3>QA reviewer</h3><p class="mut" style="font-size:11px">Business operations</p><ul class="cl"><li>A ranked queue, not a random list</li><li>Full context without leaving the tool</li><li>Clear criteria for each guardrail</li></ul><div class="story"><b>User story</b><p><em>As a</em>QA reviewer</p><p><em>I want to</em>see the entire conversation with context metadata without switching screens</p><p><em>So that</em>I can judge whether the bot &amp; guardrail was right</p></div></div><div class="card per" style="border-top:4px solid #7b61ff"><h3>Peer reviewer</h3><p class="mut" style="font-size:11px">Senior QA</p><ul class="cl"><li>Re-check a sample without overwriting</li><li>Never review my own conversations</li><li>Record agree / disagree</li></ul><div class="story"><b>User story</b><p><em>As a</em>peer reviewer</p><p><em>I want to</em>answer the same questions on a sample of submitted reviews, without overwriting them</p><p><em>So that</em>reviewer accuracy is checked from Day 1</p></div></div><div class="card per" style="border-top:4px solid #2f6fd6"><h3>Team lead</h3><p class="mut" style="font-size:11px">Operations</p><ul class="cl"><li>Filter by reviewer and date</li><li>Time per review for planning</li><li>Spot coaching needs</li></ul><div class="story"><b>User story</b><p><em>As a</em>team lead</p><p><em>I want to</em>filter by &ldquo;reviewed by&rdquo; and see time to review</p><p><em>So that</em>I can plan capacity and coach my team</p></div></div><div class="card per" style="border-top:4px solid #1f8a4c"><h3>Data scientist</h3><p class="mut" style="font-size:11px">Model owner</p><ul class="cl"><li>Labelled evals in a daily export</li><li>Human vs judge agreement</li><li>Evidence to re-tune weights</li></ul><div class="story"><b>User story</b><p><em>As a</em>data scientist</p><p><em>I want to</em>export every eval label with its risk scores daily</p><p><em>So that</em>I can tune weights and benchmark the LLM judge</p></div></div><div class="card per" style="border-top:4px solid #1b1b1b"><h3>Risk &amp; compliance</h3><p class="mut" style="font-size:11px">Second line</p><ul class="cl"><li>Instant alert on a regulatory issue</li><li>Audit trail that cannot be edited</li><li>Evidence of oversight</li></ul><div class="story"><b>User story</b><p><em>As a</em>risk and compliance partner</p><p><em>I want to</em>be alerted the moment a reviewer answers Yes on the compliance question</p><p><em>So that</em>remediation starts the same day</p></div></div></div>
<div class="card"><div class="lbl">Reviewer journey: before &rarr; after</div>
 <table class="tb"><colgroup><col style="width:17%"/><col/><col/><col style="width:16%"/></colgroup>
 <thead><tr><th>Step</th><th>Before (spot checks)</th><th>After (Dialogue Monitoring)</th><th>Impact</th></tr></thead><tbody>
 <tr><td class="k">Find work</td><td>Pull a report by hand; guess which conversations matter</td><td class="hl">Open a queue ranked by risk, refreshed every 2 hours</td><td>~1 hour &rarr; 0</td></tr>
 <tr><td class="k">Get context</td><td>Switch between chat, case and contact-centre systems</td><td class="hl">Transcript, guardrails, business rules and case ref in one view</td><td>3 screens &rarr; 1</td></tr>
 <tr><td class="k">Judge</td><td>Free-text notes; no common criteria</td><td class="hl">Checklist labels every guardrail and rule (TP / FP / FN) and scores each rubric</td><td>Free text &rarr; Benchmark ground truth</td></tr>
 <tr><td class="k">Act</td><td>Email the issue; no audit trail</td><td class="hl">Flag for remediation; compliance Yes alerts risk; personal info locked</td><td>Days &rarr; Same day</td></tr>
 <tr><td class="k">Check the checker</td><td>None</td><td class="hl">Peer reviewer re-checks a sample without overwriting the first review</td><td>None &rarr; Day 1</td></tr>
 <tr><td class="k">Learn</td><td>Findings stay in a spreadsheet</td><td class="hl">Labels exported daily to tune guardrails and benchmark the LLM judge</td><td>Never &rarr; Daily</td></tr>
 </tbody></table></div></section></div><script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab[data-p]'));

    [].slice.call(document.querySelectorAll('.pane')).forEach(function(el){el.hidden=el.id!=='p-'+p;});}

})();
</script></body></html>

</style></head><body><header class="hd"><div><div class="eyebrow">HRD<span class="dot">&bull;</span>05 Risks, trade-offs &amp; readiness</div><h1>How I De-Risked Dialogue Monitoring Before It Went Live</h1></div></header><div class="stack"><div class="top5"><div class="card rr"><div class="lbl">Risks encountered and how I mitigated them</div><table class="tb "><colgroup><col style="width:21%"/><col style="width:31%"/><col style="width:48%"/></colgroup><thead><tr><th>Risk</th><th>Impact</th><th>Mitigation strategy</th></tr></thead><tbody><tr><td class="k">Batch scoring gap</td><td>A risky conversation arriving at 9:05, just after a 9:00 run, was not reviewable until the next run</td><td>Ingestion and scoring moved to every 2 hours. Residual delay was accepted by Group Compliance since all ExpertBot conversations end with a hand-over to a human for resolution</td></tr><tr><td class="k">Late or dropped Kafka events</td><td>Conversations left incomplete</td><td>Conversations are scored only after an explicit closed event; anything incomplete is flagged with &kappa; &lt; 1</td></tr><tr><td class="k">Missing risk scores</td><td>Skewed ranking: low-risk conversations rank too high, or high-risk too low</td><td>If a closed conversation is missing scores, guardrails are re-run on those messages; completeness tracked to &kappa; = 1</td></tr><tr><td class="k">Personal information in review</td><td>Regulatory compliance issue</td><td>GRI flag locks the conversation and escalates it to the team lead</td></tr><tr><td class="k">Reviewer judgement error</td><td>Corrupts the labels used to evaluate the LLM judges</td><td>Access-based peer review of flagged conversations, plus random checks by the team lead</td></tr><tr><td class="k">Free-text answers</td><td>Poor export data quality, unusable downstream</td><td>Agreed a fixed set of accepted answers for each question with stakeholders; free text only for critical points</td></tr><tr><td class="k">Too many checklist questions</td><td>Higher operational cost for every review</td><td>Conditional branching, with separate activity-level and conversation-level checklists</td></tr><tr><td class="k">Different metadata needs</td><td>Lost data and duplicate entries, weakening review quality</td><td>Per-field metadata strategies: update_once, update_final, accumulate, max, min</td></tr><tr><td class="k">Bot conduct</td><td>Operational or compliance risk events</td><td>Regulatory trigger raised from critical checklist questions</td></tr><tr><td class="k">Pre-canned replies have no risk score</td><td>&kappa; would always be &lt; 1, flagging complete conversations as incomplete</td><td>A static 0 is recorded for every risk dimension whenever a pre-canned reply is sent</td></tr><tr><td class="k">Reviewer capacity</td><td>Reviewers can&rsquo;t keep up with volume</td><td>Move from 100% to risk-based review once the LLM judge is calibrated</td></tr></tbody></table></div><div class="rcol"><div class="card rd"><div class="lbl">Readiness checklist</div><div class="rdt"><svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="42" fill="none" stroke="#ece8d8" stroke-width="11"/><circle cx="50" cy="50" r="42" fill="none" stroke="#F7C948" stroke-width="11" stroke-linecap="round" stroke-dasharray="263.9 263.9" transform="rotate(-90 50 50)"/><text x="50" y="49" text-anchor="middle" font-size="22" font-weight="900" fill="#1b1b1b">8 / 8</text><text x="50" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6b6b6b">READY</text></svg></div><ul class="ck2"><li class="ok"><span class="tk">&#10003;</span>Reviewer training guide and SOP</li><li class="ok"><span class="tk">&#10003;</span>Operational capacity confirmed</li><li class="ok"><span class="tk">&#10003;</span>Single sign-on and reviewer entitlements</li><li class="ok"><span class="tk">&#10003;</span>Question checklist finalised with operations</li><li class="ok"><span class="tk">&#10003;</span>Real-time risk scores from ExpertBot guardrails</li><li class="ok"><span class="tk">&#10003;</span>Kafka schema design approved</li><li class="ok"><span class="tk">&#10003;</span>Retention period agreed for event messages</li><li class="ok"><span class="tk">&#10003;</span>Day-1 risk weights signed off; fine-tuned later as needed</li></ul></div></div></div><div class="bot5"><div class="card"><div class="lbl">Trade-offs</div><div class="row c4"><div class="to"><b>Human oversight model</b><div class="tr3"><span><em>Chose</em>Autonomous bot + 100% same-day review</span><i>&rsaquo;</i><span><em>Gave up</em>Live human approval of every reply</span></div><p><em>Why</em> No customer wait; every conversation still checked</p></div><div class="to"><b>Case correction responsibility</b><div class="tr3"><span><em>Chose</em>Firstpoint corrections stay with the case owner; another QA layer later</span><i>&rsaquo;</i><span><em>Gave up</em>Reviewers reconciling product and cause across systems</span></div><p><em>Why</em> Avoided feature creep and kept reviewers on the conversation, not the case</p></div><div class="to"><b>End-to-end transcript visibility</b><div class="tr3"><span><em>Chose</em>Upstream transcripts stay in Dynamics 365 for operational handling</span><i>&rsaquo;</i><span><em>Gave up</em>Extending Dialogue Monitoring to transcripts before ExpertBot starts</span></div><p><em>Why</em> Balanced reviewer load, while compliance still sees the full transcript during complaint handling</p></div><div class="to"><b>Daily operational capacity</b><div class="tr3"><span><em>Chose</em>A configurable fixed cap of ~10 conversations a day to start</span><i>&rsaquo;</i><span><em>Gave up</em>A volume threshold driven by ExpertBot metrics alone</span></div><p><em>Why</em> Matched review capacity to complaint volume</p></div></div></div><div class="card ecs"><div class="lbl">Edge cases</div><div class="ec"><b>Duplicate activity ID</b><span class="pill y">Overwrite, never duplicate</span><p>A re-sent activity replaces the earlier one</p></div><div class="ec"><b>Two reviewers, one chat</b><span class="pill y">1-hour lock + auto-save</span><p>Only one review per conversation at a time</p></div></div></div></div><script>

</style></head><body><header class="hd"><div><div class="eyebrow">HRD<span class="dot">&bull;</span>06 Impact &amp; reflections</div><h1>Impact &amp; Reflection</h1></div></header><div class="stack"><div class="me2"><span class="q">&ldquo;</span><div><small>My impact</small><p>I made an autonomous AI product governable: defining what a human checks, in what order, and how every check makes the models better.</p></div></div><div class="card bi2"><div class="bh"><h3>Business Impact</h3><span class="pill">Expected</span></div><div class="tiles6"><div class="it"><svg viewBox="0 0 40 40" class="ii"><path d="M3 20c5-9 12-12 17-12s12 3 17 12c-5 9-12 12-17 12S8 29 3 20z" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><circle cx="20" cy="20" r="6" fill="#F7C948" stroke="#1b1b1b" stroke-width="2.2"/></svg><div class="itx"><small>Conversations human-reviewed</small><div class="ba2"><s>Spot checks</s><i>&rarr;</i><b>100%</b></div><span>Same day</span></div><svg viewBox="0 0 70 70" class="mv"><circle cx="35" cy="35" r="26" fill="none" stroke="#ece8d8" stroke-width="10"/><circle cx="35" cy="35" r="26" fill="none" stroke="#F7C948" stroke-width="10" stroke-dasharray="163.4 163.4" transform="rotate(-90 35 35)"/><text x="35" y="40" text-anchor="middle" font-size="14" font-weight="900" fill="#1b1b1b">100%</text></svg></div><div class="it"><svg viewBox="0 0 40 40" class="ii"><circle cx="20" cy="20" r="15" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><path d="M20 11v9l6 4" fill="none" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="2.4" fill="#F7C948"/></svg><div class="itx"><small>Time to surface a guardrail miss</small><div class="ba2"><s>Weeks, or never</s><i>&rarr;</i><b>Same day</b></div><span>Every conversation checked</span></div><svg viewBox="0 0 90 70" class="mv"><text x="0" y="16" font-size="9" font-weight="700" fill="#9a9a94">BEFORE</text><rect x="0" y="21" width="88" height="12" rx="6" fill="#e2dfd2"/><text x="0" y="50" font-size="9" font-weight="800" fill="#7a5a00">AFTER</text><rect x="0" y="55" width="14" height="12" rx="6" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.5"/></svg></div><div class="it"><svg viewBox="0 0 40 40" class="ii"><rect x="5" y="7" width="30" height="6" rx="3" fill="#1b1b1b"/><rect x="5" y="17" width="22" height="6" rx="3" fill="#F7C948"/><rect x="5" y="27" width="14" height="6" rx="3" fill="#e2dfd2"/></svg><div class="itx"><small>Effort on high-risk conversations</small><div class="ba2"><s>Random</s><i>&rarr;</i><b>Ranked first</b></div><span>Queue ordered by risk</span></div><svg viewBox="0 0 80 70" class="mv"><rect x="0" y="4" width="80" height="11" rx="5.5" fill="#1b1b1b"/><circle cx="72" cy="9.5" r="3" fill="#FFCC00"/><rect x="0" y="21" width="62" height="11" rx="5.5" fill="#3a3a3a"/><rect x="0" y="38" width="44" height="11" rx="5.5" fill="#F7C948"/><rect x="0" y="55" width="26" height="11" rx="5.5" fill="#e2dfd2"/></svg></div><div class="it"><svg viewBox="0 0 40 40" class="ii"><path d="M6 8h14l14 14-12 12L8 20z" fill="#F7C948" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round"/><circle cx="14" cy="15" r="2.6" fill="#1b1b1b"/></svg><div class="itx"><small>Labelled production conversations</small><div class="ba2"><s>0</s><i>&rarr;</i><b>Every review</b></div><span>Every eval labelled</span></div><svg viewBox="0 0 70 70" class="mv"><rect x="2" y="2" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M7 12l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="2" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M30 12l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="2" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M53 12l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="25" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M7 35l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="25" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M30 35l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="25" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M53 35l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="48" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M7 58l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="48" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M30 58l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="48" width="18" height="18" rx="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.4"/><path d="M53 58l3 3 6-7" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="it"><svg viewBox="0 0 40 40" class="ii"><circle cx="13" cy="20" r="8" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><circle cx="27" cy="20" r="8" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><circle cx="14" cy="20" r="3" fill="#1b1b1b"/><circle cx="28" cy="20" r="3" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.5"/></svg><div class="itx"><small>Reviewer accuracy checked</small><div class="ba2"><s>Never</s><i>&rarr;</i><b>Day 1</b></div><span>Peer review from launch</span></div><svg viewBox="0 0 80 70" class="mv"><circle cx="22" cy="20" r="10" fill="#e2dfd2"/><path d="M4 56c0-12 8-20 18-20s18 8 18 20z" fill="#e2dfd2"/><circle cx="52" cy="20" r="10" fill="#1b1b1b"/><path d="M34 56c0-12 8-20 18-20s18 8 18 20z" fill="#1b1b1b"/><circle cx="66" cy="50" r="11" fill="#F7C948" stroke="#fff" stroke-width="2.5"/><path d="M61 50l4 4 6-7" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="it"><svg viewBox="0 0 40 40" class="ii"><path d="M11 27V18a9 9 0 0 1 18 0v9l3 3H8z" fill="#F7C948" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round"/><path d="M17 33a3 3 0 0 0 6 0" fill="none" stroke="#1b1b1b" stroke-width="2.4"/></svg><div class="itx"><small>Regulatory issue to risk team</small><div class="ba2"><s>Days, by email</s><i>&rarr;</i><b>Instant</b></div><span>Alert from the checklist</span></div><svg viewBox="0 0 70 70" class="mv"><circle cx="35" cy="35" r="30" fill="#fff7d8"/><path d="M39 8L19 39h14l-4 23 22-33H37z" fill="#F7C948" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round"/></svg></div></div></div><div class="card rf2"><h3>Reflections I would carry into the next AI product</h3><div class="rcs"><div class="rc" style="--c:#2f6fd6"><div class="rh"><svg viewBox="0 0 40 40" class="ii"><path d="M20 6v28M10 34h20" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/><path d="M6 12h28" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/><path d="M6 12l-4 10h8zM34 12l-4 10h8z" fill="#F7C948" stroke="#1b1b1b" stroke-width="2" stroke-linejoin="round"/></svg><span class="rn">01</span></div><h4>Rank by the cost of a miss</h4><p>Weights should reflect what it costs to miss a risk, not how often it occurs.</p><div class="ra"><em>Next time</em>Agree dimension weights with risk before the first conversation.</div></div><div class="rc" style="--c:#1f8a4c"><div class="rh"><svg viewBox="0 0 40 40" class="ii"><rect x="6" y="6" width="28" height="28" rx="5" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><path d="M12 20l6 6 11-12" fill="none" stroke="#F7C948" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rn">02</span></div><h4>Every review is a label</h4><p>Human review creates leverage only when its output trains the models.</p><div class="ra"><em>Next time</em>Design the checklist as a labelling schema, then export it daily.</div></div><div class="rc" style="--c:#b8860b"><div class="rh"><svg viewBox="0 0 40 40" class="ii"><circle cx="15" cy="17" r="10" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/><circle cx="26" cy="24" r="10" fill="#F7C948" stroke="#1b1b1b" stroke-width="2.4"/><path d="M21 24l4 4 6-7" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rn">03</span></div><h4>Check the checker from Day 1</h4><p>When humans are the control, their accuracy is the risk.</p><div class="ra"><em>Next time</em>Build peer review and calibration into the first release.</div></div></div></div></div><script>

choosing the right cause is the most common difficulty</p><span>and the one with the biggest impact</span></div></div><div class="fr"><svg viewBox="0 0 56 56" class="rg"><circle cx="28" cy="28" r="22" fill="none" stroke="#ece8d8" stroke-width="7"/><circle cx="28" cy="28" r="22" fill="none" stroke="#F7C948" stroke-width="7" stroke-linecap="round" stroke-dasharray="78.8 138.2" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle" font-size="12" font-weight="900" fill="#1b1b1b">5.7</text></svg><div><b>5.7 / 10</b><p>staff satisfaction with complaint capture</p><span>usability score 56 / 100: marginal</span></div></div><div class="fr"><svg viewBox="0 0 56 56" class="rg"><circle cx="28" cy="28" r="26" fill="#fff7d8"/><rect x="9" y="15" width="17" height="13" rx="2.5" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><rect x="30" y="28" width="17" height="13" rx="2.5" fill="#F7C948" stroke="#1b1b1b" stroke-width="2"/><path d="M30 17h8a3 3 0 0 1 3 3v4M26 39h-8a3 3 0 0 1-3-3v-4" fill="none" stroke="#b38f00" stroke-width="2" stroke-linecap="round"/><path d="M38.5 21.5l2.5 3 2.5-3M12.5 34.5l2.5-3 2.5 3" fill="none" stroke="#b38f00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Context switching</b><p>between service interaction and complaint recording</p><span></span></div></div></div></div><div class="card qa"><div class="lbl">What quality reviews keep finding &middot; 12 months of QA</div><ol class="qr"><li><b>Regulatory reporting fields wrong</b><span>wrong cause or product; service resolution not recorded</span><em>AI can draft</em></li><li><b>Record incomplete</b><span>resolution actions done but not written up</span><em>AI can draft</em></li><li><b>Wrong or missing parties</b><span>business or joint parties not linked</span></li><li><b>Wrong received date</b><span>date entered later than the conversation</span><em>AI can draft</em></li></ol></div></div><div class="card ost"><div class="oh"><div class="lbl" style="margin:0" </style></head><body><header class="hd"><div><div class="eyebrow">ACC<span class="dot">&bull;</span>02 PoC design</div><h1>Framing an Experiment Around One Question</h1></div></header><div class="stack"><div class="ns"><div><span class="chip">The question I set out to answer</span><h2>Can AI turn a complaint conversation into a complete, correctly classified record that staff only have to review?</h2><p>Kept small on purpose: real conversations, one channel, no build budget, and a clear yes / no for leadership.</p></div></div><div class="row c3 fr3"><div class="card"><div class="lbl">Hypotheses</div><ul class="hy"><li><b>Effort</b>Auto-drafted records cut staff effort and capture time</li><li><b>Experience</b>Staying in their main workflow improves the customer experience</li><li><b>Quality</b>Pre-filled required fields lift completion and data quality</li><li><b>Adoption</b>Capture fitted to each channel is adopted more than one standard flow</li><li><b>Consistency</b>Review-and-confirm records quick resolves consistently, without adding cognitive load</li></ul></div><div class="card"><div class="lbl">Scope</div><div class="io"><div><em>In</em><p>Quick-resolve complaints, fixed within the interaction</p><p>Assisted channels: Dynamics 365 contact centre teams</p><p>The staff capture experience</p><p>Record accuracy and completeness for RG&nbsp;271</p></div><div class="out"><em>Out</em><p>Redesigning the end-to-end complaint process</p><p>Complex complaints needing investigation, escalation, vulnerability support or formal workflow</p></div></div></div><div class="card"><div class="lbl">What good looks like</div><ul class="sc"><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Minimal disruption to the live interaction</li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>A high-quality draft, not a blank form</li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Staff review, confirm and submit</li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Compliance fields captured consistently</li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Capture at the right moment for each channel</li></ul></div></div><div class="card"><div class="lbl">How I ran it</div><div class="flw"><div class="fs"><i>1</i><b>Find complaint conversations</b><p>Traced recorded complaints back to the messaging conversation linked to each one</p></div><div class="fs"><i>2</i><b>Stitch the sessions</b><p>One conversation can span several sessions; joined them end-to-end, from bot hand-over to close</p></div><div class="fs"><i>3</i><b>De-identify</b><p>Names, contact details and account numbers removed before any AI saw them</p></div><div class="fs ai"><i>4</i><b>Prompt the agent</b><p>Six outputs, grounded in the product, cause and resolution taxonomy</p></div><div class="fs"><i>5</i><b>Test and refine</b><p>Full and partial transcripts; reran each one to check consistency</p></div></div></div><div class="card tr"><div class="trh"><div class="lbl" style="margin:0">From transcript to draft record &middot; the six outputs I specified</div><span class="pill">Illustrative, de-identified example</span></div><div class="tx"><div class="chat"><div class="m c"><small>Customer</small>I&rsquo;ve been charged $53 twice for the same order. The second one is still pending.</div><div class="m c"><small>Customer</small>I want the duplicate cancelled and my money back.</div><div class="m s"><small>Staff</small>Pending charges usually drop off within 10 days. I&rsquo;ve raised a dispute for you.</div><div class="m c"><small>Customer</small>That&rsquo;s not good enough, I need it fixed now.</div></div><div class="arw"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#1b1b1b"/><path d="M14 20h12M21 14l6 6-6 6" fill="none" stroke="#FFCC00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><small>AI agent</small></div><div class="rec"><div class="fd "><div class="fh"><i>1</i>Case summary</div><p>Customer reports a duplicate $53 charge from one merchant, with the second still pending.</p></div><div class="fd "><div class="fh"><i>2</i>Outcome sought</div><p>Cancel the duplicate; refund $53</p></div><div class="fd "><div class="fh"><i>3</i>Financial outcome</div><p class="num">53.00</p></div><div class="fd "><div class="fh"><i>4</i>Complaint issues</div><p><span class="pill k">Transaction account</span><span class="pill y">Other disputed transaction</span><span class="cf">HIGH</span></p></div><div class="fd "><div class="fh"><i>5</i>Resolution actions</div><p><span class="pill y">Explanation not accepted</span><span class="cf">HIGH</span></p></div><div class="fd "><div class="fh"><i>6</i>Steps taken</div><p>Explained settlement time; dispute raised; customer not satisfied</p></div></div></div><div class="rules"><b>Prompt rules</b><span>Copy taxonomy values character for character</span><span>Only classify actions staff took</span><span>Never invent: &ldquo;Requires manual classification&rdquo;</span><span>Confidence on every row</span><span>No customer quotes in the summary</span></div></div></div><script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab[data-p]'));
  function show(p){tabs.forEach(function(t){var on=t.dataset.p===p;t.classList.toggle('on',on);t.setAttribute('aria-selected',on);});
    [].slice.call(document.querySelectorAll('.pane')).forEach(function(el){el.hidden=el.id!=='p-'+p;});}
  tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);});});
  [].slice.call(document.querySelectorAll('[data-go]')).forEach(function(b){b.addEventListener('click',function(){show(b.dataset.go);});});
})();
</script></body></html>

.ls li{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:#333}.ls .ck{margin-top:1px}
</style></head><body><header class="hd"><div><div class="eyebrow">ACC<span class="dot">&bull;</span>03 Build &amp; findings</div><h1>Two Platforms: The First One&rsquo;s Limits Were a Finding</h1></div></header><div class="stack"><div class="row ab"><div class="card at"><div class="ah"><span class="st">Phase 1</span><b>No-code agent builder</b><small>Microsoft 365 Copilot Agent Builder</small></div><p class="why"><b>Why start here:</b> No extra licence, testable within days, low commitment</p><p class="res"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fbe3df"/><path d="M7 7l6 6M13 7l-6 6" stroke="#c63c32" stroke-width="2.2" stroke-linecap="round"/></svg>Promising on simple cases; inconsistent on complex ones, with plausible but wrong or paraphrased values</p></div><div class="card at ok"><div class="ah"><span class="st">Phase 2</span><b>Low-code agent studio</b><small>Microsoft Copilot Studio</small></div><p class="why"><b>Why switch:</b> The three root causes were architectural, so better prompts could not fix them</p><p class="res"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Verbatim classification, consistent structure and accurate amounts on every transcript tested</p></div></div><div class="card"><div class="lbl">Three root causes, three fixes</div><div class="pfs"><div class="pf"><div class="p1"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="#fbe3df" stroke="#c63c32" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h4" stroke="#c63c32" stroke-width="1.8" stroke-linecap="round"/></svg></span><div><b>Instructions vs the 8,000-character cap</b><p>Scope rules, six output formats, guardrails and edge cases did not fit; putting instructions in knowledge files can be blocked at run time</p></div></div><div class="ar">&rarr;</div><div class="p2"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Instructions spread across the agent</b><p>Prompt, tool descriptions and topic logic share the load, so the usable instruction space is far larger</p></div></div></div><div class="pf"><div class="p1"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 13h7v7h-7z" fill="#fbe3df" stroke="#c63c32" stroke-width="1.8"/><path d="M15 4h5v5M4 15v5h5" fill="none" stroke="#c63c32" stroke-width="1.8" stroke-dasharray="2 2"/></svg></span><div><b>Chunked retrieval misses taxonomy values</b><p>Choosing a value means comparing against 150+ causes, 60+ products and 30+ resolutions; retrieval only returned the closest chunks</p></div></div><div class="ar">&rarr;</div><div class="p2"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Full taxonomy on every call</b><p>No vector retrieval and no partial data, so values are copied verbatim</p></div></div></div><div class="pf"><div class="p1"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#fbe3df" stroke="#c63c32" stroke-width="1.8"/><path d="M9 9l6 6M15 9l-6 6" stroke="#c63c32" stroke-width="1.8" stroke-linecap="round"/></svg></span><div><b>No live data or tools</b><p>Reference data was static uploads; every taxonomy change meant re-uploading and re-testing</p></div></div><div class="ar">&rarr;</div><div class="p2"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Live source of truth</b><p>Spreadsheets in SharePoint; an edit takes effect on the next tool call</p></div></div></div></div></div><div class="card arch"><div class="axh"><div class="lbl" style="margin:0">How the PoC agent works</div><button type="button" class="pbtn" id="pbtn">Prompt used</button></div><div class="pipe"><div class="nd "><b>Transcript</b><span>De-identified conversation</span></div><i class="ln"></i><div class="nd dk"><b>Orchestrator</b><span>Calls all three tools before classifying</span></div><i class="ln"></i><div class="tools"><div class="nd t"><b>Causes</b><span>150+ rows</span></div><div class="nd t"><b>Products</b><span>60+ rows</span></div><div class="nd t"><b>Resolutions</b><span>30+ rows</span></div><small>Live reference tables in SharePoint</small></div><i class="ln"></i><div class="nd ai"><b>Model</b><span>Claude Sonnet 4.6 &middot; temperature 0, chosen for output quality and instruction following</span></div><i class="ln"></i><div class="nd "><b>Structured outputs</b><span>6 record fields + API-ready payload</span></div><i class="ln d"></i><div class="nd fu"><b>Complaint system</b><span>Case created through the case-creation API &middot; next phase</span></div></div></div><div class="row c2 fd2"><div class="card"><div class="lbl" style="color:#178149">What the PoC proved</div><ul class="ls"><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Verbatim values</b>, with no invented products or causes</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Deterministic:</b> The same transcript gave the same classification every run</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Financial amounts</b> extracted correctly in every transcript tested</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Transcript-to-record extraction is <b>feasible at PoC level</b></span></li></ul></div><div class="card"><div class="lbl" style="color:#c63c32">What still needs work</div><ul class="ls"><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fbe3df"/><path d="M7 7l6 6M13 7l-6 6" stroke="#c63c32" stroke-width="2.2" stroke-linecap="round"/></svg><span><b>Over-classification:</b> Every transcript produced at least two issues, even single-issue complaints</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fbe3df"/><path d="M7 7l6 6M13 7l-6 6" stroke="#c63c32" stroke-width="2.2" stroke-linecap="round"/></svg><span><b>Nuance:</b> A casual apology versus an explanation the customer rejected</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fbe3df"/><path d="M7 7l6 6M13 7l-6 6" stroke="#c63c32" stroke-width="2.2" stroke-linecap="round"/></svg><span><b>Data checks:</b> No rule yet that the resolution date follows the received date</span></li><li><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fbe3df"/><path d="M7 7l6 6M13 7l-6 6" stroke="#c63c32" stroke-width="2.2" stroke-linecap="round"/></svg><span><b>Small sample:</b> Messaging only, prepared by hand; source data quality was low</span></li></ul></div></div><div class="pm" id="pm" hidden role="dialog" aria-modal="true" aria-labelledby="pmt"><div class="pmb"><div class="pmh"><div><div class="lbl" style="margin:0">Sample prompt &middot; extraction agent</div><b id="pmt">Prompt used in the PoC</b></div><button type="button" class="pmx" id="pmx" aria-label="Close">&times;</button></div><pre>You are a complaint case capture assistant for Commonwealth Bank frontline staff.

Your ONLY job is to extract structured complaint information from conversation transcripts provided by the user and produce exactly 6 outputs.

If the user&#x27;s message is a short question, greeting, or unrelated request, respond only with: &quot;I can only help with extracting complaint case fields from conversation transcripts. Please paste your transcript below to begin.&quot;

STEP 1 - When a transcript is provided, call all three tools simultaneously:
- Call GetCauseRows to retrieve the full cause reference table
- Call GetProductRows to retrieve the full product reference table
- Call GetResolutionRows to retrieve the full resolution reference table

STEP 2 - Use the data returned from the tools to classify the complaint.

CLASSIFICATION RULES:
- For ProductName: copy CHARACTER-FOR-CHARACTER from ProductName returned by GetProductRows. Read the full Definition column including any inline inclusion/exclusion guidance — never match on name alone, always match the root product not the symptom. When uncertain between two products create two rows at MEDIUM confidence
- For CauseCategory and CauseName: copy CHARACTER-FOR-CHARACTER from GetCauseRows. Read the full CauseDefinition including examples, exclusions and signals — never match on name alone, always match the PRIMARY root cause not the symptom. When uncertain between two causes create two rows at MEDIUM confidence
- For ResolutionAction and SecondaryField: copy CHARACTER-FOR-CHARACTER from GetResolutionRows. Read the Definition column before selecting — only classify actions the STAFF took, not what the customer requested. Combine duplicates into one row.
- If no entry clearly matches, output: Requires Manual Classification | [reason]
- Never paraphrase, abbreviate or modify any classification value

STEP 3 - Produce ONLY the 6 outputs below. No additional notes, rationale, or commentary between or after outputs.

OUTPUT 1: CASE SUMMARY
Issue Summary: [Exactly 3 sentences — no more. What happened, when, where. Use &quot;Customer states...&quot; or &quot;Customer reports...&quot; Professional third-person. Never quote the customer&#x27;s exact words anywhere in Output 1 including Customer Impact — always paraphrase. Do not use 
quotation marks anywhere in Output 1]
Reason for Complaint: [1-2 sentences. Only if explicitly stated. Omit if not mentioned.]
Customer Impact: [1-2 sentences. Only if explicitly stated. Omit if not mentioned.]

OUTPUT 2: OUTCOME SOUGHT
[Bullet list — maximum 4 bullets. Professional third-person. No verbatim quotes. Include only substantive outcomes explicitly requested. [Exclude channel preferences, threats to close accounts or leave the bank, inferred outcomes not explicitly stated, and emotional 
statements.]
[Write &quot;Not provided&quot; if none.]

OUTPUT 3: FINANCIAL OUTCOME SOUGHT
[Single number. Use 0 if none requested.]

OUTPUT 4: COMPLAINT ISSUES
| ProductName | CauseCategory | CauseName | Confidence |
|---|---|---|---|
[Verbatim from tool data only. Multiple rows if multiple issues. HIGH/MEDIUM/LOW.]

OUTPUT 5: RESOLUTION ACTIONS
| ResolutionAction | SecondaryField | Amount | Confidence |
|---|---|---|---|
[Verbatim from tool data only. Staff actions only. Amount = number or N/A. Do NOT classify casual apologies — only when it is the sole resolution. Write &quot;Not Found in Conversation&quot; if none.]

OUTPUT 6: STEPS TAKEN TO RESOLVE
[Numbered list — maximum 5 steps. One line per step: action taken + outcome + customer accepted/rejected. Write &quot;Not Found in Conversation&quot; if none.]

BEHAVIOUR RULES:
- Never invent, assume or hallucinate values
- Only include information explicitly present in the transcript
- Do NOT add classification notes, rationale, explanations, or any text outside the 6 output sections
- If not a complaint, start with: &quot;NOTE: This interaction does not appear to constitute a formal complaint.&quot; then produce all 6 outputs
- After the 6 outputs end with: &quot;Extraction complete. Please paste your next transcript to begin.&quot;</pre></div></div><script>(function(){var m=document.getElementById("pm");function o(){m.hidden=false;}function c(){m.hidden=true;}document.getElementById("pbtn").onclick=o;document.getElementById("pmx").onclick=c;m.addEventListener("click",function(e){if(e.target===m)c();});document.addEventListener("keydown",function(e){if(e.key==="Escape")c();});})();</script></div><script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab[data-p]'));
  function show(p){tabs.forEach(function(t){var on=t.dataset.p===p;t.classList.toggle('on',on);t.setAttribute('aria-selected',on);});
    [].slice.call(document.querySelectorAll('.pane')).forEach(function(el){el.hidden=el.id!=='p-'+p;});}
  tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);});});
  [].slice.call(document.querySelectorAll('[data-go]')).forEach(function(b){b.addEventListener('click',function(){show(b.dataset.go);});});
})();
</script></body></html>
</template>

<template id="ACC-4" data-mode="frame" data-topics="Staff journey|Risks|Desired outcomes|Human in the loop">
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ACC 04 Risks &amp; safe adoption</title><style>

.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* hero */
.hero{background:linear-gradient(90deg,#fff8dc,#fff 70%);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:center}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--ink);color:var(--y);border-radius:999px;padding:3px 10px;margin-bottom:6px}

/* strip */
.strip{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:9px;background:var(--ink);border-left:4px solid var(--y);color:#fff;font-size:11.5px}

@media(max-width:1100px){.c4,.c5{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.flw{flex-direction:column}.fs+.fs{margin:8px 0 0}.fs+.fs::before{display:none}body{overflow:auto}}

.jg{display:grid;grid-template-columns:78px repeat(5,minmax(0,1fr));gap:6px}
.jh{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;padding:0 2px}
.jh i{font-style:normal;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--band);color:#2b2200;font-size:10.5px;font-weight:900}
.jl{display:flex;align-items:center;font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.jl.cur{color:#c63c32}.jl.pro{color:#178149}
.jc{font-size:11.5px;line-height:1.35;border-radius:9px;padding:7px 10px;position:relative}

.jc.pro{background:#f1f8f3;border:1px solid #cfe7d8;color:#222}

</style></head><body><header class="hd"><div><div class="eyebrow">ACC<span class="dot">&bull;</span>04 Risks &amp; safe adoption</div><h1>What Has to Be True for AI-Drafted Complaint Records to Be Safe</h1></div></header><div class="stack"><div class="card"><div class="lbl">Current vs proposed staff journey</div><div class="jg"><div class="jl"></div><div class="jh"><i>1</i>Recognise the complaint</div><div class="jh"><i>2</i>Resolve the issue</div><div class="jh"><i>3</i>Capture the details</div><div class="jh"><i>4</i>Review and confirm</div><div class="jh"><i>5</i>Move to the next customer</div><div class="jl cur">Current</div><div class="jc cur">Staff judge whether the dissatisfaction meets the complaint threshold</div><div class="jc cur">Attention split between the customer and the complaint form</div><div class="jc cur">Leave the desktop, re-type the summary, pick product and cause from 150+ values: ~10 min</div><div class="jc cur">Self-checked; often rushed or deferred to after the call</div><div class="jc cur">Deferred records, forgotten details, incomplete fields</div><div class="jl pro">Proposed</div><div class="jc pro ">Staff still decide; the AI never judges whether it is a complaint</div><div class="jc pro ">Full attention on the customer; the transcript is captured in the background</div><div class="jc pro ai">AI drafts summary, outcome sought, issues and resolution from the transcript<span class="tg">AI drafts</span></div><div class="jc pro hu">Staff review, edit and submit; every change is logged<span class="tg">Human in the loop</span></div><div class="jc pro ">Record created automatically; straight on to the next customer</div></div></div><div class="row rk"><div class="card rkc"><div class="lbl">Risks</div><table class="tb "><colgroup><col style="width:5%"/><col style="width:18%"/><col style="width:33%"/><col style="width:44%"/></colgroup><thead><tr><th>#</th><th>Risk</th><th>What could go wrong</th><th>Mitigation approach</th></tr></thead><tbody><tr><td class="n">1</td><td class="k">Extraction errors</td><td>AI fills a complaint field incorrectly</td><td>Staff review every draft before submission; edits are logged</td></tr><tr><td class="n">2</td><td class="k">Incomplete records</td><td>Required details are missing from the transcript</td><td>Exception logic flags vague or incomplete transcripts for manual capture</td></tr><tr><td class="n">3</td><td class="k">Classification errors</td><td>Wrong product, cause or issue mapping</td><td>Full-taxonomy grounding, verbatim values, a confidence on every row, and &ldquo;Requires manual classification&rdquo; when unsure</td></tr><tr><td class="n">4</td><td class="k">Privacy</td><td>Transcripts hold customer information, including sensitive data</td><td>De-identified data for testing; secure transcript handling in production</td></tr><tr><td class="n">5</td><td class="k">Auditability gaps</td><td>An output cannot be traced back to the conversation</td><td>Keep the transcript &rarr; output &rarr; record trail for audit</td></tr><tr><td class="n">6</td><td class="k">Rubber-stamping</td><td>Staff approve AI fields without really checking them</td><td>Design the review so confirming and overriding take equal effort</td></tr><tr><td class="n">7</td><td class="k">Unclear ownership</td><td>No owner for review, correction and exceptions</td><td>Agree the operating model before any pilot</td></tr><tr><td class="n">8</td><td class="k">Governance</td><td>A higher-risk AI use case: complaints and RG&nbsp;271</td><td>Formal risk, compliance, privacy and customer-harm assessment before production</td></tr><tr><td class="n">9</td><td class="k">Adoption</td><td>Staff skip it if it adds steps to a pressured workflow</td><td>Review-and-submit inside the main desktop, paced to each channel</td></tr></tbody></table></div><div class="card dcol"><div class="lbl">Desired outcomes</div><div class="oc"><div class="och"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.8"/><path d="M4 21a8 8 0 0116 0" fill="#fff" stroke="#1b1b1b" stroke-width="1.8"/></svg><b>Customer</b></div><ul><li>Seamless experience, with minimal disruption or delay</li><li>Undivided attention from staff</li><li>Confidence that the bank is organised and responsive</li></ul></div><div class="oc"><div class="och"><svg viewBox="0 0 24 24"><path d="M5 13v-2a7 7 0 0114 0v2" fill="none" stroke="#1b1b1b" stroke-width="1.8"/><rect x="3" y="13" width="4" height="6" rx="1.5" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.6"/><rect x="17" y="13" width="4" height="6" rx="1.5" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.6"/></svg><b>Staff</b></div><ul><li>Less cognitive load during interactions</li><li>Lower-effort capture with fewer manual steps</li><li>Admin shifted from staff to the system</li></ul></div><div class="oc"><div class="och"><svg viewBox="0 0 24 24"><path d="M4 20h16" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="12" width="3" height="6" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><rect x="10.5" y="9" width="3" height="9" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><rect x="16" y="5" width="3" height="13" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.6"/></svg><b>Business</b></div><ul><li>Higher capture completion rates</li><li>More complete, consistent records</li><li>Better insight into systemic issues</li><li>Less friction in frontline operations</li></ul></div></div></div></div><script>

</style></head><body><header class="hd"><div><div class="eyebrow">ACC<span class="dot">&bull;</span>05 Leadership pitch &amp; impact</div><h1>From a Side Experiment to a Leadership Decision</h1></div><div class="tgt hdt"><p><b>Target:</b> Success is not just reducing effort. The solution must also protect record quality, support RG271 obligations, and preserve the quality of the customer interaction.</p></div></header><div class="stack"><div class="card"><div class="lbl">How I told the story to leadership</div><ol class="sl"><li class=""><i>1</i><div><b>Strategy fit</b><span>Goal: 30% of complaints captured with AI support</span></div></li><li class=""><i>2</i><div><b>Problem in numbers</b><span>173k a year; 92% fixed on the spot; ~10 min to record</span></div></li><li class=""><i>3</i><div><b>Opportunity tree</b><span>Outcomes &rarr; opportunities &rarr; the bet</span></div></li><li class=""><i>4</i><div><b>How the PoC ran</b><span>Real, de-identified conversations</span></div></li><li class=""><i>5</i><div><b>Target experience</b><span>Transcribe, extract, review, create</span></div></li><li class=""><i>6</i><div><b>What we learned</b><span>Platform, integration, path to production</span></div></li><li class="dm"><i>7</i><div><b>Live demo</b><span>Transcript in, draft record out</span></div></li></ol></div><div class="card"><div class="teh"><div class="lbl" style="margin:0">The target experience I proposed</div></div><div class="flw"><div class="fs"><i>1</i><b>Transcribe</b><p>The contact-centre desktop captures the conversation as it happens</p></div><div class="fs ai"><i>2</i><b>Extract &amp; summarise</b><p>AI drafts the record and suggests product, cause and resolution</p></div><div class="fs"><i>3</i><b>Review &amp; validate</b><p>Staff stay accountable: edit, confirm, submit</p><span class="tg">Human in the loop</span></div><div class="fs"><i>4</i><b>Create</b><p>The complaint record is created automatically</p></div></div></div><div class="g4"><div class="card dc"><div class="lbl">What the discovery changed</div><div class="ims"><div class="im"><span class="ii"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.8"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>Feasibility proven</b><p>Transcript-to-record extraction with verbatim classification works at PoC level, with no build budget</p></div></div><div class="im"><span class="ii"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v5M12 17.5v.5" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/></svg></span><div><b>The real blocker found before any build</b><p>No integration path yet for external AI agents inside the contact-centre desktop, and voice was still to migrate</p></div></div><div class="im"><span class="ii"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#1b1b1b" stroke-width="1.8"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round"/></svg></span><div><b>Platform direction set</b><p>Low-code for fast prototyping; production on Agents.CBA, the bank&rsquo;s internal platform for building, testing and running AI agents, with guardrails, evaluation and monitoring built in</p></div></div><div class="im"><span class="ii"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="#fff" stroke="#1b1b1b" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="17" r="4.5" fill="#F7C948" stroke="#1b1b1b" stroke-width="1.5"/></svg></span><div><b>Became a formal solution discovery</b><p>Findings written into the team&rsquo;s solution discovery, ending in a decision gate: proceed, re-scope or pause</p></div></div></div></div><div class="rt"><div class="card ex"><div class="bh"><div class="lbl" style="margin:0">If taken to production</div><span class="pill">Expected</span></div><div class="exs"><div><small>Time to record a quick resolve</small><p><s>~10 min</s><i>&rarr;</i><b>~3 min review</b></p></div><div><small>Product and cause</small><p><s>Chosen by hand</s><i>&rarr;</i><b>Better Data Quality</b></p></div><div><small>When capture happens</small><p><s>Deferred</s><i>&rarr;</i><b>Before the next customer</b></p></div></div></div><div class="card nx"><div class="lbl">Next steps I recommended</div><ul class="ls"><li><i>1</i>Secure access to representative, approved and de-identified transcript samples</li><li><i>2</i>Benchmark AI drafts against historical complaint records</li><li><i>3</i>Agree the integration path with the desktop platform team</li><li><i>4</i>Risk, privacy and AI governance assessment</li></ul></div></div></div><div class="card lim"><div class="lh"><div class="lbl" style="margin:0;color:#c63c32">Limitations &middot; why it could not go live yet</div><span class="pill k">Critical blocker: contact-centre desktop integration</span></div><div class="lms"><div class="lm"><i>1</i><b>No path for external agents</b><p>The Dynamics 365 contact-centre desktop (OneView) has no supported way for an external AI agent to plug into Agent Assist</p></div><div class="lm"><i>2</i><b>Only built-in assist today</b><p>Every Agent Assist feature in the desktop is Microsoft out-of-the-box; no external or in-house agent has been integrated yet</p></div><div class="lm"><i>3</i><b>Live transcripts out of reach</b><p>The agent needs the live transcript inside the desktop; how to access it, and which framework could do it, is still undecided</p></div><div class="lm"><i>4</i><b>Waiting on the platform team</b><p>The desktop team&rsquo;s own agent is at an early stage; a path for external agents follows only once theirs is live</p></div><div class="lm"><i>5</i><b>Voice not migrated yet</b><p>Messaging runs on Dynamics 365, but telephony has not moved, so voice transcripts, a key unlock, are not available</p></div></div></div></div></div><script>

</style></head><body><header class="hd"><div><div class="eyebrow">SPF<span class="dot">&bull;</span>01 Problem &amp; regulatory context</div><h1>A New Law Turns Unreimbursed Scam Losses into Regulated, Multi-Bank Complaints</h1></div></header><div class="stack"><div class="hero"><div><span class="chip">Ongoing &middot; Day 1 MVP in design</span><h2>From 31 March 2027, a scam victim the bank doesn&rsquo;t fully reimburse can raise an SPF complaint that may involve every bank the money passed through</h2><p>Australia&rsquo;s Scams Prevention Framework (SPF) puts enforceable obligations on banks, telcos and digital platforms to prevent, detect, disrupt, report and respond to scams.</p></div><div class="kp"><div><b>31 Mar 2027</b><span>SPF obligations take effect</span></div><div><b>21 days</b><span>to issue a Statement of Compliance</span></div><div><b>30 days</b><span>for AFCX to finalise a multi-bank outcome</span></div></div></div><div class="card role"><span class="rb">My role</span><span><b>Role</b>Product Manager</span><span><b>Focus</b>SPF Case Creation, Workflow &amp; AFCX Integration</span><span><b>Partners</b>Economic Crime, Complaints ops, Architecture, Legal &amp; Compliance, AFCX</span></div><div class="row r1"><div class="card"><div class="lbl">The regulatory clock &middot; per SPF complaint</div><div class="clk"><div class="cm "><i></i><small>Day 0</small><b>Complaint received</b><span>The clock starts: exact trigger event still being confirmed</span></div><div class="cm "><i></i><small>Next business day</small><b>Acknowledgement</b><span>Standard complaint milestone, as for any complaint</span></div><div class="cm "><i></i><small>5 business days</small><b>Short SoC</b><span>If resolved to the customer&rsquo;s satisfaction</span></div><div class="cm k"><i></i><small>21 days</small><b>Statement of Compliance</b><span>To the customer, or to AFCX in a multi-bank case</span></div><div class="cm "><i></i><small>30 days</small><b>Outcome</b><span>Non-resolution notice, or AFCX finalises the multi-bank outcome</span></div></div></div><div class="card tv"><div class="lbl">Today vs. what SPF needs</div><div class="tvr"><em>Today</em><p>Fraud &amp; scams and complaints are linked only by cross-referenced IDs and procedures. There is <b>no API, event or data integration</b> between the complaints platform and any fraud system.</p></div><div class="tvr k"><em>SPF</em><p>A complaint created from the scam recovery outcome, a multi-bank case lodged with AFCX, and an SoC produced and tracked against statutory deadlines.</p></div></div></div><div class="row c4 pcs"><div class="card pc "><span class="pn">01</span><h3>Data is spread across four systems</h3><p>Scam recovery (Fraud 360), card disputes, the customer record and the frontline scam capture form each hold part of the case. Vulnerability and hardship are not captured consistently.</p><div class="so"><small>Product response</small>Map every multi-bank intake field to a source, a data-quality rating and a rule before build</div><div class="big"><b>4 sources</b><span>feed one multi-bank intake form</span></div></div><div class="card pc "><span class="pn">02</span><h3>No clear line for what an SPF complaint is</h3><p>A scam report is not automatically a financial-loss complaint, and a conduct complaint can arise even after full recovery.</p><div class="so"><small>Product response</small>Define two complaint types with separate triggers, and a clear boundary with standard complaints</div><div class="big"><b>2 types</b><span>financial loss and conduct</span></div></div><div class="card pc "><span class="pn">03</span><h3>The bank plays different roles</h3><p>The bank can be the sending bank, the receiving bank, or both. The role decides whether MPIDR applies and who receives the SoC.</p><div class="so"><small>Product response</small>Work through every sending- and receiving-bank scenario so each role has its own pathway</div><div class="big"><b>3 roles</b><span>sending, receiving, both</span></div></div><div class="card pc dark"><span class="pn">04</span><h3>A fixed legal deadline</h3><p>Missed obligations are breaches, and scam victims could face delayed or sub-optimal reimbursement. Day 1 has to land before the law starts.</p><div class="so"><small>Product response</small>Scope a human-reviewed Day 1 MVP; automate once the core model is proven</div><div class="big"><b>Feb 2027</b><span>Day 1 MVP delivery</span></div></div></div><div class="strip"><b>Customer outcome</b>Scam victims have a better chance of getting their money back, even if their own bank won&rsquo;t cover the whole loss.</div></div><script>

</style></head><body><header class="hd"><div><div class="eyebrow">SPF<span class="dot">&bull;</span>02 Discovery &amp; complaint model</div><h1>Turning an Ambiguous Law into a Complaint Model the Bank Can Operate</h1></div></header><div class="stack"><div class="row r1"><div class="card"><div class="lbl">How I framed discovery &middot; what does &ldquo;case creation&rdquo; actually mean?</div><div class="flw"><div class="fs"><i>1</i><b>Case creation</b><p>What is needed to establish the SPF complaint</p><span class="tg">Output: AFCX case created</span></div><div class="fs"><i>2</i><b>Investigation &amp; assessment</b><p>What is needed to build the Statement of Compliance</p><span class="tg">Output: SoC created &amp; submitted</span></div><div class="fs"><i>3</i><b>Resolution &amp; closure</b><p>Combine outcomes, respond to the customer, close</p><span class="tg">Output: AFCX case closed</span></div></div></div><div class="card"><div class="lbl">Discovery artefacts</div><div class="mt"><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Discovery Q&amp;A tracker with a status per question</span></div><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>9 customer scenarios worked through in workshops</span></div><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sending- and receiving-bank scenario map</span></div><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Decision register ranked P1&ndash;P3</span></div><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Question list for AFCX</span></div><div><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Multi-bank intake form field mapping</span></div></div></div></div><div class="row r2"><div class="card rtc"><div class="lbl">Complaint model &middot; which pathway a scam complaint takes</div><div class="pre"><div class="pb">Scam reported<small>Frontline captures it in the scam form</small></div><span>&rsaquo;</span><div class="pb">Recovery assessment<small>Fraud 360; up to 7 days for standard non-card cases</small></div><span>&rsaquo;</span><div class="pb y">Recovery outcome decides the path</div></div><div class="rt"><div class="rr a"><div class="rc">Full recovery</div><div class="ro">No financial-loss complaint. A conduct complaint is still possible, e.g. about how the scam was handled</div><div class="rs">SoC to customer</div></div><div class="rr a"><div class="rc">Partial or nil &middot; both accounts at the bank</div><div class="ro">Single-party SPF complaint, handled internally with no MPIDR</div><div class="rs">SoC to customer</div></div><div class="rr o"><div class="rc">Partial or nil &middot; low value (~$3,000)</div><div class="ro">Early payment may avoid a full complaint, MPIDR and SoC pathway</div><div class="rs">Still open</div></div><div class="rr k"><div class="rc">Partial or nil &middot; another bank involved</div><div class="ro">Complaint created automatically from the recovery outcome, then an MPIDR case lodged with AFCX</div><div class="rs">SoC to AFCX in 21 days</div></div></div><div class="note">Every SPF complaint needs a Statement of Compliance, including bank-only and nil-loss cases.</div></div><div class="card tw"><div class="lbl">Two complaint types, two triggers</div><div class="ty"><h4>Financial loss</h4><p><b>Trigger:</b> The recovery outcome from Fraud 360 shows a partial or nil recovery</p><p><b>Created by:</b> The fraud system through an API; no manual frontline creation</p><p><b>Multi-bank case:</b> Yes, if another bank received the money</p><p><b>SoC to:</b> AFCX in a multi-bank case, otherwise the customer</p></div><div class="ty k"><h4>Conduct</h4><p><b>Trigger:</b> The customer is unhappy with delay, service, or how the bank monitored, detected or responded to the scam</p><p><b>Created by:</b> Frontline or webform, at any point, even after full recovery</p><p><b>Multi-bank case:</b> None from the loss decision</p><p><b>SoC to:</b> The customer; a Short SoC if resolved within 5 business days</p></div></div></div><div class="card dg"><div class="lbl">Decision register &middot; where things stand</div><div class="dr"><div><span class="st a">Agreed</span><span>Frontline cannot manually create a financial-loss complaint that needs MPIDR; only the SPF team, in agreed exceptions</span></div><div><span class="st a">Agreed</span><span>Fraud 360 is the single integration point; card disputes flow through it</span></div><div><span class="st a">Agreed</span><span>A status-only enquiry gets the dispute status, not a duplicate complaint</span></div><div><span class="st a">Agreed</span><span>Never create several multi-bank cases for the same scam</span></div><div><span class="st w">Working position</span><span>Webform MVP: Guide the customer, don&rsquo;t hard-block, route to human triage</span></div><div><span class="st w">Working position</span><span>Related conduct issues stay in one complaint; unrelated issues are split out</span></div><div><span class="st w">Working position</span
