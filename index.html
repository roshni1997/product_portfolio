.role .rb{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--band);color:#2b2200;border-radius:999px;padding:3px 10px}
.role b{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-right:5px}
/* hero */
.hero{background:linear-gradient(90deg,#fff8dc,#fff 70%);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:center}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--ink);color:var(--y);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.hero h2{font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.3px}
.hero p{font-size:12px;color:#444;margin-top:5px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.kp b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.kp span{font-size:10.5px;color:#555;line-height:1.3;display:block}
/* problem cards */
.pc{display:flex;flex-direction:column;gap:5px}
.pn{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:7px;background:var(--band);color:#2b2200;font-size:11px;font-weight:900}
.pc h3{font-size:13px;line-height:1.3;margin:0}
.pc p{font-size:11.5px}
.pc .big{margin-top:auto;padding-top:7px;border-top:1px solid #efefeb}
.pc .big b{font-size:20px;font-weight:800;letter-spacing:-.4px;display:block}
.pc .big span{font-size:10.5px;color:#555}
.pc.dark{background:var(--ink);color:#fff}.pc.dark p,.pc.dark .big span{color:#d8d8d8}.pc.dark .big{border-color:#333}.pc.dark .big b{color:var(--y)}
/* tables */
table.tb{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.tb th{background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:6px 9px}
.tb td{border-bottom:1px solid #ececea;padding:6px 9px;vertical-align:middle;color:#333}
.tb td.k{font-weight:700;color:var(--ink)}
.tb td.n{width:30px;text-align:center;font-weight:900;color:var(--ink)}
.tb td.hl{background:#fff7d8;font-weight:800;color:var(--ink)}
.tb tbody tr:hover td{background:#fffbe9}
/* tabs */
.tabs{flex:none;display:grid;gap:8px}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:12px;padding:8px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab i{font-style:normal;width:21px;height:21px;border-radius:50%;background:#f1f1ef;display:grid;place-items:center;font-size:11px;font-weight:800}
.tab.on{background:var(--ink);color:#fff}.tab.on i{background:var(--y);color:#2b2200}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.pane[hidden]{display:none}
.pane>*{flex-shrink:0}
/* flow steps */
.flw{display:flex;align-items:stretch;gap:0}
.fs{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative}
.fs+.fs{margin-left:16px}
.fs+.fs::before{content:"\203A";position:absolute;left:-13px;top:50%;transform:translateY(-50%);color:#b38f00;font-weight:900;font-size:16px}
.fs i{font-style:normal;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#f1f1ef;font-size:10px;font-weight:800;margin-right:5px}
.fs b{font-size:12px}
.fs p{font-size:11px;color:#555;margin-top:3px}
.fs.pain{background:#fffdf7;border-style:dashed}
.fs.ai{background:#fff7d8;border-color:#ecd46d}
.fs .tg{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--ink);color:var(--y)}
/* dark north star */
.ns{background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.ns .chip{background:var(--y);color:#2b2200}
.ns h2{font-size:21px;font-weight:800;letter-spacing:-.4px}
.ns p{font-size:12px;color:#d6d6d6;margin-top:3px}
.ns .tg{text-align:right;border-left:1px solid #333;padding-left:18px}
.ns .tg small{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--y)}
.ns .tg b{font-size:36px;font-weight:900;color:var(--y);letter-spacing:-1px}
/* metric columns */
.mcol{border-top:4px solid var(--ink);padding-top:9px}
.mcol h4{font-size:13px;font-weight:800}
.mcol small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:6px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #ececea;font-size:12px}
.mi:last-child{border-bottom:0}
.mi em{flex:none;font-style:normal;font-size:11px;font-weight:800;background:#fff1c2;border-radius:6px;padding:1px 7px;color:#2b2200}
.mi[title]{cursor:help}
/* strip */
.strip{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:9px;background:var(--ink);border-left:4px solid var(--y);color:#fff;font-size:11.5px}
.strip b{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--y)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:#f1f1ef;color:#444;margin:2px 3px 2px 0}
.pill.y{background:#fff1c2;color:#2b2200}.pill.k{background:var(--ink);color:var(--y)}
ul.cl{margin:4px 0 0;padding-left:16px;font-size:11.5px;color:#444}
ul.cl li{margin:2px 0}
@media(max-width:1100px){.c4,.c5{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.flw{flex-direction:column}.fs+.fs{margin:8px 0 0}.fs+.fs::before{display:none}body{overflow:auto}}

.ck{width:16px;height:16px;flex:none;margin-top:1px}
.li{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.35;color:#333;padding:4px 0;border-bottom:1px dashed #ececea}
.li:last-child{border-bottom:0}
.st{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.3px;border-radius:6px;padding:1px 7px;white-space:nowrap}
.st.a{background:var(--ink);color:var(--y)}.st.w{background:#fff1c2;color:#2b2200}.st.o{background:#fff;color:#555;border:1px dashed #b5b5b0}

.sc .card{display:flex;flex-direction:column}
.nx{background:#fffaf0;border:1.5px solid var(--ink)}
.r3{flex:1 0 auto;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.rkc{display:flex;flex-direction:column}.rkc .tb{flex:1;height:100%}
.mcol{border-top:0;padding-top:0;display:flex;flex-direction:column;height:calc(100% - 20px)}
.mcol .mi{flex:1}
.mi small{display:block;font-size:10.5px;color:var(--mut)}
.mi em .tbd{font-size:11px}
.oqs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.oqs b{font-size:11.5px}.oqs small{font-size:10.5px;color:var(--mut)}
.oqs div{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:11.5px;color:#333;line-height:1.3;border:1px dashed #d8d8d3;border-radius:9px;padding:6px 10px}
</style></head><body><header class="hd"><div><div class="eyebrow">SPF<span class="dot">&bull;</span>03 Day 1 scope, risks &amp; next</div><h1>Ship a Compliant, Human-Reviewed Day 1, Then Automate</h1></div></header><div class="stack"><div class="row c3 sc"><div class="card"><div class="lbl">In Day 1 &middot; late Feb 2027</div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SPF complaints for every use case: sending bank, receiving bank and conduct</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SPF workflow layered on the standard complaint workflow</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Statement of Compliance service: gather, generate, review, send</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Webform, app and website SPF awareness</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#F7C948"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Reconciliation and integration-error handling</span></div></div><div class="card"><div class="lbl">Deliberately out of Day 1</div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#efefec"/><path d="M7 7l6 6M13 7l-6 6" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Any generative AI, e.g. drafting SoC content</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#efefec"/><path d="M7 7l6 6M13 7l-6 6" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Straight-through SoCs: Day 1 keeps mandatory manual review</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#efefec"/><path d="M7 7l6 6M13 7l-6 6" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Scam case withdrawals and cancellations from the fraud system</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#efefec"/><path d="M7 7l6 6M13 7l-6 6" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Moving payments and letters to new platforms</span></div></div><div class="card nx"><div class="lbl">Direction after Day 1</div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fff1c2"/><path d="M6 10h8M10.5 6.5L14 10l-3.5 3.5" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Automated multi-bank case creation, with failures sent to a human queue</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fff1c2"/><path d="M6 10h8M10.5 6.5L14 10l-3.5 3.5" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Configurable complexity rules so only a small share needs review</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fff1c2"/><path d="M6 10h8M10.5 6.5L14 10l-3.5 3.5" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Connect the webform to the dispute system to spot open disputes</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fff1c2"/><path d="M6 10h8M10.5 6.5L14 10l-3.5 3.5" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Explore AI-assisted SoC drafting</span></div><div class="li"><svg viewBox="0 0 20 20" class="ck"><circle cx="10" cy="10" r="9" fill="#fff1c2"/><path d="M6 10h8M10.5 6.5L14 10l-3.5 3.5" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Programmatic AFCX access as AFCX&rsquo;s API matures</span></div></div></div><div class="row r3"><div class="card rkc"><div class="lbl">Process breaks that would become regulatory breaches</div><table class="tb "><colgroup><col style="width:6%"/><col style="width:38%"/><col style="width:56%"/></colgroup><thead><tr><th>#</th><th>Breach risk</th><th>How the design handles it</th></tr></thead><tbody><tr><td class="n">1</td><td class="k">Complaint not created when the fraud system asks</td><td>Integration error handling, reconciliation, and a human queue for failed creations</td></tr><tr><td class="n">2</td><td class="k">Multi-bank case not lodged when due</td><td>Automated creation with failures routed to the MPIDR exception queue</td></tr><tr><td class="n">3</td><td class="k">SoC not sent within 21 days</td><td>Tracked milestone, SoC queues, and a mandatory review step on Day 1</td></tr><tr><td class="n">4</td><td class="k">Joinder request or AFCX outcome missed</td><td>Email listener on the AFCX mailbox; manual portal checks on Day 1</td></tr><tr><td class="n">5</td><td class="k">Slow recovery treated as a breach</td><td>Delayed cases flagged for manual review instead of auto-breaching</td></tr><tr><td class="n">6</td><td class="k">Duplicate cases for one scam</td><td>Idempotent intake and reference matching before anything is lodged</td></tr></tbody></table></div><div class="card"><div class="lbl">How we&rsquo;ll know it works &middot; targets</div><div class="mcol"><div class="mi"><span>SoCs issued within 21 days<small>statutory deadline</small></span><em>Target 100%</em></div><div class="mi"><span>Complaint created after the recovery outcome<small>expected path, incl. manual triage</small></span><em>&le; 2 business days</em></div><div class="mi"><span>Duplicate multi-bank cases for one scam<small>one scam, one multi-bank case</small></span><em>Target 0</em></div><div class="mi"><span>Intake fields auto-filled from source systems<small>baseline once Day 1 is live</small></span><em><span class="tbd">[x]]</span></em></div><div class="mi"><span>Cases routed to exception queues<small>kept small and configurable</small></span><em><span class="tbd">[x]]</span></em></div></div></div></div><div class="card oq"><div class="lbl">Open questions I&rsquo;m driving to a decision</div><div class="oqs"><div><span class="pill k">Compliance</span><b>Which event starts the clock while recovery is running</b><small>Why it matters: sets every SPF deadline</small></div><div><span class="pill k">Legal</span><b>Scam + conduct: one complex complaint or two</b><small>Why it matters: shapes the complaint model</small></div><div><span class="pill k">AFCX</span><b>Mandatory fields, case lifecycle, SoC format</b><small>Why it matters: drives the integration build</small></div><div><span class="pill k">Business</span><b>Low-value threshold; cards and chargebacks</b><small>Why it matters: decides which cases skip MPIDR</small></div></div></div></div><script>

})();
