<script>
/* Organisation OKRs shown on the dashboard (tiers 1 and 2 only) */
const OKR = {
  "O-1": "Build a frictionless service experience",
  "O-2": "Reimagine processes and build reusable operations patterns",
  "O-3": "Build highly valued and engaged teams"
};
const chip = k => `<span class="ok ${k.toLowerCase().replace("-", "")}" title="${k} · ${OKR[k]}"><b>${k}</b></span>`;

/* Tier 2 — key drivers. Selecting one dims every metric below that does not move it. */
const D = [
  { n:"Capture quality",  pb:["P2", "P3"], ac:"#e0a800", okr:["O-1"],        kpi:"Case info edited by case managers", kt:"≤ 10%" },
  { n:"Customer reach",   pb:["P1"], ac:"#2f6fd6", okr:["O-1"],        kpi:"Complaints captured via Companion during business hours", kt:"46%" },
  { n:"Resolution speed", pb:["P1", "P2"], ac:"#1f8a4c", okr:["O-1"],        kpi:"Same-day resolution",               kt:"≥ 80%" },
  { n:"Safe operation",   pb:[], ac:"#7b61ff", okr:["O-2", "O-3"], kpi:"Control-threshold breaches",        kt:"0" }
];

/* Tier 3 — success scorecard (sentence case throughout).
   n = name, t = target shown, tf = full target (hover), d = definition (hover),
   r = index of the key driver it rolls up to. */
const L = [
  { n:"Operations", why:"Efficiency, productivity and workforce planning", m:[
    { n:"Complaint volumes: happy path vs ejected",        t:"≥ 80% happy path", tf:"≥ 80% handled end to end on the happy path", d:"Complaints received through the Expert, split by happy path (handled end to end) and ejected path (completed by a person).", r:1 },
    { n:"Clearance rate", t:"0 at day end", tf:"0 complaints left open at the end of each day", d:"Complaints closed at first resolution and complaints still open. Clearance rate is closed ÷ received.", r:2 },
    { n:"Handling time",                                    t:"≤ 60 min",     tf:"≤ 60 minutes per complaint", d:"Average specialist time per complaint, compared across happy and ejected paths.", r:2 },
    { n:"Concurrent conversations per specialist",          t:"1 → 2",        tf:"From 1 to 2 conversations per specialist", d:"Conversations a specialist manages at the same time using instant messaging.", r:2 },
    { n:"Escalated and reopened",                           t:"≤ 20% · ≤ 5%", tf:"≤ 20% escalated to case management; ≤ 5% reopened", d:"Complaints the handling team passes to case management, and Expert-originated complaints reopened after closure.", r:2 },
    { n:"Review time",                                      t:"< 25 min",     tf:"< 25 minutes of review per complaint", d:"Time spent reviewing the Expert's conversation transcripts.", r:3 } ] },
  { n:"Business & customer", why:"Value delivered and data quality", m:[
    { n:"Product / cause accuracy ★",                       t:"≥ 95%",        tf:"≥ 95%", d:"Classifications left unchanged by case managers through to resolution.", r:0 },
    { n:"Playback approval",                                t:"≥ 90%",        tf:"≥ 90% confirm first time", d:"Customers who confirm the summary of their complaint first time.", r:0 },
    { n:"First human response",                           t:"≤ 5 min",      tf:"≤ 5 min from the queue to the specialist's first message", d:"Wait from the queue to the specialist's first message.", r:2 },
    { n:"Time to first resolution",                       t:"≤ 1 day",      tf:"≤ 1 day end to end (web form: 1–30+ days)", d:"End-to-end time from lodgement to first resolution.", r:2 },
    { n:"Average turns per conversation",                 t:"P95 ≤ 12",     tf:"P95 ≤ 12 turns per conversation", d:"Customer and agent message exchanges needed to capture a complaint, from first message to confirmed playback. Fewer turns mean the right questions were asked first time.", r:0 },
    { n:"Channel shift",                                    t:"1% → 65%",     tf:"Companion share of complaints from 1% to 65% (end state)", d:"Share of complaints raised through Companion rather than phone, web form, branch or post.", r:1 } ] },
  { n:"Risk & control", why:"Quality, regulatory and risk expectations", m:[
    { n:"QA review coverage",                               t:"100%",         tf:"100% during the pilot", d:"Share of Expert-handled complaints reviewed by QA.", r:3 },
    { n:"Guardrail accuracy",                               t:"≥ 95%",        tf:"≥ 95% correct decisions; 0 missed complaints", d:"Guardrail decisions that were correct, and risks or complaints it missed.", r:3 },
    { n:"Output-guardrail triggers",                        t:"≤ 2%",         tf:"≤ 2% of bot replies", d:"Guardrail-blocked replies ÷ total bot replies. A leading risk signal.", r:3 },
    { n:"Ejection coverage",                                t:"100%",         tf:"100% of ejection scenarios captured", d:"Every ejection scenario is recorded in the human review dashboard.", r:3 },
    { n:"Customer abandonment",                             t:"< 10%",        tf:"< 10% of conversations", d:"Customer abandonment: customers who leave the conversation before their complaint is captured.", r:1 },
    { n:"Bot-loop detection",                               t:"0 missed",     tf:"0 loops left undetected", d:"Customers stuck in a conversation loop with no progress.", r:3 } ] },
  { n:"Technology control", why:"Golden signals plus LLM cost, per call", m:[
    { n:"API health and errors",                            t:"≥ 99.9%",      tf:"≥ 99.9% availability; ≤ 1% errors", d:"Is each API up, how much traffic it takes and how many calls fail. Source and destination call counts are reconciled to catch calls that never arrive.",
      a:"Wheeljack API · BIAN CCA API", s:"Obstack", r:3 },
    { n:"Endpoint latency",                                 t:"P95 ≤ 3 s",    tf:"P95 ≤ 3 seconds", d:"Average, P90 and P95 response time per endpoint, plus request duration over time.",
      a:"A2A API · BIAN CCA API · BIAN CCA → FP API", s:"Obstack", r:3 },
    { n:"LLM and guardrail latency",                        t:"< 8 s",        tf:"< 8 seconds per message, model and guardrail checks combined", d:"Model response time per message, plus guardrail validator runs, status and latency.",
      a:"CxB A2A → GenAI LiteLLM · CxB A2A → GAAS · Conversation manager → GAAS", s:"HoneyHive (LLM) · observe (guardrails)", r:3 },
    { n:"Case-creation success",                            t:"≥ 99%",        tf:"≥ 99% of calls succeed", d:"Share of case-creation calls that succeed, with their error rate and the count of complaints created.",
      a:"CxB A2A → BIAN CCA API → FP API", s:"Obstack (CCA) · observe (FP errors)", r:0 },
    { n:"Agent node health",                                t:"≤ 1% errors",  tf:"≤ 1% errors at any node", d:"Time taken and errors at each node of the agent graph, from predefined log queries.",
      a:"CxB A2A agent graph (every node)", s:"observe", r:3 },
    { n:"Database health",                                  t:"≤ 200 ms",     tf:"≤ 200 ms per operation", d:"Number of calls, latency, error types and resource use of calls to the conversation store.",
      a:"CxB A2A → CxB DB", s:"observe", r:3 } ] }
];

const $ = s => root.querySelector(s);
const drv = $("#drv"), lens = $("#lens"), tip = $("#tip"), M = [];
const DEF_HINT = "Hover any metric for its definition, APIs and target";

drv.innerHTML = D.map((d, i) => `<button class="drv" style="--ac:${d.ac}" data-i="${i}" aria-pressed="false">
  <div class="dh"><span class="dn">${"ABCD"[i]}</span><span class="dt">${d.n}</span><span class="dok">${d.okr.map(chip).join("")}</span></div>
  <div class="dk"><span>${d.kpi}</span><b>${d.kt}</b></div></button>`).join("");

lens.innerHTML = L.map(l => `<div class="ln"><div class="lh2"><h4>${l.n}</h4><p>${l.why}</p></div>${
  l.m.map(x => { const k = M.push(x) - 1;
    return `<div class="mr" tabindex="0" data-k="${k}" data-r="${x.r}" aria-label="${x.n.replace(" ★", "")}. Target: ${x.tf}. ${x.d}${x.a ? " Covers: " + x.a + ". Source: " + x.s + "." : ""}">
      <i></i><span class="mn">${x.n.replace(/(\S+) ★$/, '<span class="nw">$1 <em>★</em></span>')}</span><b class="mt">${x.t}</b></div>`; }).join("")}</div>`).join("");
const rows = [...lens.querySelectorAll(".mr")];
$("#gw").textContent = DEF_HINT;

/* hover card: definition and full target */
function show(row) {
  const x = M[+row.dataset.k];
  const ln = (k, v, c = "") => `<div class="tr ${c}"><span class="k">${k}</span><i>${v}</i></div>`;
  tip.innerHTML = `<b>${x.n.replace(" ★", "")}</b><p>${x.d}</p>` +
    (x.a ? ln("APIs", x.a) + ln("Source", x.s) + (x.g ? ln("Signal", x.g) : "") : "") +
    ln("Target", x.tf) + (x.gap ? ln("Gap", x.gap, "gp") : "");
  tip.classList.toggle("wide", !!x.a);
  tip.hidden = false;
  const r = row.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
  let top = r.top - t.height - 8; if (top < 8) top = r.bottom + 8;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
const hide = () => { tip.hidden = true; };
const touch = window.matchMedia("(hover: none)").matches;
rows.forEach(r => {
  r.addEventListener("mouseenter", () => show(r));
  r.addEventListener("mouseleave", hide);
  r.addEventListener("focus", () => show(r));
  r.addEventListener("blur", hide);
  if (touch) r.addEventListener("click", () => (tip.hidden ? show(r) : hide()));
});

/* select a driver to dim every metric that does not move it; select again to clear */
let sel = -1;
function pick(i) {
  sel = sel === i ? -1 : i;
  drv.querySelectorAll(".drv").forEach((b, j) => { b.classList.toggle("on", sel === j); b.setAttribute("aria-pressed", sel === j); });
  rows.forEach(r => r.classList.toggle("dim", sel > -1 && +r.dataset.r !== sel));
  $("#gw").textContent = sel < 0 ? DEF_HINT : `${rows.filter(r => +r.dataset.r === sel).length} metrics move ${D[sel].n} · ${DEF_HINT.toLowerCase()}`;
  hide();
}
drv.addEventListener("click", e => { const b = e.target.closest(".drv"); if (b) pick(+b.dataset.i); });

</script>

  <!-- 1 · how it works: AI node flow -->

    <p class="lead">Orchestrated as a LangGraph state graph. Each node does one job, and every turn passes the input and output guardrails. Any failure ejects to a specialist with an eject summary.</p>
    <div class="dt-wrap"><table class="dtab nodes">
      <thead><tr><th>#</th><th>Node</th><th>AI/Capability</th><th>Input</th><th>Under the hood</th><th>Output</th></tr></thead>

        <tr><td class="n">1</td><td class="d">Intent</td><td><span class="cap">Classification</span></td><td>Last customer message + selected product + Product/Cause taxonomy/reference data</td><td class="uh"><ul><li>Interprets the customer's complaint intent.</li><li>Uses the selected product and customer description to determine the appropriate product/cause classification.</li><li>The classification determines which DAG / complaint workflow should be followed and therefore what information CxB needs to collect next.</li></ul></td><td>Product + Cause / intent classification + selected DAG</td></tr>
        <tr><td class="n">2</td><td class="d">Information Extractor</td><td><span class="cap">Information Extraction</span></td><td>Latest customer response + conversation context + fields required by the active DAG</td><td class="uh"><ul><li>Reads the customer's natural-language response and identifies information relevant to the complaint.</li><li>Extracts values such as account details or other complaint-specific information and stores those values separately.</li><li>Runs repeatedly as the conversation progresses so the complaint record is progressively populated.</li></ul></td><td>Structured/extracted complaint fields, associated with the conversation</td></tr>
        <tr><td class="n">3</td><td class="d">Quality Assurance</td><td><span class="cap">LLM-based validation</span></td><td>Extracted information + customer's response + expected information for the current question + Quality criteria for each field</td><td class="uh"><ul><li>Checks whether information produced by the Information Extractor is sufficiently correct/usable.</li><li>Acts as the quality gate before CxB progresses through the DAG.</li><li>Where the response is insufficient, the following response-generation step can ask the customer again rather than blindly progressing.</li></ul></td><td>Quality/validation result &amp; Reasoning → (valid flag) proceed or obtain further information</td></tr>
        <tr><td class="n">4</td><td class="d">Human Response</td><td><span class="cap">Generation</span></td><td>Current DAG/question + extracted/validated context + conversation context</td><td class="uh"><ul><li>Determines the next appropriate DAG question.</li><li>Generates a customer-facing version of that question using the current context rather than simply returning a raw workflow instruction.</li><li>If the previous response was inadequate, CxB can ask again in a different/polite formulation.</li><li>If multiple intents are identified, it will ask to proceed with one intent at a time.</li></ul></td><td>Next customer-facing CxB response/question</td></tr>
        <tr><td class="n">5</td><td class="d">Playback</td><td><span class="cap">Summarisation</span></td><td>Completed complaint information captured across the DAG at every turn</td><td class="uh"><ul><li>Once required capture is complete, creates a playback summary of the complaint for the customer.</li><li>Presents the captured information for acknowledgement before anything is committed to FirstPoint.</li><li>Yes/confirm → case creation. No/disagree → human path rather than creating the case as-is.</li></ul></td><td>Customer-confirmed complaint record, or exception/human path</td></tr>

  <!-- 3 · sample prompt and tests -->
  <section class="pane" id="p-prompt" role="tabpanel" hidden>
    <div class="pt">
      <div class="pcard">
        <div class="ph2"><b>Prompt · Intent node</b><span>Identifies every distinct complaint intent (product + cause) and the order to address them.</span></div>
        <h5>System</h5>
        <pre class="sysp">You are the Intent Expert for CxB, the Complaints Expert Bot.

Your task is to identify every distinct complaint intent expressed by the
customer and return the intents in the order in which CxB should address them.

DEFINITION OF AN INTENT

A CxB intent is one valid combination of:

- High-level Product
- High-level Cause

Different causes for the same product are separate intents.

Examples:

- Home Loan + Interest rate too high = one intent
- Home Loan + Fees and charges = a second intent
- Credit Card + Transaction dispute = a third intent

An intent is not the same as a detailed FirstPoint issue.

One intent may later map to:

- one high-level product;
- one high-level cause;
- one low-level product or sub-product; and
- one or more low-level causes or sub-causes.

The downstream Product/Cause classifier is responsible for detailed
FirstPoint issue classification. Do not treat multiple related sub-causes
within the same high-level Product/Cause combination as separate intents.

INPUTS

You will receive:

1. The customer's latest message
2. The customer-selected or upstream-selected product, if available
3. Relevant prior conversation context
4. Intents already identified in the current CxB conversation
5. The approved list of high-level Product/Cause combinations
6. The current active intent and its processing status, if applicable

TASK

1. Read the latest customer message together with the supplied conversation
   context.

2. Identify all distinct complaint intents explicitly expressed or strongly
   supported by the customer's statements.

3. For each intent:
   - select exactly one approved high-level Product;
   - select exactly one approved high-level Cause;
   - preserve the customer's supporting statement as evidence;
   - indicate whether the intent is NEW, EXISTING, UPDATED or DUPLICATE.

4. Compare newly detected intents with intents already recorded:
   - do not create the same Product/Cause combination twice;
   - do not treat paraphrases or repeated information as new intents;
   - do not remove a valid previously identified intent merely because the
     latest message discusses another intent.

5. Order the intents in which the customer raised them.

6. Count the unique intents across the entire current CxB conversation,
   including previously identified intents.

7. Apply the intent limit:
   - 0 supported intents:
       Return NEEDS_CLARIFICATION.
   - 1 to 3 unique intents:
       Return CONTINUE and provide the ordered intent list.
   - More than 3 unique intents:
       Return EJECT.
       Set the ejection reason to MULTIPLE_INTENTS_LIMIT_EXCEEDED.
       Do not continue to a DAG after the limit has been exceeded.

CLASSIFICATION RULES

- Select only Product and Cause values present in the approved taxonomy.
- Never invent, rename, shorten or merge taxonomy labels.
- Use the taxonomy label exactly as supplied.
- Multiple causes for the same product are multiple intents.
- A single high-level Product/Cause intent may contain multiple related lower-level issues or sub-causes. Do not split those into new intents here.
- Do not infer an intent only from a product name when no complaint cause is expressed or supported.
- Do not select a broad catch-all Cause when a more specific supported Cause exists.
- Do not return unnecessary additional intents merely because several taxonomy labels are conceptually related.
- Do not omit a separately expressed complaint merely because another intent appears more prominent.
- If the Product is clear but the Cause cannot be reliably distinguished, return NEEDS_CLARIFICATION for that candidate rather than guessing.
- Classify the customer's complaint, not the customer's requested remedy.

IMPORTANT ACCURACY CHECK:
Before returning the result, check for:

- Under-classification:
  Did you miss a distinct Product/Cause combination expressed by the customer?

- Misclassification:
  Did you assign an incorrect Product or Cause?

- Over-classification:
  Did you create an unnecessary additional intent from repeated, related or lower-level information?

- Exact taxonomy match:
  Does every returned Product/Cause label exactly match an allowed value?

- Duplicate detection:
  Is an apparent new intent already present in previously identified intents?

- Limit enforcement:
  Does the total unique intent count exceed three?

OUTPUT REQUIREMENTS:
Return valid JSON only. Do not include explanatory text outside the JSON.

OUTPUT SCHEMA:

{
  "intents": [
    {
      "intent_name": "&lt;exact product&gt;__&lt;exact cause&gt;",
      "product": "&lt;exact approved high-level product&gt;",
      "cause": "&lt;exact approved high-level cause&gt;",
      "status": "NEW | EXISTING | UPDATED | DUPLICATE",
      "supporting_evidence": "&lt;short customer statement&gt;",
      "classification_reason": "&lt;brief grounded explanation&gt;",
      "requires_clarification": false
    }
  ]
}</pre>
        <h5>User (example)</h5>
        <pre>Latest message: "My home loan rate went up again without any notice,
and on top of that I was charged a $300 break fee nobody told me about."
Selected product: Home Loan
Intents already identified: none</pre>
        <h5>Output (example)</h5>
        <pre>{ "intents": [
  { "intent_name": "Home Loan__Interest rate too high",
    "product": "Home Loan", "cause": "Interest rate too high",
    "status": "NEW",
    "supporting_evidence": "my home loan rate went up again without any notice",
    "classification_reason": "Customer objects to a rate increase on their home loan.",
    "requires_clarification": false },
  { "intent_name": "Home Loan__Fees and charges",
    "product": "Home Loan", "cause": "Fees and charges",
    "status": "NEW",
    "supporting_evidence": "charged a $300 break fee nobody told me about",
    "classification_reason": "A separate fee complaint on the same product.",
    "requires_clarification": false } ] }</pre>
        <h5>Error handling</h5>
        <pre>0 supported intents        → NEEDS_CLARIFICATION
1 to 3 unique intents      → CONTINUE with the ordered intent list
More than 3 unique intents → EJECT
                             reason MULTIPLE_INTENTS_LIMIT_EXCEEDED
Product clear, cause unclear → NEEDS_CLARIFICATION for that
                               candidate; never guess a label</pre>
      </div>
      <div class="dt-wrap"><table class="dtab tests">
        <thead><tr><th>#</th><th>Test</th><th>Input</th><th>Expected</th><th>What a failure tells you</th><th>What testing found</th></tr></thead>
        <tbody>
          <tr><td class="n">1</td><td class="d">Single intent</td><td>"I was charged a late fee on my credit card even though I paid on time."</td><td>1 NEW intent: Credit Card__Fees and charges · CONTINUE</td><td>Wrong product or cause, or a label that does not exactly match the taxonomy</td><td>Product recall 95%, cause recall 92%, precision 94%</td></tr><tr><td class="n">2</td><td class="d">Two causes, one product</td><td>"My home loan rate went up and I was charged a break fee I wasn't told about."</td><td>2 NEW intents, in the order raised</td><td>Under-classification: two complaints merged into one</td><td>Single-intent routing performed materially better than multi-intent classification</td></tr><tr><td class="n">3</td><td class="d">Related sub-causes</td><td>"My card was charged twice and the second charge is still pending."</td><td>1 intent: Credit Card__Transaction dispute</td><td>Over-classification: sub-causes split into separate intents</td><td>Issue taxonomy gate added to stop over-identification</td></tr><tr><td class="n">4</td><td class="d">Repeated complaint</td><td>A later message restates the rate complaint in different words</td><td>Status EXISTING or DUPLICATE; no new intent</td><td>Duplicate detection is not working</td><td>New-issue gate filters repetitions; scope narrowed to the last 2 messages</td></tr><tr><td class="n">5</td><td class="d">No cause expressed</td><td>"It's about my home loan. Honestly, this bank is a joke."</td><td>NEEDS_<wbr>CLARIFICATION; no intent inferred from the product name alone</td><td>The model guesses a cause from a product name or sarcasm</td><td>Sarcasm detection was missing; added as a business rule</td></tr><tr><td class="n">6</td><td class="d">Noisy input</td><td>"chrged twice for th same thng on my card"</td><td>Same result as the clean sentence</td><td>The classifier relies on exact wording</td><td>82 noisy cases, noise applied 15 times; meaning stayed stable</td></tr>
        </tbody>
      </table></div>
    </div>
  </section>

  <!-- 4 · prerequisites -->
  <section class="pane" id="p-pre" role="tabpanel" hidden>
    <p class="lead">This redesign only works if these are true before you build.</p>
    <div class="dt-wrap"><table class="dtab pre">
      <thead><tr><th>#</th><th>Prerequisite</th><th>Why it matters</th><th>What breaks without it</th></tr></thead>
      <tbody>
        <tr><td class="n">1</td><td class="d">SME-labelled ground truth for each complaint type</td><td>Classification and extraction are measured against it</td><td>No way to know whether bot created complaint is correct</td></tr>
        <tr><td class="n">2</td><td class="d">A fixed product and cause taxonomy for each H1 DAG flow</td><td>The classifier picks from a list instead of inventing values</td><td>Overlapping categories give inconsistent data downstream</td></tr>
        <tr><td class="n">3</td><td class="d">A case-creation API into Firstpoint</td><td>Removes manual keying by case managers</td><td>Capture still ends in re-keying (P2)</td></tr>
        <tr><td class="n">4</td><td class="d">Guardrail service and the Companion hand-off contract</td><td>The hand-off is the entry point; every turn is then checked</td><td>No safe way to run without a human on every turn</td></tr>
        <tr><td class="n">5</td><td class="d">A handling team within D365, trained on messaging</td><td>Someone must resolve in near real time</td><td>Captured complaints still in wait queue thereby impacting customer experience</td></tr>
        <tr><td class="n">6</td><td class="d">Compliance approval of scope exclusions (only capture) and human out of the loop</td><td>The RG 271 risk is accepted explicitly</td><td>No approval to launch</td></tr>
        <tr><td class="n">7</td><td class="d">A human review dashboard for end-of-day review</td><td>Human outcomes calibrate the LLM judges</td><td>No independent assurance of quality</td></tr>
        <tr><td class="n">8</td><td class="d">Kill switch, volume cap and business-hours controls</td><td>They bound the blast radius</td><td>A failure reaches every customer at once</td></tr>
      </tbody>
    </table></div>
    <div class="ec">
      <div class="ec-h"><b>Edge cases</b><span>What could still go wrong after launch, and how the design contains it</span></div>
      <div class="ec-g">
      <article class="ec-c"><header><span class="ec-n">EC1</span><h4>Customer abandonment</h4><em>Ops</em></header>
        <p><b class="r">Risk</b>The bot only replies to customer messages, so if the customer abandons mid-conversation it stays open forever.</p><p><b class="m">Mitigation</b>Enable bidirectional A2A requests, so ExpertBot can initiate the ejection itself.</p></article>
      <article class="ec-c"><header><span class="ec-n">EC2</span><h4>Ejection failure</h4><em>Regulatory</em></header>
        <p><b class="r">Risk</b>A failed ejection is a critical regulatory obligation breach.</p><p><b class="m">Mitigation</b>Retry, save context and trigger instant alerts to all systems, so open conversations can be picked up manually.</p></article>
      <article class="ec-c"><header><span class="ec-n">EC3</span><h4>Duplicate complaints</h4><em>Financial</em></header>
        <p><b class="r">Risk</b>Double dipping of fee refunds, plus operational impact.</p><p><b class="m">Mitigation</b>Operations staff check for duplicates per CIF.</p></article>
      <article class="ec-c"><header><span class="ec-n">EC4</span><h4>Tech failure handling</h4><em>CX</em></header>
        <p><b class="r">Risk</b>Any failure to generate a response directly impacts the customer experience.</p><p><b class="m">Mitigation</b>Clear responsibilities across all agents involved, with fallbacks to alternate channels to continue the complaint.</p></article>
      </div>
    </div>
  </section>

</style></head><body><main class="page"><section class="hero panel"><div class="eyebrow">CXB • 05 AI risk &amp; governance</div><h1>AI Risk &amp; Governance</h1><p>Seven interlocking mechanisms governed the autonomous complaints journey</p><div class="strip"><div class="kpi"><b>21</b><span>Bespoke business rules</span></div><div class="kpi"><b>11</b><span>Guardrails</span></div><div class="kpi"><b>6</b><span>Evaluation families</span></div><div class="kpi"><b>100%</b><span>Initial HRD review planned</span></div><div class="kpi"><b>3</b><span>Pilot intake controls</span></div><div class="kpi"><b>AI</b><span>Observability across model + service</span></div><div class="kpi"><b>15k</b><span>Cohort</span></div></div></section><div class="topics">
<section class="topic panel open" id="fallback" style="--c:#b4534a;--soft:#f8eeec"><button class="head" onclick="openOne('fallback')"><span class="num">01</span><span class="name"><b>Human Fallback Triggers</b><small>Every exit from autonomy, in one place</small></span><span class="summary">Thresholds and treatments that hand a conversation to a person</span><span class="plus">+</span></button><div class="body"><table class="table"><tr><th>Trigger</th><th>Threshold</th><th>Treatment</th></tr>
<tr><td>High-risk guardrail (vulnerability, harmful content, jailbreak)</td><td>Any detection</td><td>Transfer to a specialist with the conversation summary and the reason</td></tr>
<tr><td>Guardrail execution error</td><td>Any error</td><td>Eject immediately, no retries</td></tr>
<tr><td>Other technical error</td><td>Retry fails within 2 min</td><td>Eject to a specialist</td></tr>
<tr><td>No reply from the agent</td><td>2 min</td><td>Eject to a specialist</td></tr>
<tr><td>Customer asks for a person</td><td>3rd request</td><td>Eject; the agent tries to help first</td></tr>
<tr><td>Invalid or unusable answers</td><td>3rd attempt</td><td>Eject to a specialist</td></tr>
<tr><td>Customer disagrees with the playback</td><td>Any disagreement</td><td>Eject; no case is created from a wrong summary</td></tr>
<tr><td>Customer inactive</td><td>120 mins</td><td>Eject</td></tr>
<tr><td>Kill switch, volume cap, outside hours</td><td>Flag on · cap reached · outside 9am–5pm M–F</td><td>New conversations go to alternate channels; an active one is ejected</td></tr></table>
<div class="callout"><b>Every ejection carries context:</b> An eject summary, the reason label and the last 7,000 characters of transcript, so the specialist never asks the customer to repeat themselves.</div></div></section>
<section class="topic panel" id="guardrails" style="--c:#b4534a;--soft:#f8eeec"><button class="head" onclick="openOne('guardrails')"><span class="num">02</span><span class="name"><b>Guardrails</b><small>11 Safety controls</small></span><span class="summary">Deterministic safety evaluation; classifier errors; treatment actions</span><span class="plus">+</span></button><div class="body"><div class="grid"><div class="card"><h4>Input / output controls</h4><p><span class="pill">Vulnerability</span><span class="pill">Jailbreak</span><span class="pill">Harmful content</span><span class="pill">Off-topic</span><span class="pill">Profanity</span><span class="pill">PII</span><span class="pill">Competitor</span><span class="pill">Language</span><span class="pill">Financial advice</span><span class="pill">Legal advice</span><span class="pill">Groundedness</span></p></div><div class="card"><h4>Test mechanics</h4><p>Labelled positive/negative scenarios → guardrail result → True/False Positive/Negative → precision, recall, accuracy and F1.</p></div><div class="card"><h4>Treatment</h4><p>Mask, block, pre-canned response, specialist-priority path, continue under control or human ejection.</p></div><div class="card"><h4>Outcome</h4><p>Jailbreak effectively detected true behaviour with recall of <b>98.16%</b>; Vulnerability testing identified gaps with weak signals; Privacy controls over-masked values.</p></div></div></div></section>
<section class="topic panel" id="evals" style="--c:#5b7fb5;--soft:#edf2f9"><button class="head" onclick="openOne('evals')"><span class="num">03</span><span class="name"><b>Evals</b><small>Measured model + workflow evidence</small></span><span class="summary">Results across nodes, E2E conversation quality, guardrails, adversarial, rules and consistency</span><span class="plus">+</span></button><div class="body"><div class="tabs" data-tabs="ev"><button class="active" onclick="tab(event,'ev','node')">Individual nodes</button><button onclick="tab(event,'ev','e2e')">E2E quality</button><button onclick="tab(event,'ev','adv')">Adversarial</button><button onclick="tab(event,'ev','cons')">Consistency</button><button onclick="tab(event,'ev','sme')">Problems → impact → fixes</button></div>
<div class="pane active" data-group="ev" id="node"><table class="table"><tr><th>Node</th><th>Method</th><th>Evidence / result</th><th>Finding</th></tr><tr><td><b>Intent</b></td><td>SME-labelled ground truth; precision/recall/accuracy</td><td>Cause recall <b>92%</b>; product recall <b>95%</b>; pre-cause recall <b>91%</b>; precision <b>94%</b>. 91-case analysis also reported sub-product/sub-cause accuracy ranging from 63–92% for one set and 20–55% for a harder set.</td><td>Single-intent routing performed materially better than deeper / multi-intent classification.</td></tr><tr><td><b>IEE</b></td><td>LLM-as-a-Judge for relevance, accuracy, missed extraction and leaked context</td><td>Accuracy <b>95.15%</b>; <b>89.15</b> Quality, <b>10.12</b> missed-opportunity penalty</td><td>Important failure categories included Date of Occurrence 15.43% of inaccurate flags, Fee Information and Outcome Sought 6.52%. Criteria were relaxed to handle realistic customer uncertainty.</td></tr><tr><td><b>QRE</b></td><td>LLM judge against field-specific YAML criteria</td><td>Criteria split into adherence, reasoning quality and practical sufficiency; consistency tested on ~60 cases per DAG with 10 runs each.</td><td>Rigid acceptance criteria caused unnecessary repeat questions when customers could not provide exact details.</td></tr><tr><td><b>HRE</b></td><td>LLM judge: groundedness, guideline adherence, empathy/tone, safety</td><td>Safety compliance reported as uniformly strong with no observed issues; scoring separated minor, major and critical violations.</td><td>Response quality needed outcome-aware scoring so valid transfer/eject responses were not treated as ordinary failed conversations.</td></tr><tr><td><b>Financial outcome</b></td><td>Extractor vs judge agreement</td><td><b>63 evaluations</b>; <b>96.83% accuracy</b>; 3.17% NO; no over-extraction observed.</td><td>Structured extraction showed strong, stable performance when task completion was explicitly defined.</td></tr></table></div>
<div class="pane" data-group="ev" id="e2e"><div class="grid"><div class="card"><h4>Method</h4><p>Custom Python evaluation framework built using LLM-as-a-Judge over full conversations, producing categorical outputs such as YES / NO / NA, with special scoring scales for satisfaction and helpfulness, plus evaluator reasoning.</p></div><div class="card"><h4>8 dimensions</h4><p>Groundedness, information gathering, clarity/tone, guideline adherence, naturalness, satisfaction, content safety, helpfulness.</p></div><div class="card"><h4>Measured findings</h4><p>Safety compliance was uniformly strong. Eject-specific prompts improved fairness by marking irrelevant measures as Not Applicable instead of No.</p></div><div class="card"><h4>Eject summaries</h4><p><b>35 ejected cases</b> evaluated; CX1/CX2 were strong across quality dimensions. A small “Others–Multiple” sample (~9) had 2–3 clear issues, disproportionately lowering aggregate scores.</p></div></div></div>

<div class="pane" data-group="ev" id="adv"><div class="grid"><div class="card"><h4>Coverage</h4><p>Jailbreak, competing intents, vulnerability, refusal, repeated human requests, inaccurate playback, long/inactive journeys, endpoint/timeouts and parsing failures.</p></div><div class="card"><h4>Method</h4><p>SME-defined and independent scenarios with expected treatment; cyber adversarial testing aligned to end-to-end penetration testing.</p></div><div class="card"><h4>Findings</h4><p>Overlapping rules could suppress expected pre-canned messages; simulated actions sometimes fired at unrealistic points; some outcomes required human interpretation.</p></div><div class="card"><h4>Impact</h4><p>Edge cases drove prompt/rule changes, explicit safe-ejection paths and regression scenarios.</p></div></div></div>

<div class="pane" data-group="ev" id="cons"><div class="grid"><div class="card"><h4>Intent</h4><p>82 noisy cases across three DAGs; noise applied 15 times. Retest used 90 cases focused on the first customer message.</p></div><div class="card"><h4>IEE</h4><p>10 cases per field; 20 runs each: 10 clean and 10 with typos, grammar mistakes and synonyms.</p></div><div class="card"><h4>QRE</h4><p>~60 cases per DAG; 10 runs each; measured embedding similarity, BERTScore and decision consistency.</p></div><div class="card"><h4>Finding</h4><p>Testing separated semantic stability from exact wording, while preserving JSON structure and key facts during noise injection.</p></div></div></div>
<div class="pane" data-group="ev" id="sme"><table class="table"><tr><th>Problem identified</th><th>Impact</th><th>Technical / product fix</th></tr><tr><td class="problem">Over-generalisation and over-identification of intent</td><td>Core customer issue could be replaced by a broad or duplicated classification, corrupting downstream product/cause fields.</td><td class="fix">Introduced two gating mechanisms: an Issue Taxonomy gate and a New-Issue gate (filter repetitions), narrowed scope to the last 2 messages, and redefined product categories to avoid overlap.</td></tr><tr><td class="problem">LLM output parsing / malformed structure</td><td>Endpoint could succeed but downstream workflow still fail because the response did not match the expected schema.</td><td class="fix">Pydantic classes and JSON output parsers validated LLM outputs; error handling classified invocation vs parsing failure and routed unrecoverable cases to safe ejection.</td></tr><tr><td class="problem">Repeated questions when exact information unavailable</td><td>Customers could be trapped in frustrating loops for exact dates, account digits or fee details.</td><td class="fix">Relaxed IEE/QRE criteria; allowed “unable to provide” outcomes; changed date-of-occurrence from hard date format to free text; accepted no-impact / no-outcome responses.</td></tr><tr><td class="problem">Evaluation rubric penalised valid transfers/ejections</td><td>Legitimate non-completion looked like poor quality and distorted E2E scores.</td><td class="fix">Introduced transfer/eject-specific evaluation prompts and marked non-applicable dimensions as Not Applicable rather than No.</td></tr><tr><td class="problem">Free-text intent confirmation triggered false ejection</td><td>Customers could be ejected despite not disagreeing with the identified intent.</td><td class="fix">Flagged for rule/prompt refinement: distinguish free-text confirmation from genuine incorrect-intent disagreement.</td></tr><tr><td class="problem">Staff name and personal-data privacy</td><td>Raw prompts/traces required for diagnosis could expose staff/customer information.</td><td class="fix">Strengthened masking/privacy controls and separated traceability needs from business reporting; retained only approved identifiers/content.</td></tr></table></div></div></section>
<section class="topic panel" id="rules" style="--c:#4f8a68;--soft:#eef5f0"><button class="head" onclick="openOne('rules')"><span class="num">04</span><span class="name"><b>Bespoke Business Rules</b><small>21 Complaint-specific controls</small></span><span class="summary">Why generic guardrails were insufficient; measured rule outcomes and fixes</span><span class="plus">+</span></button><div class="body"><div class="grid">
<div class="card"><h4>Why needed</h4><p>Generic safety classifiers did not encode complaint-specific workflow decisions such as human requests, invalid answers, sarcasm, third-party scenarios or playback disagreement.</p></div>
<div class="card"><h4>Findings</h4><p><b>68 potential failures</b> flagged out of approximately <b>545 total cases</b>; only <b>6 cases (1.1%)</b> confirmed as genuine failures; <b>62</b> were acceptable outcomes misclassified.</p></div>
<div class="card"><h4>Observed prevalence</h4><p>Pre-canned-message rules triggered in <b>18%</b> of first messages, mainly general questions (<b>17%</b>). Ejection rules triggered in <b>9%</b>, led by contact details (<b>3%</b>) and human requests (<b>2%</b>).</p></div>
<div class="card"><h4>Fixes</h4><p>Correct third-attempt ejection, add missed sarcasm detection, eject on playback disagreement, refine incorrect-intent handling and align action terminology such as eject/ejection/ejecting across systems.</p></div>
</div></div></section>
<section class="topic panel" id="pilot" style="--c:#a38a3c;--soft:#f7f3e6"><button class="head" onclick="openOne('pilot')"><span class="num">05</span><span class="name"><b>Pilot: Blast-radius Controls</b><small>Controlled launch readiness</small></span><span class="summary">Kill switch, volume cap, business hours, cohort and exit evidence</span><span class="plus">+</span></button><div class="body"><div class="grid"><div class="card"><h4>Controls implemented</h4><p><b>Hard kill switch</b>, <b>fixed daily/volume cap</b> and <b>business-hours control</b>; designed to limit blast radius and protect review / case-manager capacity.</p></div><div class="card"><h4>Cohort</h4><p>Configured Companion cohort of approximately <b>15,000 customers</b>, not immediate bank-wide exposure.</p></div><div class="card"><h4>Readiness evidence</h4><p>6 eval families, 11 guardrails, 21 business rules, human ejection, EOD HRD, observability and training for D365 + Dialogue Monitoring.</p></div><div class="card"><h4>Outcome statement</h4><p>Progressed to governed pilot-launch readiness with explicit stop/scale controls, known failure-path tests and human assurance. Training scope included D365 messaging plus Dialogue Monitoring/EOD review.</p></div></div><h4 class="ro">Rollout plan</h4><table class="table"><tr><th>Phase</th><th>Exposure</th><th>Scale when</th><th>Stop when</th></tr>
<tr><td>0 · Internal test</td><td>Staff and test customers</td><td>E2E, adversarial and regression suites pass</td><td>Any critical defect</td></tr>
<tr><td>1 · Pilot</td><td>~15,000-customer cohort, business hours, cap of 10 a day</td><td>After 6 weeks: single interaction resolution ≥90%, product accuracy ≥95%, 0 control-threshold breaches, unnecessary ejections ≤95%</td><td>Kill switch triggered, a high-risk QA finding or a guardrail threshold breach</td></tr>
<tr><td>2 · Expanded cohort</td><td>100k customers</td><td>Thresholds held for 12 weeks; judge-human agreement ≥98%, so sampling replaces 100% review</td><td>As above</td></tr>
<tr><td>3 · All Companion customers</td><td>Business hours</td><td>Handling-team capacity matches demand</td><td>As above</td></tr></table></div></section>
<section class="topic panel" id="obs" style="--c:#4a8a90;--soft:#ecf4f4"><button class="head" onclick="openOne('obs')"><span class="num">06</span><span class="name"><b>Observability</b><small>Model + Service + Outcome</small></span><span class="summary">HoneyHive, Prometheus/Grafana, Observe and operational findings</span><span class="plus">+</span></button><div class="body"><div class="grid"><div class="card"><h4>HoneyHive</h4><p>LLM requests/responses, node sequence, tools, decisions and per-span latency for root-cause diagnosis.</p></div><div class="card"><h4>Prometheus / Grafana + Observe</h4><p>Service errors, exception counts, stack traces, latency, timeouts, saturation and alerts.</p></div><div class="card"><h4>Finding: long contexts</h4><p>Long/multi-turn conversations increased model-processing time and exposed tail-latency risk. Response-time monitoring was therefore split by node/dependency rather than relying on one average.</p></div><div class="card"><h4>Fix / impact</h4><p>Correlate HoneyHive session and parent spans with W3C traceparent/session_id; use service alerts for operational action and traces for diagnosis. Long-context and timeout scenarios moved into E2E/regression coverage.</p></div></div></div></section>
<section class="topic panel" id="hrd" style="--c:#7f6bb3;--soft:#f1eef8"><button class="head" onclick="openOne('hrd')"><span class="num">07</span><span class="name"><b>EOD Human Review</b><small>Independent assurance</small></span><span class="summary">100% initial review; quality, safety, ejection and judge calibration</span><span class="plus">+</span></button><div class="body"><div class="grid"><div class="card"><h4>Parameters</h4><p>Intent, product/cause, complaint completeness, missing/fabricated content, guardrail/rule efficacy, conduct, missed ejection and unnecessary ejection.</p></div><div class="card"><h4>Coverage</h4><div class="metric">100%</div><div class="label">Initial conversations planned for T-1 review</div></div><div class="card"><h4>Judge calibration</h4><p>Human outcome becomes ground truth; disagreements with LLM judges refine prompts, rubrics and operating thresholds before sampling replaces full review.</p></div><div class="card"><h4>Impact</h4><p>Closed the gap between model scores and real business acceptability, especially where automated checks flagged acceptable overlapping-rule behaviour.</p></div></div></div></section>
</div><div class="footer">CXB • 05 AI risk &amp; governance · Product management portfolio</div></main><script>

<script>
(function(){
const $ = s => document.querySelector(s);
const wrapText = (s, n) => { const out = []; let cur = ""; s.split(" ").forEach(w => { if ((cur + " " + w).trim().length > n) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }); out.push(cur); return out; };
const GR = [ /* kind, strapline, header colour, text colour, [name, definition] */
  ["Cascading", "SLM scores risk first; the LLM verifies high-risk cases", "#14243B", "#fff", [
    ["Complaints", "Spots dissatisfaction or intent to complain, so the conversation can move to the complaints agent."],
    ["Vulnerability", "Detects signs of customer vulnerability, such as family violence, financial difficulty, illness or bereavement."],
    ["Jailbreaking", "Detects attempts to trick the model into ignoring its instructions or safety rules."],
    ["Financial advice", "Flags replies that give personal financial advice the bank is not permitted to give."],
    ["Groundedness", "Checks that a reply is supported by the context provided, rather than invented."]]],
  ["LLM", "A language model judges every check", "#FFCC00", "#2b2200", [
    ["Harmful content", "Detects hateful, violent, sexual or otherwise harmful language in a message."],
    ["Denied topics (off-topic)", "Detects questions outside the topics the agent is allowed to discuss."],
    ["Language check", "Checks that a message is written in a supported language."]]],
  ["Non-LLM", "Rule-based checks with no model call", "#6b7078", "#fff", [
    ["Profanity", "Detects swearing and offensive language, in customer messages or in replies."],
    ["PII", "Detects personal information such as card numbers, tax file numbers and emails, and can mask it."],
    ["Competitor check", "Detects mentions of competitor banks or brands."]]]
];
function guardSvg() {
  const T = (x, y, s, o = "") => `<text x="${x}" y="${y}" ${o}>${s}</text>`;
  let s = `<svg viewBox="0 0 1500 590" role="img" aria-label="The eleven guardrails, grouped by how they are checked: cascading, LLM and non-LLM, each with its definition">`;
  GR.forEach(([kind, line, col, tx, items], c) => {
    const x = 30 + c * 480;
    s += `<rect x="${x}" y="10" width="440" height="76" rx="14" fill="${col}"/>` + T(x + 20, 42, kind, `font-size="23" font-weight="800" fill="${tx}"`);
    wrapText(line, 62).forEach((l, i) => { s += T(x + 20, 64 + i * 17, l, `font-size="14" fill="${tx}" opacity=".85"`); });
    items.forEach(([n, d], i) => { const y = 100 + i * 96;
      s += `<rect x="${x}" y="${y}" width="440" height="86" rx="12" fill="#fff" stroke="#d6d9de" stroke-width="1.6"/><rect x="${x}" y="${y}" width="7" height="86" rx="3" fill="${col}"/>` + T(x + 24, y + 29, n, `font-size="18" font-weight="800" fill="#14243B"`);
      wrapText(d, 60).forEach((l, j) => { s += T(x + 24, y + 51 + j * 18, l, `font-size="14" fill="#444"`); }); });
  });
  return s + "</svg>";
}
function slmSvg() {
  const T = (x, y, s, o = "") => `<text x="${x}" y="${y}" ${o}>${s}</text>`;
  const box = (x, y, w, h, fill, stroke, t, lines, tc = "#14243B", sc = "#555") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${fill}" stroke="${stroke}" stroke-width="2.2"/>` +
    T(x + w / 2, y + 38, t, `text-anchor="middle" font-size="20" font-weight="800" fill="${tc}"`) + lines.map((l, i) => T(x + w / 2, y + 64 + i * 20, l, `text-anchor="middle" font-size="14.5" fill="${sc}"`)).join("");
  const ln = (d, c = "#8f96a0") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.6" marker-end="url(#sa)"/>`;
  const X = v => 140 + v * 1220;
  let s = `<svg viewBox="0 0 1500 620" role="img" aria-label="How the small language model scores risk, how that score is compared with the strictness threshold, and when the large language model is invoked">
  <defs><marker id="sa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#8f96a0"/></marker></defs>`;
  s += box(30, 190, 200, 120, "#fff", "#14243B", "Request", ["Query", "Strictness S (0 to 1)"]);
  s += box(300, 190, 210, 120, "#FFCC00", "#14243B", "SLM risk model", ["Small, fast, low cost", "Returns risk score R"], "#2b2200", "#4a3a00");
  s += `<path d="M700 170L800 250L700 330L600 250Z" fill="#14243B"/>` + T(700, 258, "R ≥ S ?", `text-anchor="middle" font-size="22" font-weight="800" fill="#FFCC00"`);
  s += box(900, 50, 250, 120, "#e8f5ec", "#1f8a4c", "Bypass the LLM", ["riskDetected = false", "llmEvaluated = false"]);
  s += box(900, 330, 250, 130, "#fff7da", "#e0a800", "LLM verifies", ["Large, deeper check", "Returns riskDetected,", "explanation, category"]);
  s += box(1230, 190, 240, 120, "#14243B", "#14243B", "Final decision", ["riskScore · strictness", "llmEvaluated · riskDetected"], "#fff", "#cfd5df");
  s += ln("M230 250H300") + ln("M510 250H600") + ln("M700 170V110H900", "#1f8a4c") + ln("M700 330V395H900", "#c98a00") + ln("M1150 110H1350V190", "#1f8a4c") + ln("M1150 395H1350V310", "#c98a00");
  s += T(800, 98, "R &lt; S: low risk", `text-anchor="middle" font-size="15" font-weight="700" fill="#1f8a4c"`) + T(800, 424, "R ≥ S: high risk", `text-anchor="middle" font-size="15" font-weight="700" fill="#b07a00"`);
  s += T(1025, 196, "No LLM call, so no LLM cost", `text-anchor="middle" font-size="14" font-style="italic" fill="#1f8a4c"`);
  /* the threshold scale, with the worked example */
  s += T(140, 488, "Threshold: strictness S sets how easily the LLM is called. A lower S calls it more often.", `font-size="16" font-weight="700" fill="#14243B"`);
  s += `<rect x="${X(0)}" y="520" width="${X(0.8) - X(0)}" height="30" rx="6" fill="#cfe8d6"/><rect x="${X(0.8)}" y="520" width="${X(1) - X(0.8)}" height="30" rx="6" fill="#fde3a0"/>`;
  s += T(X(0.4), 541, "R &lt; S: LLM bypassed", `text-anchor="middle" font-size="15" font-weight="700" fill="#1f5e3a"`) + T((X(0.8) + X(1)) / 2, 541, "R ≥ S: LLM invoked", `text-anchor="middle" font-size="15" font-weight="700" fill="#6b4b00"`);
  [[0, "0"], [0.2, "0.2 · high"], [0.6, "0.6 · medium"], [0.8, "0.8 · low"], [1, "1"]].forEach(([v, l]) => { s += `<path d="M${X(v)} 550V560" stroke="#14243B" stroke-width="2"/>` + T(X(v), 580, l, `text-anchor="middle" font-size="14.5" font-weight="700" fill="#14243B"`); });
  s += T(140, 603, "Presets high, medium and low map to 0.2, 0.6 and 0.8. A number strictly between 0 and 1 is used as given.", `font-size="13.5" fill="#5b6470"`);
  s += `<path d="M${X(0.8)} 519l-8 -14h16z" fill="#14243B"/>` + T(X(0.8) + 14, 505, "S = 0.8", `font-size="14.5" font-weight="800" fill="#14243B"`);
  s += `<circle cx="${X(0.75)}" cy="512" r="8" fill="#FFCC00" stroke="#14243B" stroke-width="2"/>` + T(X(0.75) - 14, 505, "R = 0.75", `text-anchor="end" font-size="14.5" font-weight="800" fill="#14243B"`);
  return s + "</svg>";
}
$("#gr2").innerHTML = slmSvg();
const ov = $("#gdov"), host = $("#guardrails .body");
const btn = document.createElement("button"); btn.className = "gdbtn"; btn.type = "button"; btn.textContent = "Checkout guardrail design";
host.parentNode.appendChild(btn);
const close = () => { ov.classList.remove("show"); btn.focus(); };
btn.addEventListener("click", () => { ov.classList.add("show"); $("#gdx").focus(); });
$("#gdx").addEventListener("click", close);
ov.addEventListener("click", e => { if (e.target === ov) close(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && ov.classList.contains("show")) close(); });
})();
</script>

<section class="hero panel"><div class="hero-title"><div><div class="eyebrow">CXB • 06 Impact &amp; reflections</div><h1>Impact &amp; Reflection</h1><p class="right-description">Converted a complex regulated GenAI concept into a measurable, governed product proposition, validating core AI capabilities, surfacing failure modes early and establishing an operating model for progressive customer exposure.</p></div></div></section>
<div class="row ba-row"><div class="ba-stack"><section class="section panel bapanel"><div class="head"><div><h2>Business impact</h2></div><span class="tag">Expected</span></div><table class="batab"><thead><tr><th>Measure</th><th>Before</th><th>After</th></tr></thead><tbody><tr><td class="m">Case-manager capture time per complaint</td><td>45 min</td><td class="af">~0</td></tr><tr><td class="m">Time to first human response</td><td>24+ hrs</td><td class="af">≤5 min</td></tr><tr><td class="m">Time to resolution</td><td>1–30+ days</td><td class="af">P80 ≤ 1 day</td></tr><tr><td class="m">Companion complaints lodged (regulatory requirement)</td><td>~40%</td><td class="af">100%</td></tr><tr><td class="m">Digital share of Group complaints</td><td>~1%</td><td class="af">65%</td></tr><tr><td class="m">Single interaction resolution</td><td>~80%</td><td class="af">≥90%</td></tr></tbody></table></section><div class="impact-statement">My impact was shaping not only what CxB could do, but the evidence, controls and operating conditions under which an autonomous AI complaints experience could be trusted.</div></div><section class="section panel"><div class="head"><div><h2>Evidence of product maturity</h2><p>Quantified validation and assurance outcomes.</p></div><span class="tag">Measured</span></div><div class="dark"><div class="eyebrow">AI assurance</div><h3>Quality validated at multiple levels</h3><div class="proofs"><div class="proof"><b>99.53%</b><span>HRE groundedness</span></div><div class="proof"><b>100%</b><span>HRE safety/compliance</span></div><div class="proof"><b>96.12%</b><span>QRE valid-flag accuracy</span></div><div class="proof"><b>98.16%</b><span>Jailbreak recall after calibration</span></div><div class="proof"><b>1.1%</b><span>Confirmed business-rule failures</span></div><div class="proof"><b>97.71%</b><span>Financial outcome accuracy</span></div><div class="proof"><b>95.27%</b><span>Eject summaries rated Great</span></div><div class="proof"><b>90.83%</b><span>Case summaries rated Great</span></div><div class="proof"><b>95%</b><span>Product recall</span></div><div class="proof"><b>94%</b><span>Intent precision</span></div><div class="proof"><b>97%</b><span>QRE consistency</span></div><div class="proof"><b>15k</b><span>Pilot customers</span></div></div></div></section></div>
<section class="reflection panel"><div class="head"><div><h2>Reflections I would carry into the next AI product</h2><p>Product-management learning converted into operating principles.</p></div><span class="tag">Learning</span></div><div class="lessons"><div class="lesson" style="--c:var(--purple)"><span class="n">01</span><h3>Scope by evidence, not ambition</h3><p>Starting with every complaint type would have spread validation thin; FY24 volume showed where the value was concentrated.</p><div class="apply">Size H1 to the smallest slice that proves the model on the most volume, then widen.</div></div><div class="lesson" style="--c:var(--blue)"><span class="n">02</span><h3>Design for measurability from Day 1</h3><p>Each component and customer outcome needs its own definition of good.</p><div class="apply">Define evals, telemetry, ground truth and production measures alongside the journey.</div></div><div class="lesson" style="--c:var(--green)"><span class="n">03</span><h3>Human review should create leverage</h3><p>Human assurance should generate ground truth that improves automated monitoring.</p><div class="apply">Calibrate judges, then move toward risk-based exception review.</div></div><div class="lesson" style="--c:var(--orange)"><span class="n">04</span><h3>Pilot controls are product strategy</h3><p>Autonomous products need a deliberately bounded way to learn.</p><div class="apply">Make cohorts, caps, hours, kill conditions and scale thresholds explicit roadmap decisions.</div></div></div></section>
<section class="section panel hzpanel"><div class="head"><div><h2>Vision and horizons</h2><p>An end-to-end digital complaints experience that offers customers fast and fair outcomes when things go wrong.</p></div><span class="tag">What comes next</span></div>
<div class="hzg">
<div class="hzc on"><div class="hzt"><span class="hb hdk">H1 · Capture</span><span class="hpill">Delivered</span></div><p>Detect complaint intent in Companion → Expert captures context and classifies product and cause → case created automatically → specialist resolves via messaging in near real time.</p><p class="hzs"><b>Scoped to 3 complaint types</b> (~56% of FY24 Group volume)</p></div>
<div class="hzc"><div class="hzt"><span class="hb">H2 · Resolve</span><span class="hpill f">Future</span></div><p>The Expert resolves simple complaints itself, end to end, within policy.</p></div>
<div class="hzc"><div class="hzt"><span class="hb">H3 · Support staff</span><span class="hpill f">Future</span></div><p>The Expert assists staff across phone, branch and messaging to capture and resolve.</p></div>
</div><p class="hznote">Group benefits are realised at scale once phone demand is redirected to Companion and resolution is enabled in chat.</p></section>
<div class="footer">CXB • 06 Impact &amp; reflections · Product management portfolio</div></main></body></html>

<div class="card role"><span class="rb">My role</span>
 <span><b>Title</b>Product Manager</span>
 <span><b>Owned</b>Requirements, Risk weights, Reviewer workflow, ExpertBot integration, Rollout</span>
 <span><b>Team</b>PM + Data Science + Engineering + QA ops</span></div>

<div class="hero"><div><span class="chip">Dialogue Monitoring · ExpertBot</span>
 <h2>Risk that slips past real-time guardrails needs a human check the same day</h2>
 <p>Dialogue Monitoring re-scores every ExpertBot conversation for risk every 2 hours, keeps the review queue ranked and gives QA reviewers one place to confirm, flag and remediate. Every review labels every eval, so it tunes the guardrails and benchmarks the LLM judge.</p></div>
 <div class="hv">
  <div class="hg"><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="hgg" x1="0" x2="1"><stop offset="0" stop-color="#F7C948"/><stop offset="1" stop-color="#1b1b1b"/></linearGradient></defs></svg>
   <svg viewBox="0 0 110 64"><path d="M11 58a44 44 0 0 1 88 0" fill="none" stroke="url(#hgg)" stroke-width="11" stroke-linecap="round"/></svg>
   <b>100%</b><span>of pilot conversations reviewed the same day (EOD)</span></div>
  <div class="hp"><svg viewBox="0 0 64 44"><circle cx="20" cy="11" r="8" fill="#F7C948"/><path d="M4 42c0-10 7-17 16-17s16 7 16 17z" fill="#F7C948"/><circle cx="42" cy="9" r="9" fill="#1b1b1b"/><path d="M24 42c0-11 8-19 18-19s18 8 18 19z" fill="#1b1b1b"/></svg>
   <b>15k</b><span>Pilot customers in the Companion cohort</span></div>
 </div></div>

<div class="lbl" style="margin:2px 2px -2px">Five problems Dialogue Monitoring solves</div>
<div class="row c5"><div class="card pc"><span class="pn">P1</span><h3>Manual review is not scalable</h3><p>Reviewing every conversation works for ExpertBot&rsquo;s Day-1 volume, not for the Group volume the product is designed to reach.</p><div class="big"><b>~41k / month</b><span>Group complaints at end state, vs ~650 in Companion today</span></div></div><div class="card pc"><span class="pn">P2</span><h3>Higher risk only surfaces with prioritisation</h3><p>Material risk is rare and spread across 32 risk dimensions, so random samples review the wrong conversations.</p><div class="big"><b>every 2 h</b><span>the queue is re-ranked by risk as new scores arrive</span></div></div><div class="card pc"><span class="pn">P3</span><h3>Risk dimensions speak different languages</h3><p>11 guardrails and 21 business rules produce continuous (0&ndash;1), ordinal (1&ndash;5) or binary (yes / no) outputs, so they cannot simply be added up.</p><div class="big"><b><span style="font-size:16px;white-space:nowrap;color:inherit">32 Dimensions &rarr; 1 Score</span></b><span>risk dimensions, in 3 output types, combined into one score</span></div></div><div class="card pc"><span class="pn">P4</span><h3>No ground truth for the LLM judge</h3><p>Pre-production evals used synthetic and out-of-time data; there were no labelled production conversations to benchmark the judge.</p><div class="big"><b>0 &rarr; 100%</b><span>of reviewed conversations labelled on every eval, incl. rubrics</span></div></div><div class="card pc dark"><span class="pn">P5</span><h3>Review of review needed on Day 1</h3><p>With 100% human review, reviewer accuracy is the control. Without a second look, wrong labels and missed risk go unnoticed.</p><div class="big"><b>4-eye</b><span>peer check designed in from Day 1</span></div></div></div>

<div class="card ba"><div class="lbl">Before &rarr; after: from spot checks to a ranked, same-day review</div>
 <div class="flw"><div class="fs pain"><b><i>1</i>Conversation ends</b><p>Transcript sits across chat, case and contact-centre systems</p></div><div class="fs pain"><b><i>2</i>Manual extract</b><p>Reports pulled by hand; no view of what was already reviewed</p></div><div class="fs pain"><b><i>3</i>Random spot check</b><p>Reviewer picks conversations without knowing which are risky</p></div><div class="fs pain"><b><i>4</i>Notes in a spreadsheet</b><p>Findings are free text, not labels a model can learn from</p></div><div class="fs pain"><b><i>5</i>Issues found late or never</b><p>No second review; vulnerability or advice misses reach no one</p></div></div><div class="flw"><div class="fs ai"><b><i>1</i>Every message ingested</b><p>ExpertBot and chat events stitched into one conversation</p></div><div class="fs ai"><b><i>2</i>Scored every 2 hours</b><p>11 guardrails and 21 business rules normalised and weighted into one score</p></div><div class="fs ai"><b><i>3</i>Ranked queue, same day</b><p>Highest risk first, with some random picks to find blind spots</p></div><div class="fs ai"><b><i>4</i>Checklist review</b><p>True positive, false positive or false negative per guardrail</p></div><div class="fs ai"><b><i>5</i>Flag, remediate, peer review</b><p>Regulatory issues alert risk instantly; a peer checks a sample</p></div></div></div></div><script>

.shl{display:flex;justify-content:space-between;margin-left:162px;font-size:10.5px;color:#6b6b6b}</style></head><body><header class="hd"><div><div class="eyebrow">HRD<span class="dot">&bull;</span>02 Product vision &amp; strategy</div><h1>Success Metrics: One North Star, Four Drivers, Measurable at Every Level</h1></div><span class="tagx">Sample targets</span></header><div class="stack">
<div class="ns"><div><span class="chip">1 · North Star</span><h2>Assurance effectiveness</h2>
 <p>% of material AI-risk conversations correctly identified and actioned within the review SLA. It rewards finding the right conversations, judging them correctly and acting in time.</p></div>
 <div class="tg"><small>Target</small><b>&ge; 95%</b></div></div>

<div class="lbl" style="margin:2px 2px -2px">2 · Key drivers</div>
<div class="row c4"><div class="card" style="border-top:4px solid #2f6fd6"><div style="display:flex;align-items:center;gap:8px"><span class="pn" style="background:#2f6fd6;color:#fff">A</span><b style="font-size:14px">Data completeness</b></div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:6px"><span style="font-size:11.5px;color:#555">Conversations ingested, stitched and scored</span><b style="font-size:21px;font-weight:900;white-space:nowrap">100%</b></div></div><div class="card" style="border-top:4px solid #1f8a4c"><div style="display:flex;align-items:center;gap:8px"><span class="pn" style="background:#1f8a4c;color:#fff">B</span><b style="font-size:14px">Prioritisation</b></div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:6px"><span style="font-size:11.5px;color:#555">Confirmed issues found in the top 20% of the queue</span><b style="font-size:21px;font-weight:900;white-space:nowrap">&ge; 95%</b></div></div><div class="card" style="border-top:4px solid #7b61ff"><div style="display:flex;align-items:center;gap:8px"><span class="pn" style="background:#7b61ff;color:#fff">C</span><b style="font-size:14px">Review quality</b></div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:6px"><span style="font-size:11.5px;color:#555">Peer reviewer agrees with the first review</span><b style="font-size:21px;font-weight:900;white-space:nowrap">&ge; 90%</b></div></div><div class="card" style="border-top:4px solid #b8860b"><div style="display:flex;align-items:center;gap:8px"><span class="pn" style="background:#b8860b;color:#fff">D</span><b style="font-size:14px">Review speed</b></div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:6px"><span style="font-size:11.5px;color:#555">Reviewed the same day the conversation closes</span><b style="font-size:21px;font-weight:900;white-space:nowrap">100%</b></div></div></div>

<div class="card sc"><div class="lbl">3 · Granular metrics &middot; success scorecard <span class="mut" style="text-transform:none;letter-spacing:0;font-weight:600">&mdash; hover a metric for its definition</span></div>
<div class="row c4"><div class="mcol"><h4>Operations</h4><small>Reviewer capacity and workforce planning</small><div class="mi" title="Share of the day&#39;s queue reviewed before close of business."><span>Clearance rate</span><em>100%</em></div><div class="mi" title="Begin Review to submit, from the review system events. Matches the CxB review-time target."><span>Time per review</span><em>&lt; 25 min</em></div><div class="mi" title="Every submitted review re-checked by a second reviewer, without overwriting it."><span>Peer-review</span><em>100%</em></div><div class="mi" title="Reviewer sessions to align on borderline cases."><span>Calibration sessions</span><em>Fortnightly</em></div><div class="mi" title="Conversations from previous days still awaiting review at the start of the day."><span>Backlog at day start</span><em>0</em></div></div><div class="mcol"><h4>Risk &amp; control</h4><small>Catching what real-time guardrails missed</small><div class="mi" title="Misses found by review, each logged as a guardrail gap with an owner."><span>Guardrail false negatives caught</span><em>100%</em></div><div class="mi" title="Flagged conversations remediated or closed within 24 hours."><span>Flags actioned within SLA</span><em>&ge; 95%</em></div><div class="mi" title="A Yes on the compliance question alerts the risk platform automatically."><span>Regulatory alerts raised same day</span><em>100%</em></div><div class="mi" title="Conversations with exposed personal information locked from view."><span>Personal-information locks</span><em>100%</em></div><div class="mi" title="Every flagged customer impact has an owner and a closed date."><span>Remediation tracked to closure</span><em>100%</em></div></div><div class="mcol"><h4>Data &amp; AI quality</h4><small>Labels a model can learn from</small><div class="mi" title="Share of expected model scores present; re-scored when late scores arrive."><span>Score completeness (&kappa;)</span><em>= 1</em></div><div class="mi" title="Agreement between reviewer labels and the LLM judge on the same conversations."><span>Human vs LLM-judge agreement</span><em>&ge; 85%</em></div><div class="mi" title="Risk weights re-tuned against reviewer labels every 3 weeks."><span>Risk-weight review</span><em>3 weeks</em></div><div class="mi" title="Consumed event IDs reconciled against the source topic; none dropped."><span>Events reconciled</span><em>100%</em></div><div class="mi" title="Labels and scores available to model owners every day."><span>Export freshness</span><em>Daily</em></div></div><div class="mcol"><h4>Technology</h4><small>Platform service levels</small><div class="mi" title="Scoring customised to run every 2 hours, so reviewers work on current scores the same day."><span>Score refresh</span><em>every 2 h</em></div><div class="mi" title="First render and each reviewer action."><span>Page render and actions</span><em>&lt; 5 s</em></div><div class="mi" title="Supported simultaneous users."><span>Concurrent reviewers</span><em>100</em></div><div class="mi" title="Time from a conversation closing to it being ingested and scored in the review queue (95th percentile)."><span>Ingestion latency</span><em>P95 &le; 120 mins</em></div><div class="mi" title="Dashboard available around the clock."><span>Dashboard availability</span><em>24&times;7</em></div></div></div></div>

</style></head><body><header class="hd"><div><div class="eyebrow">HRD<span class="dot">&bull;</span>03 Solution &amp; architecture</div><h1>One Ranked Queue for Every ExpertBot Conversation: Re-Scored Every 2 Hours, Reviewed by a Person the Same Day, Fed Back into the Models</h1></div></header><div class="stack">
<section class="pivot"><div class="pv-k"><b>Key pivot</b><span>Human oversight</span></div>
 <div class="pv-s"><em>Started with</em>A person approving AI replies live, in a browser extension</div>
 <div class="pv-s"><em>Evidence</em>Ops capacity, customer wait, FTE cost cancelling the benefit, and an end-of-life platform</div>
 <div class="pv-s on"><em>Pivoted to</em>Autonomous ExpertBot with guardrails, plus 100% same-day human review in Dialogue Monitoring</div>
 <div class="pv-s"><em>Result</em>No customer waits for a human, yet every conversation is still checked within a day</div>
 <a class="pv-go" href="#/HRD/5" target="_top" onclick="try{window.top.location.hash='#/HRD/5';return false}catch(e){}">Trade-off 1 &rarr;</a></section><nav class="tabs" role="tablist" style="grid-template-columns:repeat(2,1fr)"><button class="tab on" role="tab" data-p="how" aria-selected="true"><i>1</i>How It Works</button><button class="tab" role="tab" data-p="arch" aria-selected="false"><i>2</i>Architecture</button></nav><section class="pane" id="p-how" role="tabpanel"><div class="card dg"><div class="lbl">How a conversation becomes a place in the queue &middot; sample conversation, 5 turns</div><div class="sc"><div class="hd0">Risk dimension</div><div class="hd0">Score per turn</div><div></div><div class="st"><span>1</span>Pool<small>top-2 turns &middot; rules: Episodes capped at 2</small></div><div></div><div class="st"><span>2</span>Normalise<small>percentile vs last 30 days &middot; rules pass through</small></div><div></div><div class="st"><span>3</span>Weight<small>cost of a miss</small></div><div></div><div></div><div></div><div></div><div class="mg"><svg viewBox="0 0 40 200" preserveAspectRatio="none"><path d="M2 20 C 26 20, 22 100, 38 100 M2 60 C 26 60, 24 100, 38 100 M2 100 L38 100 M2 140 C 26 140, 24 100, 38 100 M2 180 C 26 180, 22 100, 38 100" fill="none" stroke="#b38f00" stroke-width="2"/></svg></div><div class="rk"><span class="sn">4</span><small>Risk score</small><b>0.64</b><em>Weighted average of the 5 dimensions</em></div><div class="ar2">&rsaquo;</div><div class="pr2"><span class="sn">5</span><small>Priority</small><b>#4</b><em>of 31 in today&rsquo;s queue &middot; risk &divide; T + Gumbel noise</em></div><div class="dm"><b>Vulnerability</b><small>Guardrail &middot; continuous 0&ndash;1</small></div><div class="tc"><span class="tr"><i class="ht" style="background:#ece3bd" title="Turn 1: 0.08"></i><i class="ht pk" style="background:#e3dab6" title="Turn 2: 0.12"></i><i class="ht" style="background:#e8dfba" title="Turn 3: 0.10"></i><i class="ht pk" style="background:#dcd4b1" title="Turn 4: 0.15"></i><i class="ht" style="background:#eae1bc" title="Turn 5: 0.09"></i></span></div><div class="ar">&rsaquo;</div><div class="sv1">avg top 2 &rarr; 0.14</div><div class="ar">&rsaquo;</div><div class="sv2"><b>0.40</b><span>40th</span></div><div class="ar">&rsaquo;</div><div class="wt">&times;3</div><div class="dm"><b>Complaint</b><small>Guardrail &middot; continuous 0&ndash;1</small></div><div class="tc"><span class="tr"><i class="ht" style="background:#817d6a" title="Turn 1: 0.55"></i><i class="ht pk" style="background:#5d5a4e" title="Turn 2: 0.71"></i><i class="ht" style="background:#716d5e" title="Turn 3: 0.62"></i><i class="ht pk" style="background:#48463e" title="Turn 4: 0.80"></i><i class="ht" style="background:#686557" title="Turn 5: 0.66"></i></span></div><div class="ar">&rsaquo;</div><div class="sv1">avg top 2 &rarr; 0.76</div><div class="ar">&rsaquo;</div><div class="sv2"><b>0.82</b><span>82nd</span></div><div class="ar">&rsaquo;</div><div class="wt">&times;3</div><div class="dm"><b>Groundedness</b><small>Guardrail &middot; continuous 0&ndash;1</small></div><div class="tc"><span class="tr"><i class="ht" style="background:#d1c9a8" title="Turn 1: 0.20"></i><i class="ht pk" style="background:#afa88e" title="Turn 2: 0.35"></i><i class="ht" style="background:#d5cdac" title="Turn 3: 0.18"></i><i class="ht pk" style="background:#bab396" title="Turn 4: 0.30"></i><i class="ht" style="background:#c6be9f" title="Turn 5: 0.25"></i></span></div><div class="ar">&rsaquo;</div><div class="sv1">avg top 2 &rarr; 0.33</div><div class="ar">&rsaquo;</div><div class="sv2"><b>0.61</b><span>61st</span></div><div class="ar">&rsaquo;</div><div class="wt">&times;2</div><div class="dm g2"><b>Speak to a human</b><small>Business rule &middot; binary yes / no</small></div><div class="tc g2"><span class="tr"><i class="hb" title="Turn 1: Not triggered">0</i><i class="hb" title="Turn 2: Not triggered">0</i><i class="hb on" title="Turn 3: Triggered">1</i><i class="hb" title="Turn 4: Not triggered">0</i><i class="hb on" title="Turn 5: Triggered">1</i></span></div><div class="ar">&rsaquo;</div><div class="sv1 g2">2 episodes &rarr; 1.0</div><div class="ar">&rsaquo;</div><div class="sv2 g2"><b>1.00</b><span>passes through</span></div><div class="ar">&rsaquo;</div><div class="wt g2">&times;1</div><div class="dm g2"><b>Ref third party</b><small>Business rule &middot; binary yes / no</small></div><div class="tc g2"><span class="tr"><i class="hb" title="Turn 1: Not triggered">0</i><i class="hb on" title="Turn 2: Triggered">1</i><i class="hb on" title="Turn 3: Triggered">1</i><i class="hb" title="Turn 4: Not triggered">0</i><i class="hb" title="Turn 5: Not triggered">0</i></span></div><div class="ar">&rsaquo;</div><div class="sv1 g2">1 episode &rarr; 0.5</div><div class="ar">&rsaquo;</div><div class="sv2 g2"><b>0.50</b><span>passes through</span></div><div class="ar">&rsaquo;</div><div class="wt g2">&times;1</div></div><div class="lg"><span><i class="ht pk" style="background:#5f5c50"></i> peak turns used in pooling</span><span><i class="hb on">1</i> rule triggered</span><span>Two separate triggers = 2 episodes; consecutive triggers = 1 episode</span><span>Weights illustrative (3 / 3 / 2 / 1 / 1)</span></div></div><div class="row c2 hw"><div class="card sg"><div class="lbl">Built-in safeguards</div><div class="sgi"><span class="sn2">1</span><div><b>Long, safe chat?</b> Fixed by top-2 pooling: Only the two riskiest turns count, so length alone can&rsquo;t raise the score.</div></div><div class="sgi"><span class="sn2">2</span><div><b>Missing score?</b> Scored with &kappa; &lt; 1 and flagged in the queue; re-scored when the late score arrives.</div></div><div class="sgi"><span class="sn2">5</span><div><b>Why temperature + Gumbel noise?</b> <span class="tq">&divide; T (0.002)</span> stretches small risk gaps so the queue stays risk-led; <span class="tq">+ noise</span> adds a small random nudge so a few lower-risk chats   <ul class="cl" style="font-size:12px">
   <li><b>Cost of a miss, not frequency:</b> A missed vulnerable customer or advice breach outweighs a language slip</li>
   <li><b>Agreed with risk</b> before go-live, then tuned in a simulation environment on pilot conversations</li>
   <li><b>Model trust:</b> Core model 3, secondary 2, weak signal 1 within each dimension</li>
   <li><b>Goal:</b> Seeded known misses and any rule breach rank high enough to be reviewed first</li>
   <li><b>Review cadence:</b> Re-tuned within 3 months of go-live, then yearly, against reviewer labels</li>
   <li><b>Sampling:</b> Temperature T = 0.002 keeps the queue risk-led while still exploring</li></ul></div></div></section><section class="pane" id="p-arch" role="tabpanel" hidden>

.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.qs div{background:#faf6e6;border-radius:8px;padding:6px 7px}.qs b{display:block;font-size:17px;font-weight:800}.qs span{font-size:10px;color:#555}

.per{display:flex;flex-direction:column}.per ul.cl{min-height:78px}.story{flex:1;margin-top:8px;padding:8px 9px;border-radius:8px;background:#faf6e6;font-size:11px;color:#333}.story b{display:block;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#6b6b6b;margin-bottom:4px}.story p{font-size:11px;margin:2px 0;line-height:1.35}.story em{display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#7a5a00}
