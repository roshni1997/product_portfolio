<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product management portfolio</title>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  FILE MAP                                                            ║
  ║  1. <style>     shell styles + SECTION KIT (reusable page styles)    ║
  ║  2. <script>    EDIT HERE (projects/stages) + engine                 ║
  ║  3. SECTIONS    one <template id="PROJECT-STAGE"> per page, at the   ║
  ║                 bottom of the file. Add / edit pages there only.     ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<style>
:root{--y:#FFCC00;--band:#F7C948;--ink:#1b1b1b;--mut:#6b6b6b;--line:#e7e7e7;--bg:#f3f3f1;--soft:#faf6e6;--hl:#fff5cc;--info:#eaf4fb;
  --blue:#2f6fd6;--purple:#7b61ff;--green:#1f8a4c;--red:#c9372c;
  --CXB:#F7C948;--HRD:#F7C948;--ACC:#F7C948;--SPF:#F7C948}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.eyebrow .dot{color:var(--band);margin:0 4px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--y);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.logo svg{width:22px;height:22px}
.band{display:inline-flex;align-items:center;gap:8px;background:var(--c,var(--band));color:var(--on,#2b2200);font-weight:800;font-size:14px;padding:9px 24px 9px 18px;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,10px 50%)}
.band svg{width:16px;height:16px}
.band.dark{background:var(--ink);color:var(--y)}
.bar{display:flex;gap:3px}
.bar i{flex:1;height:6px;border-radius:3px;background:#ececec}
.bar i.done{background:var(--band)}
.t{display:inline-block;font-size:10.5px;font-weight:500;line-height:1.3;border-radius:10px;padding:2px 8px;background:#f4f4f4;color:#444}
.live .t,.t.hl{background:var(--hl);color:#5c4600}
.pill{display:inline-block;font-size:10px;font-weight:600;border-radius:10px;padding:1px 7px;background:#dff3e6;color:#1b5e33;flex:none}
.pill.amber{background:#fff1c2;color:#7a5a00}.pill.red{background:#fdecea;color:#9a2015}.pill.blue{background:#d6e9ff;color:#0b4a8f}

/* ================= Home ================= */
/* first-visit guide + stage hover hint */
.guide{display:flex;align-items:center;gap:12px;background:#fffbe9;border:1px solid #efdc8f;border-left:4px solid var(--y);border-radius:12px;padding:10px 14px;font-size:12.5px;color:#3d3d3d;line-height:1.45}
.guide .gi{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:800;font-size:12px;font-style:italic}
.guide b{color:var(--ink)}
.guide kbd{font:inherit;font-size:11px;font-weight:700;background:#fff;border:1px solid #d9d9d4;border-bottom-width:2px;border-radius:5px;padding:0 5px}
.guide button{flex:none;margin-left:auto;border:0;background:var(--ink);color:var(--y);font-weight:800;font-size:12px;border-radius:999px;padding:6px 14px}
.step{cursor:pointer}
.step::after{content:attr(data-hint);position:absolute;left:22px;bottom:calc(100% - 2px);z-index:5;white-space:nowrap;font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:8px;padding:5px 10px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s}
.step:hover::after,.step:focus-visible::after{opacity:1;transform:none}
.step:not(.live)::after{background:#6b6b6b}
.step.pulse{animation:stepPulse 1.8s ease-in-out infinite}
@keyframes stepPulse{0%,100%{box-shadow:0 0 0 0 rgba(247,201,72,0)}50%{box-shadow:0 0 0 4px rgba(247,201,72,.55)}}
.step.pulse::after{content:"Start here: click to open the first stage →";opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.step.pulse{animation:none}}

header.top.intro{justify-content:flex-start;gap:24px;padding:22px 26px;flex-wrap:nowrap;border-top:5px solid var(--y)}
header.top.intro .me{flex:none;width:108px;height:108px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--y),0 6px 16px -8px rgba(0,0,0,.35)}
header.top.intro .who{min-width:0}
header.top.intro h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:3px 0 4px;text-transform:uppercase}
header.top.intro .role{font-size:14.5px;font-weight:600;color:#2b2b2b;max-width:none;margin:0 0 10px}
header.top.intro .role i{font-style:normal;color:#c9c9c4;margin:0 6px}
header.top.intro .ct{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;font-size:12.5px;color:#555}
header.top.intro .ct li{display:flex;align-items:center;gap:6px}
header.top.intro .ct a{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none;border-bottom:1px solid transparent}
header.top.intro .ct a:hover{color:var(--ink);border-bottom-color:var(--y)}
header.top.intro .ct svg{width:15px;height:15px;flex:none;fill:none;stroke:#8a8a85;stroke-width:1.8;stroke-linejoin:round}

/* dark intro theme */
header.top.intro{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#2a2a2a 0%,#141414 55%,#0d0d0d 100%);border:0;border-top:5px solid var(--y);color:#f2f2f2;box-shadow:0 10px 30px -14px rgba(0,0,0,.55)}
header.top.intro::after{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.22),rgba(255,204,0,0) 70%);pointer-events:none}
header.top.intro>*{position:relative;z-index:1}
header.top.intro .eyebrow{color:#a9a9a9}
header.top.intro .eyebrow .dot{color:var(--y)}
header.top.intro h1{color:#fff}
header.top.intro .role{color:var(--y)}
header.top.intro .role i{color:#5a5a5a}
header.top.intro .ct{color:#cfcfcf}
header.top.intro .ct svg{stroke:var(--y)}
header.top.intro .ct a:hover{color:#fff;border-bottom-color:var(--y)}
header.top.intro .me{border-color:#141414;box-shadow:0 0 0 3px var(--y),0 10px 24px -10px rgba(0,0,0,.8)}
@media (max-width:700px){header.top.intro{flex-direction:column;text-align:center}header.top.intro .ct{justify-content:center}header.top.intro h1{font-size:23px}}

.page{max-width:1360px;margin:0 auto;padding:18px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
header.top{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
header.top h1{font-size:20px;margin:2px 0 4px;font-weight:700;letter-spacing:-.3px}
header.top p{font-size:12.5px;color:#5a5a5a;max-width:760px;line-height:1.5}
.progress{flex:none;width:300px}
.progress .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.progress .name{font-size:13px;font-weight:600;margin:4px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.proj{padding:16px 16px 12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ph h2{font-size:14.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;flex:1;min-width:0}
.ph .cnt{flex:none;font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.cols{display:grid;grid-template-columns:var(--nw,212px) minmax(0,1fr);gap:0 10px;padding:8px 6px 6px 36px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.steps{margin:0 0 0 14px;border-left:2px solid #d9d9d9}
.step{position:relative;display:grid;grid-template-columns:var(--nw,212px) minmax(0,1fr);gap:4px 10px;align-items:center;padding:9px 8px 9px 22px;margin-left:-1px;border-radius:8px;transition:background .15s}
.step::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;width:12px;height:12px;border-radius:50%;border:3px solid var(--c);background:#fff}
.step.live::before{background:var(--c)}
.step:hover{background:var(--soft)}
.step .nm{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
.step .n{font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.step .go{margin-left:auto;opacity:0;transition:.15s;font-weight:700}
.step:hover .go{opacity:1}
.step:not(.live) .nm span:not(.n){color:#555}
.topics{display:flex;flex-wrap:wrap;gap:4px}
.step .topics{flex-wrap:nowrap;gap:4px;overflow:hidden}
.step .nm>span:first-child{white-space:nowrap}
.step .t{flex:none;white-space:nowrap;font-size:10.5px;font-weight:600;line-height:1.3;border-radius:6px;padding:3px 7px;background:#f6f6f4;border:1px solid #e3e3df;color:#555;transition:transform .15s,box-shadow .15s}
.step .live .t,.step.live .t{background:var(--hl);border-color:rgba(0,0,0,.1);color:#5c4600}
.step:hover .t{box-shadow:0 2px 6px -3px rgba(0,0,0,.35)}
.disc{margin:0;padding:0 4px;font-size:11.5px;font-style:italic;font-weight:300;color:#8a8a85}
footer{margin-top:auto;font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;padding:0 4px}


/* compact intro bar on every section page */
.mebar{flex:none;display:flex;align-items:center;gap:14px;height:44px;padding:0 16px;background:radial-gradient(120% 220% at 100% 0%,#2a2a2a 0%,#141414 60%,#0d0d0d 100%);border-bottom:3px solid var(--y);color:#d4d4d4;font-size:11.5px;overflow:hidden;white-space:nowrap}
.mebar .me{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--y)}
.mebar .nm{color:#fff;font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;flex:none}
.mebar .role{margin:0;color:var(--y);font-weight:600;flex:none}
.mebar .role i{font-style:normal;color:#5a5a5a;margin:0 5px}
.mebar .ct{list-style:none;display:flex;gap:14px;margin:0 0 0 auto;padding:0;min-width:0;overflow:hidden}
.mebar .ct li{display:flex;align-items:center;gap:5px;flex:none}
.mebar .ct a{display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none}
.mebar .ct a:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--y)}
.mebar .ct svg{width:13px;height:13px;fill:none;stroke:var(--y);stroke-width:1.8;stroke-linejoin:round;flex:none}
@container shell (max-width:1250px){.mebar .ct li:first-child{display:none}}
@container shell (max-width:1050px){.mebar .role{display:none}}
@container shell (max-width:700px){.mebar .ct{display:none}}
/* ================= Section view: slim rail + full-height content + prev/next ================= */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);height:100vh;container:shell / inline-size}   /* rules inside query the (scaled) shell, not the window */
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:10px 8px;overflow:auto}
.rail .home{display:flex;align-items:center;gap:8px;padding:4px;border-radius:8px;font-size:12px;font-weight:700}
.rail .home:hover{background:var(--soft)}
.rail .home .logo{width:28px;height:28px;border-radius:8px}.rail .home .logo svg{width:14px;height:14px}
.rail .home small{display:block;font-size:10.5px;font-weight:500;color:var(--mut)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.sw a{text-align:center;font-size:10.5px;font-weight:700;padding:5px 0;border-radius:6px;border:1px solid var(--line)}
.sw a:hover{border-color:var(--ink)}
.sw a.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.rail .pn{font-size:10.5px;line-height:1.35;color:var(--mut);padding:0 4px}
.rl{display:flex;flex-direction:column;gap:2px;border-left:2px solid #e2e2e2;margin-left:9px}
.ri{position:relative;display:flex;gap:6px;align-items:baseline;padding:6px 6px 6px 14px;margin-left:-1px;border-radius:6px;font-size:12px;font-weight:600;color:#555;line-height:1.3;white-space:nowrap}
.ri::before{content:"";position:absolute;left:-6px;top:9px;width:8px;height:8px;border-radius:50%;border:2px solid var(--c);background:#fff}
.ri.live::before{background:var(--c)}
.ri .n{font-size:10px;font-weight:700;color:var(--mut)}
.ri:hover{background:var(--soft);color:var(--ink)}
.ri.on{background:var(--ink);color:var(--y)}.ri.on .n{color:var(--y);opacity:.7}
.rail .prog{margin-top:auto;font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:0 4px}
.rail .prog .bar{margin-top:5px;gap:2px}.rail .prog .bar i{height:4px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.view{flex:1;min-height:0;display:flex;position:relative}
.view>*{flex:1;min-width:0}
.view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.foot{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:#fff;border-top:1px solid var(--line)}
.foot .mid{font-size:11.5px;font-weight:600;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;border:1px solid var(--ink);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.btn:hover{background:#f6f6f6}
.btn.p{background:var(--ink);color:#fff}.btn.p:hover{background:#333}
.btn.off{visibility:hidden}
.soon{flex:0 1 620px!important;margin:auto;padding:24px 26px}
.soon .hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.soon h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.soon .topics{margin:6px 0 18px}
.soon .ph2{border:2px dashed #ddd;border-radius:12px;padding:30px;text-align:center;color:var(--mut);font-size:13px;background-image:radial-gradient(#e2e2e2 1px,transparent 1px);background-size:16px 16px}
.soon .ph2 b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* ================= SECTION KIT — reusable building blocks for inline pages =================
   .sec-h            compact page header (eyebrow / h1 / p)
   .wrap             fills the remaining height; add .cols-2 / .cols-3 / .cols-12 (1:2) to split
   .card             white panel  ·  .lbl small caps label  ·  ul.clean bullet list
   .kpi              big number tile  ·  table.tbl  ·  .sticky note  ·  .pill(.amber/.red/.blue)
   .band(.dark)      chevron stage band  ·  .flow  horizontal chevron flow (put .band items inside)
   .t                topic tag  ·  .muted grey text  ·  .row flex row with gap
*/
.sec{display:flex;flex-direction:column;min-height:0;overflow:auto;font-size:13px;line-height:1.45}
.sec-h{margin:10px 10px 0;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 16px;flex:none}
.sec-h h1{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:1px 0 2px}
.sec-h p{font-size:12px;color:#5a5a5a;max-width:900px}
.wrap{flex:1;padding:10px;display:grid;gap:10px;align-content:start}
.cols-2{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-12{grid-template-columns:1fr 2fr}
.span-all{grid-column:1/-1}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px 16px;min-width:0}
.card h2{font-size:14px;font-weight:700;margin-bottom:8px}
.card h3{font-size:12.5px;font-weight:700;margin:10px 0 4px}
.card p+p{margin-top:6px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.muted{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
ul.clean{list-style:none}ul.clean li{padding:3px 0 3px 14px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:2px;background:var(--band)}
.sec .t{font-size:11px;padding:2px 9px;background:var(--hl);color:#5c4600}
.sticky{background:#f9e3a0;font-size:12px;line-height:1.45;padding:10px 12px;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi>span{font-size:11.5px;color:var(--mut)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th,table.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.flow{display:flex;gap:4px;flex-wrap:wrap}.flow .band{font-size:12px;padding:8px 22px 8px 16px}
.span-2{grid-column:span 2}
/* .fill = placeholder you still need to replace with a real figure — easy to spot, search "class=\"fill\"" */
.tbd{display:inline-block;border:1.5px dashed #e0a800;background:#fffbe8;color:#8a6500;border-radius:5px;padding:0 5px;font-weight:700;font-size:.92em;font-style:normal}
.foot .q{display:inline-flex;gap:4px;align-items:center}.foot .q i{font-style:normal;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#f1f1ef;color:#9a9a95}.foot .q i.on{background:var(--y);color:#2b2200}
.fill{display:inline-block;border:1.5px dashed #e0a800;background:#fffbe8;color:#8a6500;border-radius:5px;padding:0 5px;font-weight:700;font-size:.9em}

@media (max-width:1050px){.grid{grid-template-columns:1fr}.progress{width:100%}}
@container shell (max-width:900px){.cols-2,.cols-3,.cols-12{grid-template-columns:1fr}.span-2{grid-column:auto}}
@media (max-width:700px){
  .page{padding:10px;gap:10px}header.top{padding:14px}.cols{display:none}.step{grid-template-columns:1fr}.step .topics{flex-wrap:wrap}.ph{flex-wrap:wrap}footer{flex-direction:column}
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}
  .rail .pn,.rail .prog{display:none}.rl{flex-direction:row;overflow-x:auto;border:0;margin:0;width:100%}.ri{padding:5px 8px;white-space:nowrap}.ri::before{display:none}
  .view{min-height:calc(100vh - 140px)}.view iframe{min-height:900px}.foot{position:sticky;bottom:0}
}
</style>
<!-- GoatCounter visitor analytics: dashboard at https://roshni1997.goatcounter.com
     Counts the landing page as "/" and each project page as e.g. "/CXB/1".
     Add ?ref=name to a shared link (before any #) to see which link a visitor used. -->
<script>
window.goatcounter = { no_onload: true };
let gcLast = null;
function gcHit() {
  const gc = window.goatcounter;
  if (!gc || !gc.count) return;
  const path = location.hash.replace(/^#/, "") || "/";
  if (path === gcLast) return;
  const first = gcLast === null;
  gcLast = path;
  gc.count({ path, referrer: first ? (new URLSearchParams(location.search).get("ref") || document.referrer) : "" });
}
window.addEventListener("hashchange", gcHit);
</script>
<script data-goatcounter="https://roshni1997.goatcounter.com/count" async src="//gc.zgo.at/count.js" onload="gcHit()"></script>
</head>
<body>
<div id="home"></div>
<div class="shell" id="shell" hidden>
  <aside class="rail" id="rail"></aside>
  <main class="main"><header class="mebar" id="mebar"></header><div class="view" id="view"></div><nav class="foot" id="foot"></nav></main>
</div>

<script>
/* =====================================================================
   EDIT HERE — portfolio content (section pages live at the bottom of the file)
   ===================================================================== */
const OWNER = "Product management portfolio";
const INTRO = "Six-stage case studies across four products — from business context and customer journey through to decisions, guardrails and measured impact.";

const PROJECTS = [

const accent = p => `--c:var(--${p.code});--on:${p.on}`;

const SG = pc => STAGES.slice(0, NS(pc));
const ORDER = PROJECTS.flatMap(p => SG(p.code).map((_, si) => ({ p: p.code, si })));
let TPL = {}, done = 0, bars = "";
const cache = {};   // rendered sections stay mounted → instant switching, state preserved

/* Title Case for stage names and focus areas: capitalise each word (also after "/"), keep acronyms as written,
   keep short joining words (and, of, to ...) lower case unless they come first. */
const SMALLW = new Set(["a", "an", "and", "as", "at", "by", "for", "in", "of", "on", "or", "the", "to", "vs", "via", "with"]);
const TC = s => String(s).split(" ").map((w, i) => w.split("/").map((p, j) =>
  (i + j > 0 && SMALLW.has(p.toLowerCase())) ? p : p.replace(/^([^A-Za-z]*)([a-z])/, (m, a, c) => a + c.toUpperCase())).join("/")).join(" ");
const stg = (p, si) => { const s = Object.assign({}, STAGES[si], STAGE_OVERRIDE[key(p, si)]); s.name = TC(s.name); s.short = TC(s.short); return s; };   // stage with any per-project override applied
const isLive = (p, si) => !!TPL[key(p, si)];
const topicsOf = (p, si) => { const t = TPL[key(p, si)]; return (t && t.dataset.topics ? t.dataset.topics.split("|") : stg(p, si).topics).map(x => TC(x.trim())); };
const topicPills = (p, si, cls = "") => topicsOf(p, si).map(t => `<span class="t ${cls}">${esc(t.trim())}</span>`).join("");

function landing() {
  document.title = OWNER;

    <button type="button" id="guideOk">Got it</button>
  </div>
  <main class="grid">${PROJECTS.map(p => {
    return `<section class="proj panel" style="${accent(p)};--nw:${(Math.max(...SG(p.code).map((_, si) => stg(p.code, si).name.length)) * 6.9 + 6).toFixed(0)}px" aria-label="${esc(p.name)}">
      <div class="ph"><span class="band">${svg(p.code)}${esc(p.label || p.code)}</span>${p.hideName ? "<h2></h2>" : `<h2>${esc(p.name)}</h2>`}</div>

      <div class="steps">${SG(p.code).map((_, si) => `

          <span class="nm"><span>${esc(stg(p.code, si).name)}</span><span class="go">→</span></span>
          <span class="topics">${topicPills(p.code, si)}</span>

  <footer><span>${esc(OWNER)}</span><span>Tap any stage to open it · ← → keys move between sections</span></footer></div>`;
  const g = $("guide"), first = document.querySelector(".proj .step.live");
  const done = () => { localStorage.setItem("pf_guide_seen", "1"); g.hidden = true; first && first.classList.remove("pulse"); };
  if (g && !g.hidden) { first && first.classList.add("pulse"); $("guideOk").onclick = done; document.querySelectorAll(".proj .step").forEach(s => s.addEventListener("click", done)); }

/* Mount a section once: data-mode="frame" → isolated iframe (heavy standalone prototypes);
   default → inline, shares the SECTION KIT styles, near-instant. */
function mount(k, title) {
  const t = TPL[k];
  if (t.dataset.mode === "frame") {
    const f = document.createElement("iframe");
    f.title = title; f.srcdoc = "<!doctype html>" + t.innerHTML;
    return f;
  }
  const el = document.createElement("div");
  el.className = "sec"; el.id = "sec-" + k;
  el.appendChild(t.content.cloneNode(true));
  el.querySelectorAll("script").forEach(old => {   // run inline scripts; `root` = this section
    try { new Function("root", old.textContent)(el); } catch (e) { console.error(k, e); }
    old.remove();
  });
  return el;
}

function sectionPage(pc, si) {
  const p = PROJECTS.find(x => x.code === pc), s = stg(pc, si), k = key(pc, si);
  const idx = ORDER.findIndex(x => x.p === pc && x.si === si), prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const navBtn = (x, dir) => x
    ? `<a class="btn ${dir > 0 ? "p" : ""}" href="${href(x.p, x.si)}">${dir < 0 ? "← " : ""}${x.p} · ${pad(x.si + 1)} ${esc(stg(x.p, x.si).short)}${dir > 0 ? " →" : ""}</a>`
    : `<span class="btn off"></span>`;
  document.title = `${pc} · ${s.name}`;
  $("home").hidden = true; $("shell").hidden = false; fitShell();
  $("shell").setAttribute("style", accent(p));
  $("rail").innerHTML = `
    <a class="home" href="#/"><span class="logo">${LOGO}</span><span>Portfolio<small>← All projects</small></span></a>
    <div class="sw">${PROJECTS.map(x => `<a href="${href(x.code, Math.min(si, NS(x.code) - 1))}" class="${x.code === pc ? "on" : ""}" title="${esc(x.name)}">${x.code}</a>`).join("")}</div>
    <div class="pn">${esc(p.name)}</div>
    <nav class="rl">${SG(pc).map((_, i) => stg(pc, i)).map((x, i) => `<a class="ri ${i === si ? "on" : ""} ${isLive(pc, i) ? "live" : ""}" href="${href(pc, i)}" title="${esc(x.name)}"><span class="n">${pad(i + 1)}</span>${esc(x.short)}</a>`).join("")}</nav>
    <div class="prog">${done} / ${ORDER.length} live<div class="bar">${bars}</div></div>`;
  if (!$("mebar").innerHTML) {
    const src = document.createElement("div"); src.innerHTML = INTRO_HTML;
    $("mebar").innerHTML = `<img class="me" src="${ME}" alt="Roshni Musaddi"><b class="nm">Roshni Musaddi</b>${src.querySelector(".role").outerHTML}${src.querySelector(".ct").outerHTML}`;
  }
  const mid = `<span class="mid">${pc} · ${pad(si + 1)} / ${pad(NS(pc))} · ${esc(s.name)}</span>`;
  $("foot").innerHTML = `${navBtn(prev, -1)}${mid}${navBtn(next, 1)}`;

  const view = $("view");
  for (const el of view.children) el.hidden = true;
  if (isLive(pc, si)) {
    if (!cache[k]) view.appendChild(cache[k] = mount(k, `${pc} · ${s.name}`));
    cache[k].hidden = false;
  } else {
    let ph = $("soon");
    if (!ph) { ph = Object.assign(document.createElement("div"), { id: "soon", className: "soon panel" }); view.appendChild(ph); }
    ph.hidden = false;
    ph.innerHTML = `<div class="hd"><span class="band">${svg(s.icon)}${pc}</span><div><div class="eyebrow">Stage ${pad(si + 1)} of ${pad(NS(pc))}</div><h1>${esc(s.name)}</h1></div></div>
      <div class="eyebrow">Key topics</div><div class="topics">${topicPills(pc, si, "hl")}</div>
      <div class="ph2"><b>Coming soon</b>This section is being built.</div>`;
  }
}

/* Auto-fit: stage pages are laid out on a ~1440x900 canvas. On any other laptop screen the shell is given the
   same logical height (900px) and scaled to the real viewport, so every page keeps the layout it was designed at. */
function fitShell() {
  const sh = $("shell"), vw = window.innerWidth, vh = window.innerHeight;
  if (!sh || sh.hidden) { document.body.style.overflow = ""; return; }
  if (vw < 600 || vw < vh * 0.9) { sh.style.cssText = ""; document.body.style.overflow = ""; return; }   // phones / portrait: stacked mobile layout
  const k = Math.min(1.6, Math.max(0.45, Math.min(vh / 900, vw / 1380)));   // any landscape window: scale the 1380x900 design to fit
  sh.style.cssText = `width:${vw / k}px;height:${vh / k}px;transform:scale(${k});transform-origin:0 0;container-type:size`;
  document.body.style.overflow = "hidden";
}
window.addEventListener("resize", fitShell);
function route() {
  const [, pc, s] = location.hash.split("/");
  const si = +s - 1;
  if (PROJECTS.some(p => p.code === pc) && si >= 0 && si < NS(pc)) sectionPage(pc, si); else landing();
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const [, pc, s] = location.hash.split("/");
  if (!pc || !s) return;
  const idx = ORDER.findIndex(x => x.p === pc && x.si === +s - 1);
  const go = x => x && (location.hash = href(x.p, x.si));
  if (e.key === "ArrowRight") go(ORDER[idx + 1]);
  if (e.key === "ArrowLeft") go(ORDER[idx - 1]);
  if (e.key === "Escape") location.hash = "#/";
});
/* Sections are declared at the bottom of the file, so start once the whole document is parsed. */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("template[id]").forEach(t => TPL[t.id] = t);
  done = ORDER.filter(x => isLive(x.p, x.si)).length;
  bars = ORDER.map(x => `<i class="${isLive(x.p, x.si) ? "done" : ""}"></i>`).join("");
  window.addEventListener("hashchange", route);
  route();
});
</script>

<template id="CXB-1" data-topics="Scope|Friction points|Before/after|AI redesign|RG 271">
<div class="stack">

  <!-- Header -->
  <div class="ptop">
    <div class="eyebrow">CXB <span class="dot">•</span> 01 Opportunity discovery</div>
    <h1>Making Digital the Preferred Channel for Complaints</h1>
  </div>

  <!-- My role -->
  <div class="role">
    <b>My role</b>
    <span><i>Title</i>Product Manager</span>
    <span><i>Owned</i>Problem framing, Success metrics, AI risk controls, Pilot readiness</span>
    <span><i>Team</i>PM + Data Science + Software Engineering + Risk &amp; Compliance</span>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div>
      <span class="tag">Complaints Expert</span>
      <h2>Customers who complain in chat are pushed out of it, and the complaints that get through are slow to capture and hard to trust</h2>
      <p>ExpertBot, an AI agent inside mobile banking app, captures the complaint in conversation, creates the case in Firstpoint automatically and hands over to a specialist who resolves it in real time.</p>
    </div>
    <div class="hr2">
      <div class="lbl">What happens to monthly Digital complaints today</div>
      <div class="dn-wrap">
        <div class="donut" role="img" aria-label="60% do not proceed, 35% use the web form, 5% call"><div><b>60%</b><span>give up</span></div></div>
        <ul class="dl">
          <li><i class="sw1"></i><b>~60%</b> Never lodged, so dissatisfaction is not recorded</li>
          <li><i class="sw2"></i><b>~35%</b> Use the web form (1–30+ days to resolve)</li>
          <li><i class="sw3"></i><b>~5%</b> Call and are handled by frontline</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- Story: three problems and the redesign -->
  <div class="lbl sl">Three problems ExpertBot solves</div>
  <section class="story">
    <article><span class="n">P1</span><h3>Customers can't finish in their channel</h3><p>Companion banking agent sends them to alternate channels, and most give up.</p><div class="fig"><b>~60%</b><span>of Companion complaints never lodged</span></div></article>
    <article><span class="n">P2</span><h3>Case managers spend time on admin</h3><p>Staff experience added cognitive load during already pressured interactions</p><div class="fig"><b>45 min</b><span>to capture each complaint, from sub-product and sub-cause complexity · assigned after 24+ hrs</span></div></article>
    <article><span class="n">P3</span><h3>Manual capture lowers data quality</h3><p>Product and cause are classified manually by case managers, so errors flow into reporting downstream.</p><div class="fig"><b>17%</b><span>of classifications changed later · feeds RG 271 reporting</span></div></article>
    <article class="v"><span class="n">→</span><h3>The redesign</h3><p>Capture in chat, classify product and cause with AI, confirm with the customer, create the case automatically.</p><div class="fig"><b>45 → 0 min</b><span>case-manager capture time; their time moves to resolution</span></div></article>
  </section>

  <!-- Tiles -->
  <div class="lbl sl">Explore the detail <span class="hint">Click a tile to open or close it</span></div>
  <nav class="tiles" id="tiles" aria-label="Detail sections"></nav>

  <!-- Panels -->
  <div id="pnl" class="pnl">

    <!-- 0 · one-page summary -->
    <section class="pn" id="p0" hidden>
      <div class="pnh"><div><div class="lbl">One-page Summary</div><h3>The case study in five questions</h3></div><button class="x" data-close aria-label="Close">✕</button></div>
      <p class="ctx"><b>Context.</b> A large regulated retail bank (~18M customers) with an AI assistant, Companion, in its banking app. Complaints were chosen because they are high-volume, regulated under ASIC RG 271, and the one service need that still forced customers out of the digital channel.</p>
      <div class="five">
        <div><span class="q">①</span><h4>Original Workflow</h4><p>Customer complains in Companion → offered web form, phone or post → re-enters the story → case manager keys it into Firstpoint → assigned after 24+ hrs → outcome by email, 1–30+ days.</p></div>
        <div><span class="q">②</span><h4>Friction</h4><p class="fl"><span><b>P1</b> ~60% never lodge.</span><span><b>P2</b> 45 min of capture admin per complaint.</span><span><b>P3</b> 17% of product and cause classifications corrected downstream.</span></p></div>
        <div><span class="q">③</span><h4>AI redesign</h4><p>Intent classification hands over to an agent that extracts what each complaint type needs, checks answer quality, plays back a summary for the customer to confirm, then creates the case by API.</p></div>
        <div><span class="q">④</span><h4>Impact</h4><p>First response 24+ hrs → ≤5 min; Companion channel volume increase by 64%; single interaction resolution ≥90%; product accuracy ≥95%. Initial lean investment: net +7 FTE.</p></div>
        <div><span class="q">⑤</span><h4>Product Thinking</h4><p><b>Key pivot:</b> Scoped H1 to 3 complaint types, since FY24 volume showed Home Loans and Interest rate too high made up ~56% of Group complaints. A human decides every outcome and handles vulnerable customers and disagreements. Guardrails, 21 business rules, end-of-day review, a kill switch and a 15k-customer pilot cohort bound the risk.</p></div>
      </div>
    </section>

    <!-- 1 · before → after workflow -->
    <section class="pn" id="p1" hidden>
      <div class="pnh"><div><div class="lbl">Workflow redesign</div><h3>Before → After: the customer stays in chat, the case manager starts at resolution</h3></div><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="ba">
        <div class="lane old"><div class="lh3"><b>Current workflow</b><span>6 steps · 3 hand-offs · 1–30+ days</span></div>
          <ol>
            <li><b>Customer messages Companion with a complaint</b></li>
            <li><b>Companion offers web form, phone or post</b><em class="pc">P1</em><small>~60% stop here</small></li>
            <li><b>Customer re-enters the story on the form</b></li>
            <li><b>Case manager keys complaint manually via other channels also</b><em class="pc">P2</em><em class="pc">P3</em><small>manual product and cause</small></li>
            <li><b>Case manager assigned after 24+ hrs</b></li>
            <li><b>Complaint resolved by email</b><small>1–30+ days</small></li>
          </ol>
          <p class="lf">Multiple hand-offs, repeated data entry, slower resolution.</p></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="lane new"><div class="lh3"><b>Redesigned workflow</b><span>8 steps · 1 hand-off · near real time</span></div>
          <ol>
            <li><b>Customer complains in Companion</b></li>
            <li><b>Companion identifies complaint intent</b><u>classification</u><em class="pc ok">P1</em></li>
            <li><b>Complaints Expert captures the context</b><u>extraction</u><em class="pc ok">P2</em></li>
            <li><b>Guardrails check every message</b><u>classification</u></li>
            <li><b>Product and cause classified</b><u>classification</u><em class="pc ok">P3</em></li>
            <li><b>Customer confirms a playback summary</b><u>summarisation</u></li>
            <li><b>Case created in Firstpoint automatically</b><u>API</u></li>
            <li><b>Specialist resolves by messaging</b></li>
          </ol>
          <p class="lf">Told once, captured in a consistent format, confirmed by the customer.</p></div>
      </div>
      <div class="c2">
        <div><h4>What changes</h4><ul class="clean"><li>The customer never leaves the chat to lodge the complaint</li><li>Data entry moves from the case manager to the agent, with the customer as the check</li><li>Abandoned complaints are now recorded for RG 271 reporting</li></ul></div>
        <div><h4>What stays the same, and why</h4><ul class="clean"><li>A specialist decides every outcome: accountability stays human</li><li>Firstpoint stays the system of record, so reporting is unchanged</li><li>Web form, phone and post remain as fallbacks, outside hours</li></ul></div>
      </div>
      <a class="go" href="#/CXB/3">See the redesigned journey step by step →</a>
    </section>

    <!-- 2 · friction points -->
    <section class="pn" id="p2" hidden>
      <div class="pnh"><div><div class="lbl">Friction Points</div><h3>Where time, data and customers are lost today</h3></div><button class="x" data-close aria-label="Close">✕</button></div>
      <table class="tbl ft">
        <thead><tr><th>Friction</th><th>Root cause</th><th>Impact</th><th>Problem</th></tr></thead>
        <tbody>
          <tr><td>Redirected out of chat</td><td>Digital capability only offers alternate channels</td><td>~60% don't proceed; dissatisfaction goes unrecorded (RG 271 risk)</td><td><em class="pc">P1</em></td></tr>
          <tr><td>Story told twice</td><td>The web form doesn't carry the chat context</td><td>Repeat effort for the ~35% who do proceed</td><td><em class="pc">P1</em></td></tr>
          <tr><td>Manual capture in Firstpoint</td><td style="white-space:nowrap">Case manager keys the complaint &amp; works through complex sub-product and sub-cause options</td><td>45 min per complaint · 90% of lodged manually</td><td><em class="pc">P2</em></td></tr>
          <tr><td>Slow first contact</td><td>Queue-based assignment once the case is keyed</td><td>Assigned after 24+ hrs; 1–30+ days to resolve</td><td><em class="pc">P2</em></td></tr>
          <tr><td>Simple complaints, complex process</td><td>One route for every complaint</td><td>Simple fee complaints wait like complex cases</td><td><em class="pc">P2</em></td></tr>
          <tr><td>Product and cause classified manually</td><td>Case managers choose from complex sub-product and sub-cause options by hand</td><td>17% changed later; less reliable RG 271 reporting</td><td><em class="pc">P3</em></td></tr>
          <tr><td>Missing details</td><td>Web form static questions not tailored to the complaint type</td><td>Call-backs to the customer · 7% need re-contact</td><td><em class="pc">P3</em></td></tr>
        </tbody>
      </table>
      <div class="why"><b>Why now</b><span>Digital experiences customers love is a strategic priority</span><span>Stronger RG 271 compliance and data quality</span><span>Absorb surges like Oct 2024 (3×) digitally</span></div>
      <div class="hmw"><b>How might we</b> let customers finish their complaint in the channel they chose, free case managers from data entry, and capture complaint data right first time — while staying RG 271 compliant?</div>
    </section>

    <!-- 3 · customer insight and channel strategy -->
    <section class="pn one" id="p3" hidden>
      <div class="pnh"><div><div class="lbl">Customer Insights and Channel Strategy · 17.6M customers</div><h3>Every channel preference is served except smartphone-first customers — so Companion becomes the default complaint channel</h3></div><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="pref">
        <div><span>"I prefer to write a letter"</span><b>Reply Paid post</b><em class="ok">✓ Served</em></div>
        <div><span>"I prefer to speak to someone at a branch"</span><b>~728 branches</b><em class="ok">✓ Served</em></div>
        <div><span>"I've got time to call"</span><b>24/7 call centre</b><em class="ok">✓ Served</em></div>
        <div><span>"I use a PC, not a smartphone"</span><b>Complaints web form</b><em class="ok">✓ Served</em></div>
        <div class="gap"><span>"I do everything on my smartphone"</span><b>Companion chat</b><em class="no">⚠ Redirected out</em></div>
      </div>
      <h4 class="cs">Channel strategy: today vs target end state</h4>
      <div class="cm-lg"><span><i class="today"></i>Today (2024)</span><span><i class="tgt"></i>Target end state</span></div>
      <div class="cm">
        <div class="r"><span class="n">Companion chat</span><div class="bars"><p><i class="today" style="width:1.4%"></i><em>~1%</em></p><p><i class="tgt" style="width:90.3%"></i><em>65%</em></p></div><div class="roles"><u class="cap">Capture</u><u class="as">Assist</u><u class="res">Resolve</u></div></div>
        <div class="r"><span class="n">Phone</span><div class="bars"><p><i class="today" style="width:100%"></i><em>72%</em></p><p><i class="tgt" style="width:27.8%"></i><em>20%</em></p></div><div class="roles"><u class="as">Assist</u></div></div>
        <div class="r"><span class="n">Web form</span><div class="bars"><p><i class="today" style="width:13.9%"></i><em>10%</em></p><p><i class="tgt" style="width:4.2%"></i><em>3%</em></p></div><div class="roles"><u class="cap">Capture</u><u class="res">Resolve</u></div></div>
        <div class="r"><span class="n">In person</span><div class="bars"><p><i class="today" style="width:9.7%"></i><em>7%</em></p><p><i class="tgt" style="width:9.7%"></i><em>7%</em></p></div><div class="roles"><u class="as">Assist</u></div></div>
        <div class="r"><span class="n">Async messaging</span><div class="bars"><p><i class="today" style="width:8.3%"></i><em>6%</em></p><p><i class="tgt" style="width:6.9%"></i><em>5%</em></p></div><div class="roles"><u class="as">Assist</u></div></div>
        <div class="r"><span class="n">Email</span><div class="bars"><p><i class="today" style="width:4.2%"></i><em>3%</em></p><p><em class="muted">To be decommissioned</em></p></div><div class="roles"></div></div>

<script>
const $ = s => root.querySelector(s);
const T = [
  ["One-page Summary",    "The five questions"],
  ["Before → After",      "The workflow redesign"],
  ["Friction Points",     "Root cause and impact"],
  ["Customer Insights and Channel Strategy", "Smartphone-first gap · phone 72% → 20%"]
];
const tiles = $("#tiles"), panels = [...root.querySelectorAll(".pn")];
tiles.innerHTML = T.map((t, i) => `<button class="tile" data-i="${i}" aria-expanded="false" aria-controls="p${i}"><b>${t[0]}</b><span>${t[1]}</span></button>`).join("");
const btns = [...tiles.querySelectorAll(".tile")];
let open = -1;
function show(i, quiet) {
  open = open === i ? -1 : i;
  btns.forEach((b, j) => b.setAttribute("aria-expanded", open === j));
  panels.forEach((p, j) => { p.hidden = open !== j; });
  if (open > -1 && !quiet) $("#pnl").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
tiles.addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) show(+b.dataset.i); });
root.addEventListener("click", e => { if (e.target.closest("[data-close]")) { const i = open; show(i); btns[i].focus(); } });
show(0, true);   // first panel is open when the page loads
</script>

<script>

   Content
   ===================================================================== */
const REF = 'CF-7071943C';
const STAGES = [
  {title:'Companion identifies potential complaint', steps:[
    {id:'1a', name:'Customer awareness of issue',
     desc:'A customer has been unable to resolve an issue they are facing and chooses to message Companion via the CommBank app for support. The user navigates to the Companion icon, is shown the onboarding disclaimers then initiates chat.',
     hint:'Tap the Companion icon on the home screen, then step through the onboarding disclaimers.'},
    {id:'1b', name:'Expression of intent to complain',
     desc:'The customer expresses their intention to make a complaint this may be an explicit statement ‘I want to complain’ or the context of the issue they are facing. Companion leverages the Complaints Guardrail as a Service (GaaS) to identify any potential complaints from the customer’s message.',
     hint:'Type a message or tap a suggested reply. Each suggestion shows a different GaaS result (see Behind the scenes).',
     notes:[`<b>route_to_complaint</b> - The user query expresses intent to lodge a complaint or be redirected to a complaints process, but no dissatisfaction or context is present to ascertain the nature of the complaint.

<b>potential_complaint</b> - The user is expressing dissatisfaction about a CBA product/service or staff or handling of a complaint, and expects a resolution or response (implicitly or explicitly).

<b>uncertain_more_context_required</b> - The user may be expressing dissatisfaction, but there is insufficient information to determine if it is a complaint. More context is needed to ascertain the nature of the complaint.

<b>not_complaint</b> - The user is not expressing dissatisfaction, or the issue does not originate from CBA products/services or staff.`]}
  ]},
  {title:'Complaints Expert triages intent', steps:[
    {id:'2a', name:'Triage of intent',
     desc:'Genuine complaints will move straight to pre qualification of the complaint e.g. account or category selection. Uncertain scenarios where more context is required will be triaged for the customer to confirm if their intent is to lodge a complaint.\n\nWhere the conversation cannot be continued in Companion (e.g. Complaints Expert is offline) the customer will be displayed alternate channels for them to make their complaint e.g. via the web form, phone call or post.',
     hint:'Use the switches on the right to see the alternate-channels path.',
     notes:['Messages generated by Complaints Expert will still appear as sent from Companion - this is just to illustrate the handover between agents.']}
  ]},
  {title:'Complaints Expert chats with customer', steps:[
    {id:'3a', name:'Understand the customer’s issue',
     desc:'Provide the customer and opportunity to share their experience. This information will determine the contextual questions that follow and form the context of the complaint record.\n\nComplaints Expert will continue the conversation with the customer until the required information has been collected. If the customer’s initial message contains sufficient context the complaint may be captured without the need for additional questions.',
     hint:'Answer the Complaints Expert. Leave out the amount to see the Quality Evaluator ask again.',
     notes:[`The <b>Intent</b> node of the Complaints Expert will determine the applicable set of data points requiring capture based on the complaint type.

The expert can select from 3 possible directed acyclic graphs (DAGs)
 • Fees charged on transaction accounts or credit cards
 • Interest rates on home or investment loans
 • Other complaint types

DAGs 1 & 2 will capture targeted data points, DAG 3 will capture more generic information`,
`The experts <b>Information Extractor</b> node works to capture each data point required for the given DAG.

The <b>Quality Evaluator</b> node assesses each customer response contains the relevant information in the required level of detail/format.

The <b>Human Response</b> node is responsible for emulating a human like conversation and aligning with the Group style guide for language & tone in digital experiences.`]},
    {id:'3b', name:'Escalate to staff where urgent (if guardrail triggered)',
     desc:'Each message the customer sends will be evaluated against the Group suite of Guardrails as a Service in addition to complaint specific rules.\n\nThese guardrails and rules will be used to manage risk associated with the conversation and transfer to a staff member to take over via messaging where the customer requires urgent support.',
     hint:'At “What is the reason you’re seeking a refund?”, pick the reply tagged “triggers guardrail”.',
     notes:[`A suite of 11 Group Guardrails as a Service (GaaS) will be configured where if triggered,
 • may transfer the customer to a staff member to continue the conversation
 • display a pre-canned message will information or next steps
 • mask specific words such as profanities or government identifiers`,
`Where a guardrail triggers transferring the conversation to a staff member, the Specialist will receive
 • a summary of the conversation so far
 • the guardrail or rule resulting in transfer
 • the Firstpoint reference for the shell case created

The Specialist will continue the conversation collecting information required to complete capture of the shell complaint record in Firstpoint before resolving the complaint via messaging.`]},
    {id:'3c', name:'Playback the customer’s complaint',
     desc:'Once all required information has been captured, the Complaints Expert will playback the categorisation of the complaint (the product and cause) for the customer to review and confirm the details are correct.\n\nIf the customer responds ‘no’ the Complaints Expert will transfer to a human to take over.',
     hint:'Confirm the summary with “Yes”, or tap “No” to transfer to a human.'}
  ]},
  {title:'Complaint record created in Firstpoint', steps:[
    {id:'4a', name:'Create complaint record',
     desc:'Complaints Expert calls the Firstpoint Create Case API passing the required data to automatically create a complaint record in Firstpoint.',
     hint:'Open the Firstpoint tab on the right to see the staff view of the record.'},
    {id:'4b', name:'Confirm complaint creation',
     desc:'The customer is provided with the reference number for their complaint as formal acknowledgement.\n\nComplaints Expert sets the expectation that a staff member will now take over the conversation to resolve the customer’s issue. A push notification will alert the customer once the staff member has sent a message.',
     hint:'Use the demo controls below the phone to simulate the Specialist’s reply.'}
  ]},
  {title:'Complaint resolved via async messaging', steps:[
    {id:'5a', name:'Resolve complaint',
     desc:'The customer will receive a message from a Complaints Specialist with the outcome of their complaint.\n\nOnce the outcome has been communicated to the customer, the messaging conversation will be closed and the complaint marked as resolved in Firstpoint.',
     hint:'Tap the push notification, then answer the Specialist.'},
    {id:'5b', name:'Escalate complaint to case management',
     desc:'Where the handling team identifies the complaint requires further investigation or cannot be resolved within the messaging interaction, they will advise the customer and assign the case in Firstpoint to the relevant GCR team for case management.\n\nThe current messaging conversation will be closed and any further contact will be made via phone or the Digital Complaints Home.',
     hint:'Use “Fast-forward: case manager assigned” below the phone.'}
  ]},
  {title:'Escalations tracked in Digital Home', steps:[
    {id:'6a', name:'Escalated resolution',
     desc:'GCR will follow the BAU process to resolve the complaint. Progress of the complaint will be tracked via the Digital Complaints Home.\n\nThe customer will be able to communicate with their assigned case manager as well as upload documents if required.',
     hint:'Tap “View message”, then message the case manager or upload a document.'}
  ]}
];
const STEP_ORDER = STAGES.flatMap(s=>s.steps.map(x=>x.id));

const ACCOUNTS = [
  {name:'Smart Access', label:'smart access account', bsb:'062-000', num:'1234 5678', last4:'5678', bal:'$6,381.00', fp:'Transaction and Savings Accounts - Personal Transaction Account'},
  {name:'NetBank Saver', label:'netbank saver account', bsb:'062-000', num:'2345 6789', last4:'6789', bal:'$12,040.55', fp:'Transaction and Savings Accounts - Personal Savings Account'},
  {name:'Platinum Awards', label:'platinum awards credit card', bsb:'Credit card', num:'•••• 1234', last4:'1234', bal:'$10,000.00', fp:'Credit Cards - Personal Credit Card', card:true}
];
const TOPICS = [
  {t:'Digital services', s:'eg. Commbank App, Netbank, CommBiz, Commbank website'},
  {t:'Customer service from CommBank staff'},
  {t:'An application for a loan, card, account, or credit', more:true},
  {t:'A CommBank branch or ATM'},
  {t:'A closed account, card, loan, or policy', more:true}
];
const DAGS = {
  1:'DAG 1 - Fees charged on transaction accounts or credit cards',
  2:'DAG 2 - Interest rates on home or investment loans',
  3:'DAG 3 - Other complaint types'
};
const GUARDRAIL_TABLE = [
  ['Vulnerability','Detects queries indicating customer vulnerability','Input','Cascading','Input','Interactions involving customers experiencing vulnerability should be handled by a human to provide the appropriate level or care and support while capturing the customer’s complaint. Continuing to facilitate the conversation via the expert once circumstances are identified is not appropriate for the use case.'],
  ['Harmful Content','Detects harmful content (sexual, hateful, violent)','Input','LLM','Input','Interactions involving Customers that reference inappropriate or harmful topics should be immediately transferred to a human to follow the Groups Inappropriate Customer Behaviour process.'],
  ['Jailbreaking','Detects attempts to bypass LLM restrictions','Input','Cascading','Input','Interactions where Customers attempt to elicit inappropriate responses, access restricted information or execute potentially harmful operations using AI embedded in the Group’s services should immediately transfer to a human to mitigate the risk of exploitation.'],
  ['Off Topic','Detects queries about politics, sensitive issues, illegal activities','Input','LLM','Input','Scenarios where Customers attempt to divert the Complaints Expert conversation away from the capture of their complaint should result in a pre-canned response advising the customer that topic is outside the experts capability and attempt to continue the conversation about capture of their complaint.'],
  ['Groundedness','Validates RAG responses against source documents','Output','Cascading','Output','Required to ensure responses generated by the Complaints Expert are only relevant to the capture of the customers complaint and within the context of the conversation. The expert should not be able to provide information, guidance or answer questions in general, especially where unrelated to capture of the customers complaint.'],
  ['Financial Advice','Identifies financial product advice in responses','Output','Cascading','Output','Required to prevent the possibility of the Complaints Expert providing information that could constitute financial advice in scenarios where the response is determined as within the context of the conversation according to the Groundedness GaaS.'],

/* ---------- mock GaaS classifier ---------- */
function classify(t){
  const s=t.toLowerCase().replace(/[‘’]/g,"'");
  const explicit=/\b(complain\w*|complaint|lodge|dispute)\b/.test(s);
  const product=/(fee|charg|interest|rate|account|card|loan|refund|transaction|branch|atm|app\b|netbank|staff|payment|overdraw|mortgage)/.test(s);
  const dissat=/(not happy|unhappy|disappoint|frustrat|annoy|upset|terrible|awful|\bbad\b|poor|wrong|incorrect|unfair|shouldn'?t|should not|ripped|angry|sick of|ridiculous|rude|unacceptable)/.test(s);
  if(explicit && !dissat && !product) return 'route_to_complaint';
  if(explicit || (dissat && product)) return 'potential_complaint';
  if(dissat) return 'uncertain_more_context_required';
  return 'not_complaint';
}
const GAAS_LABEL = {
  route_to_complaint:['True: Route to Complaint','route'],
  potential_complaint:['True: Potential Complaint','route'],
  uncertain_more_context_required:['False: Uncertain, Context required','uncertain'],
  not_complaint:['False: Not Complaint','not']
};

function runGuardrails(text){
  let shown=text, masked=false;
  if(PII_RE.test(text)){ shown=text.replace(PII_RE, m=>'•'.repeat(Math.max(4,m.replace(/\D/g,'').length))); masked=true; }
  PII_RE.lastIndex=0;
  const norm=text.replace(/[‘’]/g,"'");
  const hit = GUARDS.find(g=> g.re ? g.re.test(norm) : g.test(text));
  if(masked) log('guard hit','Sensitive data masked','A number that looks like a card/account/government identifier was masked before storage.');
  if(hit) log('guard hit',`${hit.name} guardrail triggered`, hit.action==='transfer' ? 'Action: transfer the conversation to a staff member' : 'Action: show pre-canned message, then continue');
  else log('guard','Input guardrails passed','Vulnerability · Harmful Content · Jailbreaking · Off Topic · Language Check · PII masking');
  return {shown, hit};
}

async function onUserText(text){
  text=(text||'').trim();
  if(!text || S.busy) return;
  const aw=S.await;
  if(S.input!=='free' && !(aw && aw.free)) return;
  let shown=text, hit=null;
  if(S.agent==='ce'){ const r=runGuardrails(text); shown=r.shown; hit=r.hit; }
  pushUser(esc(shown)); S.await=null; S.suggestions=[]; S.input='disabled'; render();
  if(S.agent==='companion') return companionHandle(text);
  if(hit && hit.action==='transfer') return guardrailTransfer(hit, text);
  if(hit && hit.action==='canned'){ await bot('ce', hit.canned); if(aw) return aw.reask(); return; }
  if(aw && aw.onAnswer) return aw.onAnswer(text);
  S.input='free'; render();
}

function extractAmount(t){ const m=t.match(/\$\s?(\d+(?:[.,]\d{1,2})?)/)||t.match(/(\d+(?:\.\d{1,2})?)\s?(dollars|aud|bucks)/i); return m?m[1]:null; }
function extractDate(t){
  const months='january|february|march|april|may|june|july|august|september|october|november|december';
  const m=t.match(new RegExp(`(\\d{1,2})(?:st|nd|rd|th)?\\s*(?:of\\s*)?(${months}|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\\w*\\s*(\\d{4})?`,'i'));
  if(m){
    const full=months.split('|').find(x=>x.startsWith(m[2].toLowerCase().slice(0,3)));
    const yr=m[3] || new Date().getFullYear();
    return `${parseInt(m[1])} ${full[0].toUpperCase()+full.slice(1)} ${yr}`;
  }
  const n=t.match(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/); if(n) return n[0];
  const r=t.match(/\b(yesterday|today|last week|last month|last (monday|tuesday|wednesday|thursday|friday|saturday|sunday))\b/i); return r?r[0]:null;
}

async function onFeeDetails(t){
  S.cap.amount = S.cap.amount || extractAmount(t);
  S.cap.date = S.cap.date || extractDate(t);
  if(!S.cap.amount || !S.cap.date){
    const missing = !S.cap.amount ? 'amount' : 'date';
    log('node','Quality Evaluator: response incomplete', `Missing ${missing} - asking again`);
    const q = missing==='amount' ? `Thanks. And how much was the ${S.cap.feeTerm}? For example, $10.` : `Thanks. And what date were you charged? For example, 17 January.`;
    return ask('ce', q, {free:true, onAnswer:onFeeDetails, suggestions:[{text: missing==='amount'?'$10':'17th of January'}]});
  }
  log('node','Quality Evaluator: passed', `Amount $${S.cap.amount} · Date ${S.cap.date}`);
  return askReason();
}
async function askReason(){
  await ask('ce','What is the reason you’re seeking a refund?',{free:true, onAnswer:t=>{
      S.cap.reason=t; S.cap.outcome=`Refund of the $${S.cap.amount} fee`;
      log('node','Information Extractor','Captured: reason & outcome sought');
      return playback();
    }, suggestions:[
      {text:'I had money coming in that day so I don’t think the fee should apply'},
      {text:'I’ve already told you guys how much I’m struggling financially, I’m so sick of repeating it. I want to speak to someone now.', tag:'triggers guardrail', alt:true}
  ]});
}
function summaryLines(){
  const c=S.cap, a=c.account;
  const about = a ? `your <b>${a.label}</b> ending in <b>${a.last4}</b>` : (c.topic ? `<b>${esc(c.topic.toLowerCase())}</b>` : 'your <b>account</b>');
  const concern = c.dag===1 ? 'fee charging' : c.dag===2 ? 'interest rates' : (c.topic ? 'service' : 'your experience');
  const impact = c.amount ? `$${c.amount}` : 'non-financial';
  return {about, concern, impact};
}
async function playback(){
  setStage('3c');
  const {about,concern,impact}=summaryLines();
  await ask('ce',`Thanks, here’s a summary of your complaint<br><br>Your complaint is about ${about}<br><br>Your concern relates to <b>${concern}</b><br><br>The financial impact to you is <b>${impact}</b><br><br>Is this correct?`,
    {chips:[{label:'Yes', fn:lodge},{label:'No', fn:disputePlayback}]});
}
async function disputePlayback(){
  setStage('3c');
  log('hand','Transfer to human','Customer disputed the playback summary');
  createRecord(true);
  await bot('ce','No problem. I’ll hand this over to one of our specialists who can make sure we get it right.');
  sys('status','Specialist invited');
  S.agent='specialist'; setStage('4a'); setStage('5a'); render();
  await wait(700);
  await ask('specialist','Hi Jane, I’m a complaints specialist and I’ve read your conversation. What would you like me to correct?',{free:true, onAnswer:async t=>{
    S.cap.correction=t; updateRecord();
    await bot('specialist','Thanks, I’ve updated your complaint. I’ll review it now and message you here shortly.');
    S.phase='awaitOutcome'; S.input='wait'; render();
  }});
}
async function guardrailTransfer(hit, text){
  setStage('3b');
  if(hit.name==='Vulnerability') S.vulnerable=true;
  createRecord(true);
  log('hand','Transfer to Specialist',`Specialist receives:\n • Summary of the conversation so far\n • Guardrail: ${hit.name}\n • Firstpoint shell case ${REF}`);
  await bot('ce','To make sure you get the right support, I’m handing this over to one of our specialists, who’ll take it from here and reply soon.<br><br>You can always find me on the Help page if you need help with something else.');
  sys('status','Specialist invited');
  S.agent='specialist'; setStage('4a'); setStage('5a'); render();
  await wait(900);
  if(hit.name==='Vulnerability'){
    await ask('specialist',`Hi Jane, I can see you mentioned you are experiencing some financial hardship.<br><br>Lets take a look at how we can support you then resolve the issue with the ${S.cap.feeTerm||'fee'}.<br><br>Does that sound ok?`,
      {free:true, chips:[{label:'Yes', fn:specialistAck},{label:'No', fn:specialistAck}], onAnswer:specialistAck});
  } else {
    await bot('specialist','Hi Jane, I’ve joined the conversation to help with your complaint. I’ll review what you’ve shared so far and get back to you shortly.');
    S.phase='awaitOutcome'; S.input='wait'; render();
  }
}
async function specialistAck(){
  log('node','Specialist completing shell record','Capturing remaining data points in Firstpoint');
  if(!S.cap.reason) S.cap.reason='Customer indicated financial hardship';
  if(!S.cap.outcome && S.cap.amount) S.cap.outcome=`Refund of the $${S.cap.amount} fee`;
  updateRecord();
  await bot('specialist','Thanks Jane. I’ve added a note so you won’t need to repeat your circumstances. I’ll review the fee now and message you here shortly.');
  S.phase='awaitOutcome'; S.input='wait'; render();
}

/* ---------- Firstpoint ---------- */
function createRecord(shell){
  if(S.fp) return;
  S.fp={ref:REF, status: shell?'Shell case - Specialist capturing':'Pending Manager Review', badge:'OPEN-INVESTIGATION', shell:!!shell, created:nowTime()};
  log('api',`Firstpoint Create Case API → 201 Created`, `${REF} ${shell?'(shell case)':''}\nChannel: Companion - Complaints Expert`);
  updateRecord();
}
function updateRecord(){ if(S.fp) S.fp.cap=JSON.parse(JSON.stringify(S.cap)); }
async function lodge(){
  setStage('4a');
  log('node','Customer confirmed playback','Summary confirmed');
  createRecord(false);
  await wait(500);
  setStage('4b');
  await bot('ce',`Done, I’ve lodged your complaint and forwarded our conversation to our complaints team. Your complaint reference number is ${REF}.<br><br>I’ll leave you with the humans. You can find me on the Help page if you need help with a different enquiry.`);
  sys('time', nowTime());
  sys('status','Specialist invited');
  sys('check','Conversation saved to your Help page');
  sys('check','Topic updated to Complaints');
  sys('notify');
  S.agent='specialist'; S.phase='awaitOutcome'; S.input='wait'; render();
}

/* ---------- Specialist outcome ---------- */
function outcome(kind){
  if(S.busy || S.phase!=='awaitOutcome') return;
  S.phase=null;
  if(FAST){ S.screen='chat'; return kind==='resolve'?specialistResolve():specialistEscalate(); }
  S.screen='home'; S.overlay=null;
  S.push={title:'CommBank', body:`Specialist: You have a new message about your complaint ${REF}`, go:kind};
  log('api','Push notification sent','Specialist replied in messaging');
  render();
}
function tapPush(){ const k=S.push.go; S.push=null; S.screen='chat'; render(); return k==='resolve'?specialistResolve():specialistEscalate(); }
async function specialistResolve(){
  setStage('5a'); S.agent='specialist';
  const c=S.cap;
  const body = c.dag===1 && c.amount
    ? `Hi Jane, I’ve looked into the ${c.feeTerm} charged due to insufficient balance on your account.<br><br>Since it’s the first time this has happened to you, I will refund the fee. You’ll see the $${c.amount} returned in 24-48 hours.<br><br>Has this resolved your issue?`
    : `Hi Jane, thanks for your patience. I’ve reviewed your complaint and I’m sorry for your experience. I’ve arranged for this to be put right and you’ll receive confirmation within 2 business days.<br><br>Has this resolved your issue?`;
  await ask('specialist', body, {chips:[{label:'Yes', fn:resolved},{label:'No', fn:specialistEscalate}]});
}
async function resolved(){
  await bot('specialist','Great, thanks Jane. I’ll close this conversation now. You can find it on your Help page any time.');
  sys('closed','Conversation closed by Specialist');
  S.fp.status='Resolved'; S.fp.badge='RESOLVED';
  log('api','Firstpoint case updated',`${REF} → Resolved`);
  S.input='closed'; S.phase='done'; render();
}
async function specialistEscalate(){
  setStage('5b'); S.agent='specialist';
  await bot('specialist','Your complaint requires further investigation.<br><br><b>What’s next?</b><br>We’ll assign your case to a complaint manager for review.<br><br>They will typically respond in 2-3 working days.<br><br>Set up push notifications in the CommBank app to get alerts for messages and updates on your complaint.');
  sys('closed','Conversation closed by Specialist');
  S.fp.status='Assigned to GCR - Case Management';
  log('api','Firstpoint case reassigned',`${REF} → GCR Case Management queue`);
  S.input='closed'; S.phase='awaitCM'; render();
}
function caseManagerAssigned(){
  setStage('6a'); S.phase='cm';
  S.fp.status='Under review - Case Manager assigned';
  S.cmMsgs=[{from:'Alex, Complaint Manager', text:`Hi Jane, I’m Alex and I’ll be managing your complaint ${REF}. I’m reviewing the details and may ask for supporting documents, such as a bank statement. I’ll update you here within 2-3 working days.`, t:nowTime()}];
  log('api','Case manager assigned','Customer notified via Digital Complaints Home');
  S.screen='home'; S.overlay='review'; render();
}
async function sendCm(){
  const el=document.getElementById('cmInput'); const t=el.value.trim(); if(!t) return;
  S.cmMsgs.push({from:'You', text:t, t:nowTime(), me:true}); el.value=''; render();
  const g=GEN; await wait(1200); if(g!==GEN) return;
  S.cmMsgs.push({from:'Alex, Complaint Manager', text:'Thanks Jane, I’ve received your message and added it to your complaint.', t:nowTime()}); render();
}
function addFiles(input){
  [...input.files].forEach(f=>S.files.push({name:f.name, size:Math.max(1,Math.round(f.size/1024))+' KB'}));
  if(input.files.length){ log('api','Document uploaded to Firstpoint', S.files.map(f=>f.name).join(', ')); }
  render();
}

/* ---------- reset & jump ---------- */
function reset(){ GEN++; FAST=false; S=freshState(S); render(); }
async function jump(id){
  if(id===S.stage && !S.busy) return;
  GEN++; S=freshState(S);
  FAST=true;
  try{
    const NORMAL="I had money coming in that day so I don’t think the fee should apply";
    const toCapture = async ()=>{ await onUserText('I want to make a complaint'); await chipByLabel('Yes'); await chipByLabel('Existing account'); await confirmAccount(0); };
    const toReason = async ()=>{ await toCapture(); await onUserText('I have been incorrectly charged an overdrawing fee on my account'); await chipByLabel('Yes'); await onUserText('$10 on the 17th of January this year.'); };
    S.onboarded = id!=='1a';
    S.screen = id==='1a' ? 'home' : 'chat';
    switch(id){
      case '1a': break;
      case '1b': setStage('1b'); S.suggestions=defaultSuggestions(); break;
      case '2a': await onUserText('I’m not happy with the service I received'); break;
      case '3a': await toCapture(); break;
      case '3b': await toReason(); break;
      case '3c': await toReason(); await onUserText(NORMAL); break;
      case '4a': case '4b': await toReason(); await onUserText(NORMAL); await chipByLabel('Yes'); break;
      case '5a': await toReason(); await onUserText(NORMAL); await chipByLabel('Yes'); await outcome('resolve'); break;
      case '5b': await toReason(); await onUserText(NORMAL); await chipByLabel('Yes'); await outcome('escalate'); break;
      case '6a': await toReason(); await onUserText(NORMAL); await chipByLabel('Yes'); await outcome('escalate'); caseManagerAssigned(); break;
    }
  } catch(e){ if(!e.abort) console.error(e); }
  FAST=false;
  if(id==='3b'){ setStage('3b'); }
  if(id==='4a'){ setStage('4a'); }
  render();
  if(id==='3b'){ await onUserText('I’ve already told you guys how much I’m struggling financially, I’m so sick of repeating it. I want to speak to someone now.'); }
}

  return [

    {text:'I’m not happy with the service I received', tag:'uncertain', alt:true},

}

  S.busy=false; S.typing=null; S.await=null; S.suggestions=[]; S.overlay=null; S.input='disabled';

function msgsHTML(){
  let out=`<div class="date">${new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}, ${nowTime().toLowerCase()}</div>`;
  let last=null;
  S.msgs.forEach(m=>{
    if(m.from==='user'){ out+=`<div class="user ${m.kind==='acct'?'acct':''}">${m.html}</div>`; last='user'; return; }
    if(m.from==='system'){
      if(m.kind==='status') out+=`<div class="status">${I.specialist}${m.html}</div>`;
      else if(m.kind==='check') out+=`<div class="check"><span>${I.check}${m.html}</span></div>`;
      else if(m.kind==='time') out+=`<div class="center">${m.html}</div>`;
      else if(m.kind==='closed') out+=`<div class="closed"><span>${m.html}</span></div>`;
      else if(m.kind==='notify') out+=`<div class="ncard">${I.info}<div><b>We’ll notify you when a specialist responds</b>You can close your app and check back here any time.</div></div>`;
      last='system'; return;
    }
    if(m.from!==last) out+=whoLabel(m.from);
    out+=`<div class="bot ${m.from==='companion'?'cmp':''}">${m.html}</div>`;
    if(m.feedback) out+=`<div style="display:flex;gap:12px;margin:-2px 0 10px">${I.copy}${I.thumbU}${I.thumbD}</div>`;
    last=m.from;
  });

}

}
